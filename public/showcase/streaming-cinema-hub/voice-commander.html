<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Cinema Hub - Voice Commander</title>
  <link rel="stylesheet" href="voice-commander.css">
</head>
<body>
  <div class="commander-container">
    <div class="header-section">
      <h1>Cinema Voice Command &amp; Audio Dispatcher</h1>
      <p>Hands-Free Web Speech Playback Control &amp; Accessibility Navigator</p>
    </div>

    <div class="mic-hero">
      <button class="mic-btn" id="micToggleBtn" title="Toggle Listening">🎙</button>
      <div class="status-text" id="micStatusText">Click mic or type command below</div>
    </div>

    <div class="input-bar">
      <input type="text" id="manualVoiceInput" placeholder="Speak or type (e.g. 'play movie', 'pause', 'subtitles on', 'volume max')">
      <button class="btn-submit" id="submitVoiceBtn">Dispatch</button>
    </div>

    <div class="history-box">
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">Command Feed</div>
      <div id="commandHistoryList"></div>
    </div>
  </div>

  <script type="module" src="voice-commander.js"></script>
</body>
</html>
