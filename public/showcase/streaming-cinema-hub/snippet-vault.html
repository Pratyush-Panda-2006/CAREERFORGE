<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Cinema Hub - Snippet Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-container">
    <header class="vault-header">
      <div class="vault-title-wrap">
        <h1>🎬 Cinema Streaming Preset Vault</h1>
        <p>HLS multi-bitrate ladders, Dolby Vision HDR master matrices, and spatial audio Atmos profiles</p>
      </div>
    </header>

    <section class="vault-controls">
      <div class="search-box-row">
        <div class="search-input-wrap">
          <input type="text" id="searchQueryInput" class="search-input" placeholder="Search streaming ladders, manifests, or specs (e.g. 4k, hdr, atmos, webvtt)...">
        </div>
      </div>
      <div id="tagFilterBar" class="tag-filter-bar">
        <!-- Rendered by snippet-vault.js -->
      </div>
    </section>

    <main id="snippetsGrid" class="snippets-grid">
      <!-- Rendered by snippet-vault.js -->
    </main>
  </div>

  <div id="copyToast" class="toast">Spec copied to clipboard!</div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
