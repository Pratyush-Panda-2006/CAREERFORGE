<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption Haven - Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <div class="header-section">
      <div>
        <h1>Pet Adoption Haven Audit Ledger</h1>
        <p>Immutable State History &amp; Cryptographic Proof of Animal Care Chain</p>
      </div>
      <div>
        <span class="status-pill status-pass" id="chainStatusPill">VERIFIED</span>
      </div>
    </div>

    <div class="toolbar">
      <select id="eventTypeSelect">
        <option value="PET_ADOPTED">Pet Adopted</option>
        <option value="INTAKE_LOGGED">Intake Logged</option>
        <option value="VET_EXAM_PASSED">Vet Exam Passed</option>
        <option value="FOSTER_PLACED">Foster Placed</option>
      </select>
      <input type="text" id="petNameInput" placeholder="Animal name / ID">
      <button class="action-btn" id="recordEventBtn">Commit Event</button>
      <button class="action-btn" id="verifyChainBtn" style="background: transparent; color: var(--text-main); border: 1px solid var(--border-subtle);">Verify Ledger</button>
    </div>

    <div class="chain-scroll" id="auditChainList"></div>
  </div>

  <script type="module" src="audit-trail.js"></script>
</body>
</html>
