<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption Haven - Telemetry Stress Benchmark Suite</title>
  <link rel="stylesheet" href="./telemetry-stress-tester.css">
</head>
<body class="pet-benchmark-theme">
  <div class="benchmark-container">
    <header class="benchmark-header">
      <div class="header-brand">
        <span class="status-indicator"></span>
        <h2>Pet Adoption Haven Telemetry Stress Benchmark</h2>
      </div>
      <div id="ratingBadge" class="rating-badge badge-neutral">STANDBY</div>
    </header>

    <div class="controls-card">
      <div class="input-group">
        <label for="iterationsInput">Match Matrix Iterations:</label>
        <input type="number" id="iterationsInput" value="1000" min="100" max="10000" step="100">
      </div>
      <button id="startBenchmarkBtn" class="benchmark-btn">Run Benchmark</button>
    </div>

    <div class="progress-bar-container">
      <div id="benchmarkProgress" class="progress-fill"></div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-title">Composite Score</span>
        <span id="compositeScoreVal" class="metric-value">--</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Effective Frame Rate</span>
        <span id="fpsVal" class="metric-value">--</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Frame Jitter</span>
        <span id="jitterVal" class="metric-value">--</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Memory Allocation</span>
        <span id="memoryVal" class="metric-value">--</span>
      </div>
    </div>
  </div>

  <script type="module" src="./telemetry-stress-tester.js"></script>
</body>
</html>
