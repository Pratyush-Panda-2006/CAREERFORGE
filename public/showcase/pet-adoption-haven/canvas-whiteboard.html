<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption Haven - Whiteboard Canvas & Vector Sketchpad</title>
  <link rel="stylesheet" href="./canvas-whiteboard.css">
</head>
<body class="pet-whiteboard-theme">
  <div class="whiteboard-app-container">
    <header class="whiteboard-header">
      <div class="header-brand">
        <span class="pen-icon">🐾</span>
        <h2>Pet Adoption Haven Collaborative Whiteboard</h2>
      </div>
      <div class="header-actions">
        <button id="btnClearCanvas" class="action-btn-secondary">Clear Canvas</button>
        <button id="btnExportSVG" class="action-btn-primary">Export Vector SVG</button>
      </div>
    </header>

    <div class="toolbar-floating-dock">
      <div class="tool-group">
        <button class="tool-btn active" data-wb-tool="pen">Pen</button>
        <button class="tool-btn" data-wb-tool="line">Line</button>
        <button class="tool-btn" data-wb-tool="rectangle">Rect</button>
        <button class="tool-btn" data-wb-tool="eraser">Eraser</button>
      </div>
      <div class="color-palette-group">
        <button class="color-chip active" data-wb-color="#f97316" style="background: #f97316;"></button>
        <button class="color-chip" data-wb-color="#22c55e" style="background: #22c55e;"></button>
        <button class="color-chip" data-wb-color="#38bdf8" style="background: #38bdf8;"></button>
        <button class="color-chip" data-wb-color="#eab308" style="background: #eab308;"></button>
        <button class="color-chip" data-wb-color="#ffffff" style="background: #ffffff;"></button>
      </div>
    </div>

    <div class="canvas-viewport">
      <canvas id="whiteboardCanvas" width="840" height="520"></canvas>
    </div>
  </div>

  <script type="module" src="./canvas-whiteboard.js"></script>
</body>
</html>
