<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Adoption Haven Sound Board</title>
  <link rel="stylesheet" href="audio-synthesizer.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to Pet Adoption Haven</a>
    <h1>Sound board</h1>
    <p>Preview the interface sounds. Everything is generated in the browser, so there are no audio files to load.</p>
    <section class="panel" aria-label="Output">
      <label>Volume <input id="volume" type="range" min="0" max="100" value="40"> <output id="level">40%</output></label>
      <label><input id="mute" type="checkbox"> Mute</label>
    </section>
    <section class="board" aria-label="Sound previews">
      <button type="button" data-sound="click">Click</button>
      <button type="button" data-sound="navigation">Navigation</button>
      <button type="button" data-sound="success">Success</button>
      <button type="button" data-sound="warning">Warning</button>
      <button type="button" data-sound="error">Error</button>
    </section>
    <canvas id="scope" width="640" height="160" role="img" aria-label="Oscilloscope trace of the current sound"></canvas>
    <p id="status" role="status">Pick a sound.</p>
  </main>
  <script type="module" src="audio-synthesizer.js"></script>
</body>
</html>
