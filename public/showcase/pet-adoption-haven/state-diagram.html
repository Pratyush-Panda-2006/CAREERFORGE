<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption Haven - Finite State Machine Visualizer</title>
  <link rel="stylesheet" href="./state-diagram.css">
</head>
<body>
  <div id="fsm-app-container"></div>

  <script type="module">
    import { PetAdoptionHavenFsmVisualizer } from './state-diagram.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('fsm-app-container');
      const fsm = new PetAdoptionHavenFsmVisualizer();
      fsm.renderToDOM(container);
    });
  </script>
</body>
</html>
