<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption Haven - Volunteer Quests & Badges</title>
  <link rel="stylesheet" href="gamified-quest.css">
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #090a0f;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .wrapper {
      width: 100%;
      max-width: 850px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="quest-root"></div>
  </div>

  <script type="module">
    import { PetAdoptionHavenQuestEngine } from './gamified-quest.js';

    const questEngine = new PetAdoptionHavenQuestEngine();
    const root = document.getElementById('quest-root');
    questEngine.renderToDOM(root);
  </script>
</body>
</html>
