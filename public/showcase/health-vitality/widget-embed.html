<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Vitality - Embeddable Vitals Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="widget-header">
      <div class="widget-title">💓 Vitals Pulse Widget</div>
      <div class="sync-badge">
        <span class="sync-dot"></span> CONNECTED
      </div>
    </div>

    <div class="vitals-grid">
      <div class="vital-card" data-metric="heart_rate">
        <div class="label">Heart Rate</div>
        <div class="value">72 <span class="unit">bpm</span></div>
      </div>
      <div class="vital-card" data-metric="spo2">
        <div class="label">Blood Oxygen</div>
        <div class="value">99 <span class="unit">%</span></div>
      </div>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
