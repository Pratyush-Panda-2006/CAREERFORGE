<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Vitality - Telemetry Benchmark Engine</title>
  <link rel="stylesheet" href="benchmark-suite.css">
</head>
<body>
  <div class="bench-container">
    <header class="bench-header">
      <h1>⚡ Health Vitality Telemetry Benchmark Engine</h1>
      <p>Simulate high-frequency biometric load spikes and measure latency percentiles (P50, P95, P99).</p>
    </header>

    <div class="controls-card">
      <input type="number" id="benchmark-iterations" value="2500" min="500" max="50000" step="500">
      <button id="run-benchmark-btn" class="btn-run">Run Benchmark Engine</button>
    </div>

    <div class="metrics-grid">
      <div class="metric-card highlight">
        <div class="label">Throughput</div>
        <div id="metric-ops" class="value">-- ops/s</div>
      </div>
      <div class="metric-card">
        <div class="label">Median Latency (P50)</div>
        <div id="metric-p50" class="value">-- ms</div>
      </div>
      <div class="metric-card">
        <div class="label">P95 Tail Latency</div>
        <div id="metric-p95" class="value">-- ms</div>
      </div>
      <div class="metric-card">
        <div class="label">P99 Worst Spike</div>
        <div id="metric-p99" class="value">-- ms</div>
      </div>
      <div class="metric-card">
        <div class="label">Mean Latency</div>
        <div id="metric-avg" class="value">-- ms</div>
      </div>
    </div>
  </div>

  <script type="module" src="benchmark-suite.js"></script>
</body>
</html>
