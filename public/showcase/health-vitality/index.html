<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VitalityAI — Personalized Health & Longevity</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="pill">🌿 AI-POWERED LONGEVITY</div>
    <h1>Optimize Your Bio-Metrics &amp; Longevity Score</h1>
    <p>Continuous biomarker tracking, personalized metabolic plans, and sleep optimization.</p>
    <button className="cta-btn" onclick="startScan()">Analyze Biomarkers ↗</button>
  </header>

  <main className="metrics">
    <div className="card">
      <div className="icon">❤️</div>
      <h3>Heart Rate Variability</h3>
      <div className="val">68 ms <span className="tag-good">Optimal</span></div>
    </div>
    <div className="card">
      <div className="icon">🌙</div>
      <h3>Deep Sleep Score</h3>
      <div className="val">92% <span className="tag-good">Excellent</span></div>
    </div>
    <div className="card">
      <div className="icon">⚡</div>
      <h3>Metabolic Efficiency</h3>
      <div className="val">8.4 / 10</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
