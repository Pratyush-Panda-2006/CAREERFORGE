<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Studio - Client-Side Export Engine</title>
  <link rel="stylesheet" href="export-engine.css">
</head>
<body>
  <div class="studio-export-container">
    <header class="studio-export-header">
      <div class="header-titles">
        <span class="export-badge">Export Engine</span>
        <h2 class="export-title">Neural Voice Catalog Export</h2>
        <p class="export-subtitle">Serialize vocal models, DSP presets, and vocoder benchmarks client-side</p>
      </div>

      <div class="dropdown-wrapper">
        <button type="button" id="exportDropdownToggle" class="btn-dropdown-toggle">
          <span>Export Options</span>
          <svg class="dropdown-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <div id="exportDropdownMenu" class="dropdown-popover">
          <button type="button" id="btnExportJSON" class="menu-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <div class="menu-text">
              <strong>Download JSON Data</strong>
              <span>Full neural model schema with nested DSP & token attributes</span>
            </div>
          </button>

          <button type="button" id="btnExportCSV" class="menu-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
            <div class="menu-text">
              <strong>Export CSV Table</strong>
              <span>Tabular spreadsheet format compatible with Excel & Sheets</span>
            </div>
          </button>

          <button type="button" id="btnExportMarkdown" class="menu-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M7 15V9l3 4 3-4v6"></path>
              <path d="M17 9v6l-2-2"></path>
            </svg>
            <div class="menu-text">
              <strong>Copy Markdown Audit</strong>
              <span>Catalog summary markdown report ready to paste into documentation</span>
            </div>
          </button>
        </div>
      </div>
    </header>

    <main class="export-preview-card">
      <div class="preview-header">
        <div class="preview-tabs">
          <button type="button" class="preview-tab active" data-mode="json">JSON Preview</button>
          <button type="button" class="preview-tab" data-mode="csv">CSV View</button>
          <button type="button" class="preview-tab" data-mode="markdown">Markdown Summary</button>
        </div>
        <div class="preview-indicator">Live Synthesizer Preview</div>
      </div>

      <pre id="exportPreviewArea" class="preview-code-block"></pre>
    </main>

    <div id="exportToast" class="export-toast"></div>
  </div>

  <script type="module" src="export-engine.js"></script>
</body>
</html>
