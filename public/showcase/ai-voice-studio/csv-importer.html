<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Voice Studio - CSV Data Importer</title>
  <link rel="stylesheet" href="csv-importer.css">
</head>
<body class="importer-body">
  <div class="importer-container">
    <h2>AI Voice Studio CSV Importer</h2>
    <div id="dropzone" class="dropzone">Drop CSV file here or click to upload</div>
    <div id="tableContainer"></div>
  </div>
  <script type="module">
    import { AiVoiceStudioCsvImporter } from './csv-importer.js';
    const imp = new AiVoiceStudioCsvImporter();
    imp.parseCSV('ID,Metric,Status\n1,Active,OK');
  </script>
</body>
</html>
