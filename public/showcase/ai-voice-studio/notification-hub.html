<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Studio - Notification Hub</title>
  <link rel="stylesheet" href="notification-hub.css">
  <style>
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .av-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .av-btn {
      padding: 8px 16px;
      border: 1px solid rgba(192, 132, 252, 0.4);
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .av-btn:hover {
      background: rgba(192, 132, 252, 0.25);
      border-color: #c084fc;
    }
  </style>
</head>
<body>
  <h1>AI Voice Studio Notification Queue</h1>
  <div class="av-controls">
    <button class="av-btn" id="btn-critical">Trigger Buffer Underrun (Critical)</button>
    <button class="av-btn" id="btn-warning">Trigger High Latency (Warning)</button>
    <button class="av-btn" id="btn-success">Trigger Voice Rendered (Success)</button>
    <button class="av-btn" id="btn-info">Trigger Prosody Sync (Info)</button>
    <button class="av-btn" id="btn-clear">Clear All</button>
  </div>

  <div id="hub-root" class="av-notification-hub-container"></div>

  <script type="module">
    import { AiVoiceStudioNotificationHub } from './notification-hub.js';

    const hub = new AiVoiceStudioNotificationHub();
    const container = document.getElementById('hub-root');

    hub.subscribe(() => {
      hub.render(container);
    });

    document.getElementById('btn-critical').addEventListener('click', () => {
      hub.enqueue('Audio buffer underrun detected at frame 48020. Stream glitch prevented.', 'critical', 'critical');
    });

    document.getElementById('btn-warning').addEventListener('click', () => {
      hub.enqueue('Neural inference latency spiked to 240ms on CUDA stream 2.', 'warning', 'warning');
    });

    document.getElementById('btn-success').addEventListener('click', () => {
      hub.enqueue('Voice clone model checkpoint saved successfully. WER benchmark: 1.4%.', 'success', 'success');
    });

    document.getElementById('btn-info').addEventListener('click', () => {
      hub.enqueue('Phoneme prosody envelope synchronized with pitch contour.', 'info', 'info');
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      hub.clearQueue();
    });

    // Initial render
    hub.render(container);
  </script>
</body>
</html>
