<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Studio - Metrics Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="studio-telemetry-container">
    <header class="telemetry-header">
      <div class="header-titles">
        <span class="telemetry-badge">Real-Time DSP Telemetry</span>
        <h2 class="telemetry-title">Synthesis Speed & Quality Curves</h2>
        <p class="telemetry-subtitle">Live neural synthesis throughput, token emission rate, and vocoder clarity metrics</p>
      </div>

      <div class="time-window-controls">
        <button type="button" class="time-window-btn" data-window="1H">1H</button>
        <button type="button" class="time-window-btn active" data-window="24H">24H</button>
        <button type="button" class="time-window-btn" data-window="7D">7D</button>
      </div>
    </header>

    <div class="telemetry-stats-bar">
      <div class="stat-item">
        <span class="stat-label">Synthesis Throughput</span>
        <strong id="telemetryMetricVal" class="stat-val highlight">-- wpm</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Window Min</span>
        <strong id="telemetryMinVal" class="stat-val">-- wpm</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Window Peak</span>
        <strong id="telemetryMaxVal" class="stat-val">-- wpm</strong>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="ai-voice-studio-telemetry-canvas"></canvas>
      <div id="telemetryTooltip" class="telemetry-tooltip"></div>
    </div>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
