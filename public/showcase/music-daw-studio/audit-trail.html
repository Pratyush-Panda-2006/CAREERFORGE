<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music DAW Studio - Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-trail-container">
    <div class="audit-header">
      <h2>Cryptographic DAW Audit Ledger</h2>
      <span id="chainStatusPill" class="status-pill status-pass">VALID</span>
    </div>
    <div class="audit-controls">
      <select id="eventTypeSelect">
        <option value="TRACK_RECORD">TRACK_RECORD</option>
        <option value="SAMPLE_LOAD">SAMPLE_LOAD</option>
        <option value="PLUGIN_INSERT">PLUGIN_INSERT</option>
        <option value="PARAM_AUTOMATION">PARAM_AUTOMATION</option>
      </select>
      <input type="text" id="trackNameInput" placeholder="Target track or plugin...">
      <button id="recordEventBtn" class="btn-primary">Record Action</button>
      <button id="verifyChainBtn" class="btn-secondary">Verify Ledger</button>
    </div>
    <div id="auditChainList" class="chain-feed"></div>
  </div>
  <script type="module" src="audit-trail.js"></script>
</body>
</html>
