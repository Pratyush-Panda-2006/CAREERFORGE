<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music DAW Studio Status</title>
  <link rel="stylesheet" href="status-badge.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to the studio</a>
    <h1>System status</h1>
    <p>A demo heartbeat: the pings below are simulated in your browser.</p>
    <details class="card">
      <summary><span id="lamp" aria-hidden="true"></span><span>Audio engine: <strong id="state" role="status"></strong></span></summary>
      <dl>
        <dt>Uptime</dt><dd id="uptime"></dd>
        <dt>Pings</dt><dd id="pings"></dd>
        <dt>Last latency</dt><dd id="last"></dd>
        <dt>Average latency</dt><dd id="average"></dd>
      </dl>
    </details>
    <label>Mode <select id="mode"><option value="auto">Follow pings</option><option value="maintenance">Maintenance</option></select></label>
  </main>
  <script type="module" src="status-badge.js"></script>
</body>
</html>
