<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music DAW Studio - Audio DSP Benchmark Suite</title>
  <link rel="stylesheet" href="benchmark-suite.css">
</head>
<body>
  <div class="benchmark-container">
    <div class="header-section">
      <h1>Music DAW Studio Audio DSP Benchmark Suite</h1>
      <p>Performance Throughput &amp; Latency Percentile Profiler for Neural Audio Nodes</p>
    </div>

    <div class="control-bar">
      <input type="number" id="benchmarkIterations" value="1000" min="100" max="20000" step="100">
      <button class="btn-run" id="runBenchmarkBtn">Run Audio DSP Benchmark</button>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Throughput</div>
        <div class="metric-value" id="opsPerSecVal">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Avg Latency</div>
        <div class="metric-value" id="avgLatencyVal">-- ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">P95 Latency</div>
        <div class="metric-value" id="p95Val">-- ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">P99 Latency</div>
        <div class="metric-value" id="p99Val">-- ms</div>
      </div>
    </div>
  </div>

  <script type="module" src="benchmark-suite.js"></script>
</body>
</html>
