<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music DAW Studio - Resilient Offline Data Persistence</title>
  <link rel="stylesheet" href="offline-sync.css">
</head>
<body>
  <div class="sync-container">
    <div class="header-section">
      <div>
        <h1>Music DAW Studio Offline Sync Engine</h1>
        <p>Resilient Track Mutation Queue &amp; Vector Clock Conflict Resolver</p>
      </div>
      <div>
        <span class="status-badge online" id="onlineBadge">ONLINE</span>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="trackNameInput" placeholder="Track Name (e.g. Bass Synth)">
      <input type="number" id="bpmInput" placeholder="BPM" value="128" style="width: 80px;">
      <button class="action-btn" id="enqueueBtn">Queue Change</button>
      <button class="action-btn secondary" id="toggleOnlineBtn">Toggle Network</button>
      <button class="action-btn secondary" id="processQueueBtn">Sync Queue</button>
    </div>

    <div class="queue-box">
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">Pending Mutations</div>
      <div id="queueList"></div>
    </div>
  </div>

  <script type="module" src="offline-sync.js"></script>
</body>
</html>
