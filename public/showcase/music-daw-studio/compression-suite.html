<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music DAW Studio - LZW MIDI & Audio Compression Suite</title>
  <link rel="stylesheet" href="./compression-suite.css">
</head>
<body>
  <div id="compression-app-container"></div>

  <script type="module">
    import { MusicDawStudioCompressionEngine } from './compression-suite.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('compression-app-container');
      const engine = new MusicDawStudioCompressionEngine();
      engine.renderToDOM(container);
    });
  </script>
</body>
</html>
