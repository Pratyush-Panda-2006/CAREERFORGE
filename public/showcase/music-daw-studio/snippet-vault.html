<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music DAW Studio - Snippet Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-container">
    <header class="vault-header">
      <div class="vault-title-wrap">
        <h1>🎹 Music DAW Preset Vault</h1>
        <p>Reusable synthesizer patches, MIDI chord progressions, and audio engineering mastering chains</p>
      </div>
    </header>

    <section class="vault-controls">
      <div class="search-box-row">
        <div class="search-input-wrap">
          <input type="text" id="searchQueryInput" class="search-input" placeholder="Search patches, MIDI progressions, or effects (e.g. analog, moog, reverb, lofi)...">
        </div>
      </div>
      <div id="tagFilterBar" class="tag-filter-bar">
        <!-- Rendered by snippet-vault.js -->
      </div>
    </section>

    <main id="snippetsGrid" class="snippets-grid">
      <!-- Rendered by snippet-vault.js -->
    </main>
  </div>

  <div id="copyToast" class="toast">Patch copied to clipboard!</div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
