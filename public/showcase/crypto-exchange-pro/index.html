<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VortexDEX — Sub-Millisecond Crypto Perpetual Exchange</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header className="navbar">
    <div className="brand">⚡ VORTEX DEX</div>
    <div className="status">● ORDERBOOK ENGINE: MATCHING (0.4ms)</div>
  </header>

  <main className="trading-container">
    <div className="hero">
      <div className="pill">ON-CHAIN DERIVATIVES</div>
      <h1>100x Leverage Decentralized Futures</h1>
      <p>Self-custodial perpetual trading with deep orderbook liquidity &amp; zero gas fees.</p>
    </div>

    <div className="ticker-grid">
      <div className="ticker-card">
        <span className="pair">BTC-PERP</span>
        <span className="price">$94,250.00</span>
        <span className="change green">+4.82%</span>
      </div>
      <div className="ticker-card">
        <span className="pair">ETH-PERP</span>
        <span className="price">$3,840.50</span>
        <span className="change green">+6.15%</span>
      </div>
      <div className="ticker-card">
        <span className="pair">SOL-PERP</span>
        <span className="price">$214.80</span>
        <span className="change green">+12.40%</span>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
