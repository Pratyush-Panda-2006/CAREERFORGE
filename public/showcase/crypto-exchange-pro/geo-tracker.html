<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Exchange Pro - Matching Engine Colocation Radar</title>
  <link rel="stylesheet" href="geo-tracker.css">
</head>
<body>
  <div class="radar-dashboard">
    <header class="radar-header">
      <h1>Crypto Exchange Pro - Colocation Proximity Radar</h1>
      <p>Autonomous geospatial coordinate proximity calculator & low-latency matching engine datacenter locator</p>
    </header>

    <section class="radar-controls-card">
      <div class="control-group">
        <label for="user-lat">Trader Latitude</label>
        <input type="number" id="user-lat" step="0.0001" value="40.7895">
      </div>
      <div class="control-group">
        <label for="user-lon">Trader Longitude</label>
        <input type="number" id="user-lon" step="0.0001" value="-74.0565">
      </div>
      <button id="scan-radar-btn" class="scan-btn">Scan Colocation Hubs</button>
      <div id="radar-status" class="radar-status">Ready to scan high-frequency matching engine hubs.</div>
    </section>

    <main class="radar-main-content">
      <div class="radar-display-wrapper">
        <div class="radar-viewport">
          <div class="radar-grid-ring ring-outer"></div>
          <div class="radar-grid-ring ring-mid"></div>
          <div class="radar-grid-ring ring-inner"></div>
          <div class="radar-beam"></div>
          <div id="radar-sweep-canvas"></div>
        </div>
      </div>

      <div class="radar-results-wrapper">
        <h3 class="results-heading">Nearest Matching Engine Datacenters</h3>
        <div id="nodes-list" class="nodes-list"></div>
      </div>
    </main>
  </div>

  <script type="module" src="geo-tracker.js"></script>
</body>
</html>
