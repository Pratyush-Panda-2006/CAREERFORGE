<div class="crypto-telemetry-container" id="crypto-telemetry-card">
  <div class="crypto-telemetry-header">
    <div class="crypto-telemetry-title-block">
      <div class="crypto-telemetry-badge">
        <span class="crypto-pulse-cyan"></span>
        <span>ENGINE TELEMETRY</span>
      </div>
      <h3 class="crypto-telemetry-heading">Matching Engine Throughput & Latency Curve</h3>
    </div>

    <div class="crypto-telemetry-controls">
      <div class="crypto-time-pills" role="radiogroup" aria-label="Time Window Range">
        <button type="button" class="crypto-time-pill" data-window="1H">1H</button>
        <button type="button" class="crypto-time-pill is-active" data-window="24H">24H</button>
        <button type="button" class="crypto-time-pill" data-window="7D">7D</button>
      </div>
    </div>
  </div>

  <div class="crypto-telemetry-kpis">
    <div class="crypto-kpi-item">
      <span class="crypto-kpi-label">Peak Engine Throughput</span>
      <span class="crypto-kpi-value" id="crypto-kpi-tps">24,850 TPS</span>
      <span class="crypto-kpi-trend positive">+18.4%</span>
    </div>
    <div class="crypto-kpi-item">
      <span class="crypto-kpi-label">Median Tick Latency</span>
      <span class="crypto-kpi-value" id="crypto-kpi-latency">1.84 ms</span>
      <span class="crypto-kpi-trend positive">-0.22ms</span>
    </div>
    <div class="crypto-kpi-item">
      <span class="crypto-kpi-label">Order Fill Reliability</span>
      <span class="crypto-kpi-value" id="crypto-kpi-fillrate">99.998%</span>
      <span class="crypto-kpi-trend neutral">Nominal</span>
    </div>
  </div>

  <div class="crypto-canvas-wrapper">
    <canvas
      id="crypto-exchange-pro-telemetry-canvas"
      width="780"
      height="260"
      aria-label="Interactive matching engine telemetry graph"
    ></canvas>

    <div id="crypto-telemetry-tooltip" class="crypto-tooltip-bubble" style="display:none;">
      <div class="crypto-tooltip-time" id="crypto-tooltip-time">14:00</div>
      <div class="crypto-tooltip-val">
        <span class="crypto-cyan-dot"></span>
        <span id="crypto-tooltip-metric">Throughput: 21,400 TPS</span>
      </div>
      <div class="crypto-tooltip-sub" id="crypto-tooltip-lat">Latency: 1.62 ms</div>
    </div>
  </div>
</div>
