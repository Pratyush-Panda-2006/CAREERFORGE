<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics Automata - Time-Travel State Debugger</title>
  <link rel="stylesheet" href="state-debugger.css">
</head>
<body>
  <div class="debugger-container">
    <header class="debugger-header">
      <div class="header-titles">
        <h2>🤖 Robotics Automata Time-Travel State Debugger</h2>
        <p>Deterministic kinematic actuator recorder, scrubbable joint timeline & state delta diff inspector</p>
      </div>
      <button id="btnExportReplay" class="btn btn-export">Export Replay JSON</button>
    </header>

    <div class="scrubber-bar">
      <button id="btnStepBack" class="btn-step" title="Step Back">◀</button>
      <input type="range" id="playheadSlider" min="0" max="0" value="0" class="playhead-slider">
      <button id="btnStepForward" class="btn-step" title="Step Forward">▶</button>
      <span id="stepIndicator" class="step-indicator">Step 1 of 1</span>
    </div>

    <div class="debugger-actions">
      <h3>Command Robotic Actuator State</h3>
      <div class="btn-row">
        <button id="btnArticulateArm" class="btn btn-action">Articulate Joint Servos</button>
        <button id="btnEngageGripper" class="btn btn-action">Toggle Gripper Lock</button>
      </div>
    </div>

    <div class="debugger-grid">
      <section class="panel timeline-panel">
        <h3>Actuation History</h3>
        <div id="actionHistoryList" class="action-history-list">
          <!-- Action records populate here -->
        </div>
      </section>

      <section class="panel inspector-panel">
        <h3>Kinematic State Snapshot</h3>
        <pre id="stateInspectorView" class="json-code-view">// State JSON</pre>
      </section>

      <section class="panel diff-panel">
        <h3>Joint Delta Diff</h3>
        <pre id="diffInspectorView" class="json-code-view">// Delta diff</pre>
      </section>
    </div>
  </div>

  <script type="module" src="state-debugger.js"></script>
</body>
</html>
