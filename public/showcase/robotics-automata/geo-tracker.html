<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics Automata - Geospatial Proximity Radar</title>
  <link rel="stylesheet" href="./geo-tracker.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #0b0f19;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    #geo-root {
      max-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="geo-root"></div>

  <script type="module">
    import { RoboticsAutomataGeoRadarEngine } from './geo-tracker.js';

    const root = document.getElementById('geo-root');
    const engine = new RoboticsAutomataGeoRadarEngine();
    engine.renderToDOM(root);
  </script>
</body>
</html>
