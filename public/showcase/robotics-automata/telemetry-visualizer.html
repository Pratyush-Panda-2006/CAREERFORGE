<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics Automata - Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="telemetry-container">
    <div class="telemetry-header">
      <h1>
        Robotics Joint Torque & Velocity Visualizer
        <span class="telemetry-badge">Issue #689</span>
      </h1>
      <p>Real-time sparkline telemetry charting automated manipulator torque distributions and velocity curves.</p>
    </div>

    <div class="telemetry-card">
      <div class="toolbar-row">
        <h3 class="telemetry-subtitle">Actuator Load & Torque (N·m)</h3>
        <div class="button-group">
          <button class="time-window-btn" data-window="1H">1H</button>
          <button class="time-window-btn active" data-window="24H">24H</button>
          <button class="time-window-btn" data-window="7D">7D</button>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="robotics-automata-telemetry-canvas" width="820" height="340"></canvas>
      </div>
    </div>
  </div>

  <div id="telemetry-tooltip" class="telemetry-tooltip"></div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
