<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics Automata - Multi-Axis Radar Visualizer</title>
  <link rel="stylesheet" href="data-visualizer.css">
</head>
<body>
  <div class="visualizer-container">
    <header class="visualizer-header">
      <div class="header-titles">
        <h2>📊 Robotics Automata Polar Radar Visualizer</h2>
        <p>Interactive multi-axis SVG kinematic benchmark chart with real-time enclosed area calculation</p>
      </div>
      <div class="header-metrics">
        <span class="area-label">Enclosed Area:</span>
        <span id="enclosedAreaVal" class="area-val">0 px²</span>
      </div>
    </header>

    <div class="visualizer-layout">
      <div class="chart-panel">
        <div id="radarCanvasContainer" class="svg-container">
          <!-- Inline SVG canvas renders here -->
        </div>
      </div>

      <div class="sliders-panel">
        <div class="panel-header">
          <h3>Kinematic Performance Parameters</h3>
          <button id="btnRandomize" class="btn btn-random">Randomize</button>
        </div>
        <div id="metricSlidersContainer" class="sliders-container">
          <!-- Dynamic metric sliders render here -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="data-visualizer.js"></script>
</body>
</html>
