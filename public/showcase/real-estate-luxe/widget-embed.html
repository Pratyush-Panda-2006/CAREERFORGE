<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Luxe - Embeddable Property Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="widget-header">
      <div class="widget-title">🏛️ Luxury Real Estate</div>
      <div class="vip-badge">
        <span class="vip-dot"></span> EXCLUSIVE LISTINGS
      </div>
    </div>

    <div class="property-list">
      <div class="property-card" data-id="prop-bel-air">
        <span class="property-name">Bel-Air Modern Estate</span>
        <span class="property-price">$18,500,000</span>
      </div>
      <div class="property-card" data-id="prop-penthouse-nyc">
        <span class="property-name">Tribeca Glass Penthouse</span>
        <span class="property-price">$12,800,000</span>
      </div>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
