<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Luxe - Valuation Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="luxe-telemetry-container">
    <header class="luxe-telemetry-header">
      <div class="header-titles">
        <span class="telemetry-badge">Market Intelligence</span>
        <h2 class="telemetry-title">Luxury Estate Index Telemetry</h2>
        <p class="telemetry-subtitle">Real-time prime residential index valuation, query velocity & inquiry volume</p>
      </div>
      <div class="luxe-window-controls">
        <button type="button" class="luxe-time-btn" data-window="1H">1H</button>
        <button type="button" class="luxe-time-btn active" data-window="24H">24H</button>
        <button type="button" class="luxe-time-btn" data-window="7D">7D</button>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="real-estate-luxe-telemetry-canvas" width="760" height="260"></canvas>
      <div id="luxeTelemetryTooltip" class="luxe-telemetry-tooltip"></div>
    </div>

    <footer class="luxe-telemetry-footer">
      <div class="telemetry-stat">
        <span class="stat-label">Prime Index Baseline</span>
        <span class="stat-value">86.4 pts</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Square Foot Premium</span>
        <span class="stat-value">+14.2% YoY</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Global Private Inquiries</span>
        <span class="stat-value">128 active</span>
      </div>
    </footer>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
