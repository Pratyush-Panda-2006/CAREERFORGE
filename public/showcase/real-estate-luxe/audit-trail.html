<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Implement autonomous state history & cryptographic audit trail module — Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <header class="audit-header">
      <div class="title-wrap">
        <h1>🔒 Cryptographic Escrow Deeds Audit Trail</h1>
        <p>Build an isolated audit log module in Real Estate Luxe recording property escrow events and deed verifications with SHA-256 hash chains.</p>
      </div>
      <div id="integrityBadge" class="status-badge status-valid">VERIFYING INTEGRITY...</div>
    </header>

    <div class="controls-bar">
      <select id="filterActionSelect" class="filter-select">
        <option value="ALL">All Recorded Actions</option>
        <option value="GENESIS_INIT">Genesis Init</option>
        <option value="ESCROW_OPENED">Escrow Opened</option>
        <option value="INSPECTION_CLEARED">Inspection Cleared</option>
        <option value="DEED_RECORDED">Deed Recorded</option>
      </select>
      <button type="button" id="logEvent1Btn" class="btn-audit">+ Escrow Opened</button>
      <button type="button" id="logEvent2Btn" class="btn-audit">+ Inspection Cleared</button>
      <button type="button" id="verifyChainBtn" class="btn-audit btn-primary">🔍 Re-Verify Chain</button>
      <button type="button" id="exportChainBtn" class="btn-audit">📥 Export JSON</button>
      <button type="button" id="clearChainBtn" class="btn-audit">🔄 Reset</button>
    </div>

    <div id="auditTimelineContainer" class="timeline-feed">
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Implement autonomous state history & cryptographic audit trail module Dashboard</a>
    </nav>
  </div>

  <script type="module" src="audit-trail.js"></script>
