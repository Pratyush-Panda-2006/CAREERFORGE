<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Luxe - Resilient Offline Data Persistence</title>
  <link rel="stylesheet" href="offline-sync.css">
</head>
<body>
  <div class="sync-container">
    <header class="sync-header">
      <div>
        <h1>📶 Real Estate Luxe Offline Data Persistence</h1>
        <p>Resilient offline queue buffering and deterministic vector-clock conflict resolution for luxury property listings.</p>
      </div>
      <div id="connection-status" class="status-pill online">● Online</div>
    </header>

    <div class="actions-bar">
      <button id="add-listing-btn" class="btn-action">Buffer Listing Price Change</button>
      <button id="toggle-network-btn" class="btn-action">Toggle Network Drop</button>
      <button id="sync-now-btn" class="btn-action primary">Sync Now</button>
    </div>

    <table class="queue-table">
      <thead>
        <tr>
          <th>Mutation ID</th>
          <th>Type</th>
          <th>Status</th>
          <th>Retry Counter</th>
        </tr>
      </thead>
      <tbody id="queue-items"></tbody>
    </table>
  </div>

  <script type="module" src="offline-sync.js"></script>
</body>
</html>
