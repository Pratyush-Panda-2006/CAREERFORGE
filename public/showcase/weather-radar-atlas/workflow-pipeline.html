<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Radar Atlas - Meteorological Operations Pipeline</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
</head>
<body class="weather-pipeline-body">
  <header class="pipeline-header">
    <div class="pipeline-brand">
      <span class="pipeline-icon">🛰️</span>
      <h1>NEXRAD Radar Operations & Severe Warning Workflow Pipeline</h1>
    </div>
    <div class="pipeline-actions">
      <button type="button" id="openNewTaskModal" class="btn btn-primary">+ Add Radar Operation</button>
      <button type="button" id="exportPipelineBtn" class="btn btn-secondary">Export JSON</button>
    </div>
  </header>

  <main class="pipeline-main">
    <div class="kanban-board" id="kanbanBoard"></div>
  </main>

  <div class="modal-backdrop" id="taskModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create Radar Operations Task</h3>
        <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="newTaskForm" class="modal-form">
        <div class="form-group">
          <label for="taskTitleInput">Task Name / Scan Mission</label>
          <input type="text" id="taskTitleInput" required placeholder="e.g. Supercell Mesocyclone Calibration">
        </div>
        <div class="form-group">
          <label for="taskDescInput">Observation Parameters</label>
          <textarea id="taskDescInput" rows="3" placeholder="VCP mode, elevation tilt, Doppler velocity threshold..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskColSelect">Initial Pipeline Phase</label>
            <select id="taskColSelect">
              <option value="backlog">Observational Backlog</option>
              <option value="in_progress">Active Beam Sweep</option>
              <option value="review">Forecaster Verification</option>
              <option value="completed">Dispatched to Atlas CDN</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskPrioritySelect">Warning Tier</label>
            <select id="taskPrioritySelect">
              <option value="high">High (Tornado Warning)</option>
              <option value="medium" selected>Medium (Severe Convection)</option>
              <option value="low">Low (Standard Volume Scan)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="taskAssigneeInput">Duty Meteorologist</label>
          <input type="text" id="taskAssigneeInput" placeholder="e.g. Lead Radar Forecaster">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="workflow-pipeline.js"></script>
</body>
</html>
