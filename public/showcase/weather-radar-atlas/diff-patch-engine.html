<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherRadarAtlas - Myers Diff & Patch Engine</title>
  <link rel="stylesheet" href="diff-patch-engine.css">
</head>
<body>
  <div class="diff-container" data-diff-lab>
    <header class="header">
      <h1>WeatherRadarAtlas Myers Diff & Patch Engine</h1>
      <p class="subtitle">O(ND) difference computation, chunk boundary visualizer, and unified patch application</p>
    </header>
    <main class="grid-layout">
      <section class="card input-card">
        <h2>Original Configuration (v1.0)</h2>
        <textarea id="original-text" rows="8">stream: standard\nbitrate: 128k\nchannels: stereo</textarea>
      </section>
      <section class="card input-card">
        <h2>Modified Configuration (v1.1)</h2>
        <textarea id="modified-text" rows="8">stream: master\nbitrate: 320k\nchannels: spatial\ncodec: opus</textarea>
      </section>
      <section class="card diff-preview-card">
        <h2>Chunk Boundary Visual Diff</h2>
        <div id="diff-preview" class="diff-preview-box"></div>
      </section>
      <section class="card unified-card">
        <h2>Unified Diff Format</h2>
        <pre id="unified-view" class="unified-box"></pre>
      </section>
    </main>
  </div>
  <script type="module" src="diff-patch-engine.js"></script>
</body>
</html>
