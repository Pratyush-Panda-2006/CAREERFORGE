<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edtech Academy — User Settings & Preferences</title>
  <link rel="stylesheet" href="preferences.css">
</head>
<body>
  <div class="preferences-container">
    <header class="pref-header">
      <span class="pref-badge">STATE ENGINE</span>
      <h1>⚙️ Edtech Academy Settings & Preferences</h1>
      <p>Adaptive user settings and preference persistence state engine for course layout preferences, sound cues, high-contrast mode, and learning environment customization.</p>
    </header>

    <div class="pref-card" id="edtech-academy-preferences-modal">
      <h2>Learning Experience Preferences</h2>
      
      <div class="pref-group">
        <label for="themeSelect">Color Theme</label>
        <select id="themeSelect" class="pref-select">
          <option value="dark">Dark Slate</option>
          <option value="light">Light Minimal</option>
          <option value="system">Follow System</option>
        </select>
      </div>

      <div class="pref-group">
        <label for="layoutSelect">Course Catalog Layout</label>
        <select id="layoutSelect" class="pref-select">
          <option value="grid">Grid View</option>
          <option value="list">Compact List</option>
          <option value="timeline">Syllabus Timeline</option>
        </select>
      </div>

      <div class="pref-group">
        <label for="editorSelect">Code Sandbox Theme</label>
        <select id="editorSelect" class="pref-select">
          <option value="dracula">Dracula Dark</option>
          <option value="monokai">Monokai Pro</option>
          <option value="github-light">GitHub Light</option>
        </select>
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="soundToggle">
          <span>Enable Acoustic Audio Feedback & Cues</span>
        </label>
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="contrastToggle">
          <span>High Contrast Accessibility Mode</span>
        </label>
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="autoplayToggle" checked>
          <span>Auto-advance Video Lectures & Interactive Labs</span>
        </label>
      </div>

      <div class="pref-actions">
        <button type="button" id="savePrefBtn" class="btn btn-primary">Save Changes</button>
        <button type="button" id="resetPrefBtn" class="btn btn-secondary">Reset Defaults</button>
        <button type="button" id="exportPrefBtn" class="btn btn-outline">Export Configuration</button>
      </div>
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Edtech Academy Showcase</a>
    </nav>
  </div>

  <script type="module" src="preferences.js"></script>
</body>
</html>
