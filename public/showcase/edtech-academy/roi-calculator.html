<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EdTech Academy - ROI Forecaster</title>
  <link rel="stylesheet" href="roi-calculator.css">
</head>
<body class="roi-body">
  <div class="roi-container">
    <h2>EdTech Academy ROI Forecaster</h2>
    <div id="savingsDisplay" class="savings-display">$0.00</div>
  </div>
  <script type="module">
    import { EdtechAcademyRoiEngine } from './roi-calculator.js';
    const engine = new EdtechAcademyRoiEngine();
    const res = engine.calculateAnnualSavings();
    document.getElementById('savingsDisplay').textContent = engine.formatCurrency(res.grossAnnualSavings);
  </script>
</body>
</html>
