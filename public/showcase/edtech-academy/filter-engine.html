<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edtech Academy — Course Search & Filter Engine</title>
  <link rel="stylesheet" href="filter-engine.css">
</head>
<body>
  <div class="filter-container">
    <header class="filter-header">
      <span class="filter-badge">SEARCH & FILTER ENGINE</span>
      <h1>🔍 Edtech Academy Course Catalog & Filter Engine</h1>
      <p>Dynamic search, multi-tag filtering, and multi-attribute sorting engine for interactive courses, certification tracks, and syllabus modules.</p>
    </header>

    <div class="search-bar-row">
      <input type="text" id="keywordInput" class="search-input" placeholder="Search by course name, topic, or description...">
      <button type="button" id="clearSearchBtn" class="btn-clear">Clear</button>
    </div>

    <div class="filter-controls-row">
      <div class="tag-chips-wrap" id="tagChipsWrap">
      </div>

      <div class="sort-wrap">
        <label for="sortFieldSelect">Sort By:</label>
        <select id="sortFieldSelect" class="sort-select">
          <option value="name">Name (A-Z)</option>
          <option value="rating">Rating</option>
          <option value="popularity">Enrolled Students</option>
        </select>
        <button type="button" id="toggleSortDirBtn" class="btn-dir">ASC ↑</button>
      </div>
    </div>

    <div class="results-meta">
      <span>Showing <strong id="resultCount">0</strong> courses</span>
    </div>

    <div class="results-grid" id="resultsGrid">
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Edtech Academy Showcase</a>
    </nav>
  </div>

  <script type="module" src="filter-engine.js"></script>
</body>
</html>
