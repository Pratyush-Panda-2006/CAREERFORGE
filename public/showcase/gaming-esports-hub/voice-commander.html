<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Voice Commander | Gaming Esports Hub</title>
  <link rel="stylesheet" href="voice-commander.css">
  <script src="bracket.js" defer></script>
  <script type="module" src="voice-commander.js"></script>
</head>
<body>
  <main class="console">
    <a href="index.html">← Gaming Esports Hub</a>
    <h1>Tournament Voice Commander</h1>
    <p>Ask for the champion, final score, semifinal one, or semifinal two.</p>
    <div class="controls">
      <button id="voice-mic" type="button" aria-pressed="false" disabled>
        <span aria-hidden="true" class="mic-wave"></span>
        <span id="voice-mic-label">Start microphone</span>
      </button>
      <label class="speech-toggle"><input id="voice-replies" type="checkbox"> Speak replies</label>
    </div>
    <p id="voice-status" role="status" class="status">Ready for typed commands.</p>
    <form id="voice-form">
      <label for="voice-command">Type a command</label>
      <div class="command-row">
        <input id="voice-command" type="text" maxlength="120" autocomplete="off" placeholder="e.g. final score" required>
        <button type="submit">Run command</button>
      </div>
    </form>
    <h2 id="voice-history-title">Command history</h2>
    <ol id="voice-history" class="history" aria-labelledby="voice-history-title"></ol>
  </main>
</body>
</html>
