<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Esports Hub - Viewership Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="esports-telemetry-container">
    <header class="esports-telemetry-header">
      <div class="header-titles">
        <span class="telemetry-badge">Live Broadcast Stream</span>
        <h2 class="telemetry-title">Esports Arena Viewership Dynamics</h2>
        <p class="telemetry-subtitle">Real-time live concurrent audience, stream bitrate velocity & arena hype index</p>
      </div>
      <div class="esports-window-controls">
        <button type="button" class="esports-time-btn" data-window="1H">1H</button>
        <button type="button" class="esports-time-btn active" data-window="24H">24H</button>
        <button type="button" class="esports-time-btn" data-window="7D">7D</button>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gaming-esports-hub-telemetry-canvas" width="760" height="260"></canvas>
      <div id="esportsTelemetryTooltip" class="esports-telemetry-tooltip"></div>
    </div>

    <footer class="esports-telemetry-footer">
      <div class="telemetry-stat">
        <span class="stat-label">Peak Audience Reach</span>
        <span class="stat-value">1.48M CCV</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Hype Velocity Index</span>
        <span class="stat-value">94.8 / 100</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Avg Stream Latency</span>
        <span class="stat-value">1.1 sec</span>
      </div>
    </footer>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
