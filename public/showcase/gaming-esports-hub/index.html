<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex Arena — Pro Esports & Gaming Arena</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="badge">LIVE TOURNAMENT // SEASON 4</div>
    <h1>VORTEX GLOBAL CHAMPIONSHIP</h1>
    <p>$500,000 PRIZE POOL • 16 PRO TEAMS • LIVE ON TWITCH</p>
    <button className="btn-glitch" onclick="watchStream()">🔴 Watch Live Stream</button>
  </header>

  <main className="matches">
    <h2>UPCOMING MATCHES</h2>
    <div className="grid">
      <div className="match-card">
        <div className="team">TEAM CYBER</div>
        <div className="vs">VS</div>
        <div className="team">PHANTOM SQUAD</div>
        <div className="time">18:00 UTC</div>
      </div>
      <div className="match-card">
        <div className="team">NEON RIDERS</div>
        <div className="vs">VS</div>
        <div className="team">APEX TITANS</div>
        <div className="time">21:00 UTC</div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
