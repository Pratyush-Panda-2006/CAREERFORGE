<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Esports Hub - Markdown Documentation & Live Preview Sandbox</title>
  <link rel="stylesheet" href="markdown-editor.css">
</head>
<body>
  <div class="editor-page-container">
    <header class="editor-header">
      <div class="header-badge">AUTOMATA-DOCS v2.1</div>
      <h1>Gaming Esports Hub - Markdown Documentation Workstation</h1>
      <p>Split-pane markdown documentation workstation, real-time live preview sandbox, and reading time analyzer</p>
    </header>

    <div class="status-bar">
      <div class="status-metrics">
        <span class="status-item"><strong id="word-count">0</strong> words</span>
        <span class="status-divider">•</span>
        <span class="status-item"><strong id="char-count">0</strong> characters</span>
        <span class="status-divider">•</span>
        <span class="status-item"><strong id="reading-time">0 min read</strong></span>
      </div>
      <div class="status-actions">
        <button id="load-sample-btn" class="secondary-btn">Load Robotic Manual Preset</button>
        <button id="clear-btn" class="secondary-btn">Clear</button>
      </div>
    </div>

    <main class="split-pane-container">
      <!-- Left Pane: Source Editor -->
      <section class="pane editor-pane">
        <div class="pane-header">
          <h3>Markdown Source Editor</h3>
          <span class="pane-tag">INPUT</span>
        </div>
        <textarea id="markdown-input" class="markdown-textarea" placeholder="Draft robotic assembly manuals, safety protocols, and actuator calibration notes in Markdown..."></textarea>
      </section>

      <!-- Right Pane: Live HTML Preview -->
      <section class="pane preview-pane">
        <div class="pane-header">
          <h3>Live HTML Render Preview</h3>
          <span class="pane-tag preview-tag">COMPILED</span>
        </div>
        <div id="preview-output" class="preview-content"></div>
      </section>
    </main>
  </div>

  <script type="module" src="markdown-editor.js"></script>
</body>
</html>
