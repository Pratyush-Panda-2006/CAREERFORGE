<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Esports Hub - Embeddable Match Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="widget-header">
      <div class="widget-title">🎮 Esports Live Ticker</div>
      <div class="live-badge">
        <span class="live-dot"></span> LIVE
      </div>
    </div>

    <div class="match-list">
      <div class="match-card" data-match-id="match-finals-01">
        <span class="team">Sentinels</span>
        <span class="score">2 - 1</span>
        <span class="team">Fnatic</span>
      </div>
      <div class="match-card" data-match-id="match-semis-02">
        <span class="team">Paper Rex</span>
        <span class="score">0 - 0</span>
        <span class="team">Gen.G</span>
      </div>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
