<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs Portal - Snippet Vault Showcase</title>
  <link rel="stylesheet" href="snippet-vault.css">
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #020617;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .wrapper {
      width: 100%;
      max-width: 900px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="vault-root"></div>
  </div>

  <script type="module">
    import { DocsPortalSnippetVault } from './snippet-vault.js';

    const vault = new DocsPortalSnippetVault();
    const root = document.getElementById('vault-root');
    vault.renderToDOM(root, (snippet) => {
      console.log('Selected snippet:', snippet.title);
    });
  </script>
</body>
</html>
