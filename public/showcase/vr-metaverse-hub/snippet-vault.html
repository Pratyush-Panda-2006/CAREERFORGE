<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Metaverse Hub - WebXR Preset Snippet Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-wrapper">
    <header class="vault-header">
      <div>
        <h1 class="vault-title">WebXR Preset Snippet Vault</h1>
        <p class="vault-subtitle">Search and inspect verified WebXR shaders, binaural spatial audio graphs, haptics, and avatar IK rigs.</p>
      </div>
      <button id="openAddModalBtn" class="btn-primary">+ Add VR Preset</button>
    </header>

    <div class="controls-bar">
      <input type="text" id="searchSnippetInput" class="search-input" placeholder="Search presets by keyword, shader uniform, audio node, or tag...">
      <div id="tagFilterBar" class="tag-bar">
        <button class="filter-pill active" data-tag="all">All Presets</button>
        <button class="filter-pill" data-tag="rendering">Rendering</button>
        <button class="filter-pill" data-tag="audio">Spatial Audio</button>
        <button class="filter-pill" data-tag="haptics">Haptics</button>
        <button class="filter-pill" data-tag="avatar">Avatar IK</button>
      </div>
    </div>

    <div id="snippetList" class="snippets-grid"></div>
  </div>

  <div id="addSnippetModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Save WebXR Preset Snippet</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="newSnippetForm">
        <div class="form-group">
          <label for="inputSnippetTitle">Preset Title</label>
          <input type="text" id="inputSnippetTitle" placeholder="e.g. Quad-View Foveated Stereo Viewport" required>
        </div>
        <div class="form-group">
          <label for="inputSnippetCategory">Category</label>
          <select id="inputSnippetCategory">
            <option value="rendering">Rendering</option>
            <option value="audio">Spatial Audio</option>
            <option value="haptics">Haptics</option>
            <option value="avatar">Avatar IK</option>
            <option value="general">General</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputSnippetTags">Tags (comma-separated)</label>
          <input type="text" id="inputSnippetTags" placeholder="webxr, stereo, shaders">
        </div>
        <div class="form-group">
          <label for="inputSnippetDesc">Description</label>
          <input type="text" id="inputSnippetDesc" placeholder="Brief technical summary...">
        </div>
        <div class="form-group">
          <label for="inputSnippetCode">Code / Config Definition</label>
          <textarea id="inputSnippetCode" rows="6" placeholder="// Enter JavaScript / WebGL / Web Audio code..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Save to Vault</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
