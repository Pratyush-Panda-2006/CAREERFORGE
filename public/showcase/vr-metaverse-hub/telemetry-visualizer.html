<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Metaverse Hub - Metrics Telemetry Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="telemetry-container">
    <header class="telemetry-header">
      <div>
        <h2>Metaverse Real-Time Concurrency Telemetry</h2>
        <p>Interactive real-time spatial user load and framerate sparkline visualizer.</p>
      </div>
      <div class="time-window-selector">
        <button class="btn-time" data-window="1H">1H</button>
        <button class="btn-time active" data-window="24H">24H</button>
        <button class="btn-time" data-window="7D">7D</button>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="telemetryCanvas" width="800" height="300"></canvas>
    </div>

    <div class="hover-status-bar">
      <span id="hoverInfo">Hover over canvas for realtime cursor metrics</span>
      <span>Engine: VrMetaverseHubTelemetryVisualizer</span>
    </div>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
