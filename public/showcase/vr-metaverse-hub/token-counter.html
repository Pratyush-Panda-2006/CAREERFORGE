<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VrMetaverseHub - Client-Side Tokenizer</title>
  <link rel="stylesheet" href="./token-counter.css">
</head>
<body>
  <div class="token-container" data-token-lab>
    <header class="token-header">
      <h2>Client-Side Tokenizer & Byte Meter</h2>
      <p class="subtitle">Heuristic token estimator, word counter, and byte length analyzer for VrMetaverseHub.</p>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-label">Estimated Tokens</span>
        <span id="count-tokens" class="metric-value">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Words</span>
        <span id="count-words" class="metric-value">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Characters</span>
        <span id="count-chars" class="metric-value">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Byte Length</span>
        <span id="count-bytes" class="metric-value">0</span>
      </div>
    </div>

    <div class="input-section">
      <label for="token-input">Input Text</label>
      <textarea id="token-input" rows="7" placeholder="Type or paste text here to inspect tokens and payload density..."></textarea>
    </div>

    <section class="tokens-section">
      <h3>Token Visualization</h3>
      <div id="token-pills" class="pills-wrapper"></div>
    </section>
  </div>
  <script type="module" src="./token-counter.js"></script>
</body>
</html>
