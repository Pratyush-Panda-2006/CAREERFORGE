<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Metaverse Hub - Export Engine & Formatted Reports</title>
  <link rel="stylesheet" href="export-engine.css">
</head>
<body style="background: #030712; color: #f9fafb; padding: 2rem;">
  <div class="vr-export-container">
    <button id="vrExportMenuTrigger" class="export-btn" type="button">
      <span>Export Realm Data</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <div id="vrExportDropdownMenu" class="export-dropdown">
      <button id="vrDownloadJsonBtn" class="export-dropdown-item" type="button">Download JSON</button>
      <button id="vrExportCsvBtn" class="export-dropdown-item" type="button">Download CSV</button>
      <button id="vrCopyMarkdownBtn" class="export-dropdown-item" type="button">Copy Markdown Report</button>
    </div>
  </div>

  <div id="vrExportToast" class="export-toast">Export completed</div>

  <script type="module" src="export-engine.js"></script>
</body>
</html>
