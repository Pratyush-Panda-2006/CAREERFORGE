<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Metaverse Hub - Spatial Teleport Radar Locator</title>
  <link rel="stylesheet" href="./geo-tracker.css">
</head>
<body>
  <div id="vr-geo-tracker-container"></div>

  <script type="module">
    import { VrMetaverseHubGeoRadarEngine } from './geo-tracker.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('vr-geo-tracker-container');
      const engine = new VrMetaverseHubGeoRadarEngine();
      engine.renderToDOM(container);
    });
  </script>
</body>
</html>
