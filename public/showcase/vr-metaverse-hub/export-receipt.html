<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Metaverse Hub - Certificate & PNG Receipt Exporter</title>
  <link rel="stylesheet" href="export-receipt.css">
</head>
<body>
  <div class="receipt-container">
    <header class="receipt-header">
      <div class="header-titles">
        <h2>📜 VR Metaverse Deed & Graphic Exporter</h2>
        <p>Client-side HTML5 Canvas 2D high-DPI certificate generator with parity-encoded barcode</p>
      </div>
      <button id="btnDownloadPng" class="btn btn-download">Download PNG Receipt</button>
    </header>

    <div class="receipt-layout">
      <div class="controls-card">
        <h3>Customise Deed Parameters</h3>
        <div class="form-group">
          <label for="inputParcel">Virtual Parcel Name:</label>
          <input type="text" id="inputParcel" value="Genesis World #4092 - Horizon Sector" class="form-input">
        </div>
        <div class="form-group">
          <label for="inputOwner">Owner Avatar Identity:</label>
          <input type="text" id="inputOwner" value="NexusAvatar-0x89A" class="form-input">
        </div>
      </div>

      <div class="canvas-viewport">
        <canvas id="receiptCanvas" width="600" height="400" class="canvas-render"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="export-receipt.js"></script>
</body>
</html>
