<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Metaverse Hub - Notification Queue & Alert Stream</title>
  <link rel="stylesheet" href="notification-hub.css">
</head>
<body>
  <div class="hub-wrapper">
    <header class="hub-header">
      <h1 class="hub-title">WebXR Notification Hub & Alert Stream</h1>
      <p class="hub-subtitle">Real-time prioritized spatial telemetry, frame rate drops, audio sync warnings, and toast lifecycle dispatch.</p>
    </header>

    <div class="controls-card">
      <h3>Simulate WebXR Engine Alerts</h3>
      <div class="btn-grid">
        <button id="triggerCriticalBtn" class="hub-btn hub-btn-critical">Trigger Critical Drop</button>
        <button id="triggerWarningBtn" class="hub-btn hub-btn-warning">Trigger Audio Warn</button>
        <button id="triggerSuccessBtn" class="hub-btn hub-btn-success">Trigger IK Calibrated</button>
        <button id="triggerInfoBtn" class="hub-btn hub-btn-info">Trigger Shard Info</button>
        <button id="clearAllBtn" class="hub-btn hub-btn-secondary">Clear Queue</button>
      </div>
    </div>

    <div class="log-card">
      <h3>WebXR Session Telemetry Audit Log</h3>
      <div id="notificationLogList" class="log-list"></div>
    </div>
  </div>

  <div id="toastViewport" class="toast-viewport"></div>

  <script type="module" src="notification-hub.js"></script>
</body>
</html>
