<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart IoT Nexus - Firmware & Sensor Config Diff Inspector</title>
  <link rel="stylesheet" href="diff-viewer.css">
</head>
<body>
  <div class="diff-wrapper">
    <header class="diff-header">
      <div>
        <span class="diff-badge">Firmware Diagnostics</span>
        <h1>📡 IoT Firmware & Config Diff Inspector</h1>
        <p>Line-by-line delta comparison tool evaluating device configuration files, MQTT broker rules, and sensor calibration parameters</p>
      </div>
      <div>
        <button id="loadSampleDiffBtn" class="btn btn-outline">Load IoT Config Example</button>
      </div>
    </header>

    <section class="metrics-bar">
      <div class="metric-card">
        <span class="metric-label">Added Parameters</span>
        <span id="statAddedLines" class="metric-value added">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Removed Parameters</span>
        <span id="statRemovedLines" class="metric-value removed">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Unchanged</span>
        <span id="statUnchangedLines" class="metric-value unchanged">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Config Drift %</span>
        <span id="statChangePercent" class="metric-value percent">0%</span>
      </div>
    </section>

    <section class="diff-inputs">
      <div class="input-column">
        <label for="origTextInput">Baseline Firmware / Gateway Config (Original)</label>
        <textarea id="origTextInput" placeholder="Paste baseline device parameters, MQTT config, or pin mapping..."></textarea>
      </div>
      <div class="input-column">
        <label for="modTextInput">Updated OTA Firmware / Target Spec (Modified)</label>
        <textarea id="modTextInput" placeholder="Paste updated OTA parameters, altered MQTT topics, or calibration offsets..."></textarea>
      </div>
    </section>

    <div class="actions-bar">
      <button id="compareDiffBtn" class="btn btn-primary">Run Firmware Diff</button>
    </div>

    <main class="diff-output-panel">
      <div id="diffOutputContainer">
        <!-- Rendered by diff-viewer.js -->
      </div>
    </main>
  </div>

  <script type="module" src="diff-viewer.js"></script>
</body>
</html>
