<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart IoT Nexus - Notification Queue & Alert Stream</title>
  <link rel="stylesheet" href="notification-hub.css">
</head>
<body>
  <div class="hub-wrapper">
    <header class="hub-header">
      <h1 class="hub-title">Smart IoT Nexus Sensor Alert Hub</h1>
      <p class="hub-subtitle">Real-time prioritized IoT sensor anomalies, thermal trips, MQTT QoS degradation, and OTA firmware status.</p>
    </header>

    <div class="controls-card">
      <h3>Simulate Edge Device & Sensor Alerts</h3>
      <div class="btn-grid">
        <button id="triggerCriticalBtn" class="hub-btn hub-btn-critical">Trigger Thermal Runaway</button>
        <button id="triggerWarningBtn" class="hub-btn hub-btn-warning">Trigger MQTT Loss</button>
        <button id="triggerSuccessBtn" class="hub-btn hub-btn-success">Trigger OTA Flash</button>
        <button id="triggerInfoBtn" class="hub-btn hub-btn-info">Trigger Mesh Heartbeat</button>
        <button id="clearAllBtn" class="hub-btn hub-btn-secondary">Clear Queue</button>
      </div>
    </div>

    <div class="log-card">
      <h3>Edge Device Telemetry Audit Log</h3>
      <div id="notificationLogList" class="log-list"></div>
    </div>
  </div>

  <div id="toastViewport" class="toast-viewport"></div>

  <script type="module" src="notification-hub.js"></script>
</body>
</html>
