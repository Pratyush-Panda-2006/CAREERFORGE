<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart IoT Nexus - Telemetry Certificate & PNG Receipt Exporter</title>
  <link rel="stylesheet" href="export-receipt.css">
</head>
<body>
  <div class="receipt-container">
    <header class="receipt-header">
      <div class="badge-tag">Edge Device Cryptographic Proof</div>
      <h1>Hardware Calibration & PNG Receipt Generator</h1>
      <p>High-DPI 2D Canvas vector rendering engine generating branded gateway certificates with algorithmic barcode encoding and instant PNG export.</p>
    </header>

    <div class="receipt-grid">
      <section class="receipt-card controls-card">
        <h2>Gateway Parameters</h2>
        <div class="form-group">
          <label for="gatewayInput">Edge Gateway Name</label>
          <input type="text" id="gatewayInput" value="Industrial Edge Gateway #42">
        </div>
        <div class="form-group">
          <label for="throughputInput">Stream Throughput</label>
          <input type="text" id="throughputInput" value="1,420 msgs/sec">
        </div>
        <div class="form-group">
          <label for="calibrationInput">Calibration Standard</label>
          <input type="text" id="calibrationInput" value="VERIFIED (ISO-9001)">
        </div>
        <button id="downloadReceiptBtn" class="btn-primary">Download PNG Receipt</button>
      </section>

      <section class="receipt-card preview-card">
        <h2>Live Vector Certificate Preview</h2>
        <div class="canvas-viewport">
          <canvas id="receiptCanvas" width="600" height="400"></canvas>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="export-receipt.js"></script>
</body>
</html>
