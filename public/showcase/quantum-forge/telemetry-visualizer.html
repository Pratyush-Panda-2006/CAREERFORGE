<div class="quantum-telemetry-container" id="quantum-telemetry-card">
  <div class="quantum-telemetry-header">
    <div class="quantum-telemetry-title-block">
      <div class="quantum-telemetry-badge">
        <span class="quantum-pulse-violet"></span>
        <span>QUBIT TELEMETRY STREAM</span>
      </div>
      <h3 class="quantum-telemetry-heading">T2 Coherence Lifetime & Cryogenic Stability Curve</h3>
    </div>

    <div class="quantum-telemetry-controls">
      <div class="quantum-time-pills" role="radiogroup" aria-label="Time Window Range">
        <button type="button" class="quantum-time-pill" data-window="1H">1H</button>
        <button type="button" class="quantum-time-pill is-active" data-window="24H">24H</button>
        <button type="button" class="quantum-time-pill" data-window="7D">7D</button>
      </div>
    </div>
  </div>

  <div class="quantum-telemetry-kpis">
    <div class="quantum-kpi-item">
      <span class="quantum-kpi-label">Mean T2 Coherence</span>
      <span class="quantum-kpi-value" id="quantum-kpi-coherence">214.6 µs</span>
      <span class="quantum-kpi-trend positive">+16.2 µs</span>
    </div>
    <div class="quantum-kpi-item">
      <span class="quantum-kpi-label">2-Qubit Gate Fidelity</span>
      <span class="quantum-kpi-value" id="quantum-kpi-fidelity">99.84%</span>
      <span class="quantum-kpi-trend positive">+0.04%</span>
    </div>
    <div class="quantum-kpi-item">
      <span class="quantum-kpi-label">Cryostat Base Stage</span>
      <span class="quantum-kpi-value" id="quantum-kpi-temp">12.8 mK</span>
      <span class="quantum-kpi-trend neutral">Stable</span>
    </div>
  </div>

  <div class="quantum-canvas-wrapper">
    <canvas
      id="quantum-forge-telemetry-canvas"
      width="780"
      height="260"
      aria-label="Interactive qubit coherence and telemetry chart"
    ></canvas>

    <div id="quantum-telemetry-tooltip" class="quantum-tooltip-bubble" style="display:none;">
      <div class="quantum-tooltip-time" id="quantum-tooltip-time">14:00</div>
      <div class="quantum-tooltip-val">
        <span class="quantum-violet-dot"></span>
        <span id="quantum-tooltip-metric">T2 Coherence: 218.4 µs</span>
      </div>
      <div class="quantum-tooltip-sub" id="quantum-tooltip-temp">Cryo Temp: 12.65 mK</div>
    </div>
  </div>
</div>
