<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Forge — Embeddable Circuit Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body class="quantum-widget-body">
  <div class="widget-container">
    <div class="widget-header">
      <div class="badge">QUBIT MATRIX</div>
      <div class="signal-indicator"><span class="pulse"></span> COHERENT</div>
    </div>

    <div class="telemetry-readout">
      <div class="metric-row">
        <span class="label">Qubit Register</span>
        <span class="val">8 Entangled</span>
      </div>
      <div class="metric-row">
        <span class="label">Average Gate Fidelity</span>
        <span class="val">99.42%</span>
      </div>
      <div class="metric-row">
        <span class="label">T2 Decoherence Time</span>
        <span class="val">142 µs</span>
      </div>
    </div>

    <div class="widget-actions">
      <button type="button" class="btn-action">Calibrate Quantum Gates</button>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
