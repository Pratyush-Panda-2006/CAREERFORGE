<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Forge - Monte Carlo Multi-Scenario Simulator</title>
  <link rel="stylesheet" href="simulation-sandbox.css">
</head>
<body>
  <div class="sim-container">
    <header class="sim-header">
      <h1>⚛️ Quantum Circuit Monte Carlo Simulator</h1>
      <p>Simulate quantum gate fidelity, decoherence variances, and state yield across multi-trial stochastic runs.</p>
    </header>

    <div class="sim-grid">
      <div class="sim-controls">
        <div class="form-group">
          <label for="sim-trials">Simulation Trials</label>
          <input type="number" id="sim-trials" value="1000" min="100" max="50000" step="100">
        </div>
        <div class="form-group">
          <label for="sim-volatility">Fluctuation Noise (Volatility)</label>
          <input type="number" id="sim-volatility" value="0.04" min="0.001" max="0.5" step="0.005">
        </div>
        <div class="form-group">
          <label for="sim-qubits">Qubit Count</label>
          <input type="number" id="sim-qubits" value="16" min="1" max="128">
        </div>
        <div class="form-group">
          <label for="sim-depth">Circuit Depth</label>
          <input type="number" id="sim-depth" value="64" min="1" max="1024">
        </div>
        <button id="run-sim-btn" class="btn-primary">Execute Monte Carlo</button>
      </div>

      <div class="sim-results">
        <div class="sim-stats-grid">
          <div class="stat-card highlight">
            <div class="label">Mean Fidelity</div>
            <div id="stat-mean" class="value">--</div>
          </div>
          <div class="stat-card">
            <div class="label">Std Deviation</div>
            <div id="stat-stddev" class="value">--</div>
          </div>
          <div class="stat-card">
            <div class="label">P50 (Median)</div>
            <div id="stat-p50" class="value">--</div>
          </div>
          <div class="stat-card">
            <div class="label">P95 (Worst 5%)</div>
            <div id="stat-p95" class="value">--</div>
          </div>
          <div class="stat-card">
            <div class="label">Min Outcome</div>
            <div id="stat-min" class="value">--</div>
          </div>
          <div class="stat-card">
            <div class="label">Max Outcome</div>
            <div id="stat-max" class="value">--</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="simulation-sandbox.js"></script>
</body>
</html>
