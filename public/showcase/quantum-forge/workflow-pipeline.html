<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Forge - Experiment Pipeline & Workflow Engine</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
</head>
<body style="background: #020617; min-height: 100vh; padding: 2rem;">
  <main class="qf-pipeline-wrapper">
    <header>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Quantum Experiment Workflow Pipeline</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Interactive Kanban board tracking circuit compilation, noise simulation, and hardware queue execution.</p>
    </header>

    <section class="qf-pipeline-toolbar" aria-label="Pipeline controls">
      <div style="font-size: 0.85rem; color: #94a3b8;">
        Drag cards between stages to advance quantum experiment status.
      </div>
      <div class="qf-board-actions">
        <button id="btn-add-task" class="qf-board-btn">+ New Circuit Task</button>
        <button id="btn-export-json" class="qf-board-btn" style="background: #475569;">Export JSON</button>
      </div>
    </section>

    <section id="pipeline-container" aria-live="polite">
      <!-- Kanban board dynamically mounted here -->
    </section>
  </main>

  <script type="module">
    import { QuantumForgePipelineEngine } from './workflow-pipeline.js';

    const container = document.getElementById('pipeline-container');
    const engine = new QuantumForgePipelineEngine();

    function update() {
      engine.render(container, () => {
        // Updated state callback
      });
    }

    document.getElementById('btn-add-task').addEventListener('click', () => {
      const title = prompt('Enter Quantum Task Title:', 'Shor Algorithm Modulo Factorization');
      if (title && title.trim()) {
        try {
          engine.addCard('formulation', {
            title: title.trim(),
            priority: 'high',
            assignee: 'Researcher',
            qubits: 8
          });
          update();
        } catch (err) {
          alert(err.message);
        }
      }
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const json = engine.exportPipelineJSON();
      navigator.clipboard.writeText(json);
      alert('Pipeline JSON exported to clipboard!');
    });

    update();
  </script>
</body>
</html>
