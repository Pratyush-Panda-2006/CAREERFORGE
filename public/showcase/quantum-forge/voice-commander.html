<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantum Forge - Voice Commander</title>
  <link rel="stylesheet" href="voice-commander.css">
</head>
<body class="voice-body">
  <div class="voice-container">
    <h2>Quantum Forge Voice Commander</h2>
    <button id="micBtn" class="btn btn-mic">Toggle Mic</button>
    <div id="feed" class="voice-feed"></div>
  </div>
  <script type="module">
    import { QuantumForgeVoiceCommander } from './voice-commander.js';
    const cmd = new QuantumForgeVoiceCommander();
    document.getElementById('micBtn').addEventListener('click', () => {
      cmd.toggleListening();
    });
  </script>
</body>
</html>
