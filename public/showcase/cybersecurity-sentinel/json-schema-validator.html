<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel JSON Schema Validator</title>
  <link rel="stylesheet" href="json-schema-validator.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to Sentinel</a>
    <h1>JSON schema validator</h1>
    <p>Checks <code>type</code>, <code>required</code>, <code>properties</code>, <code>additionalProperties: false</code>, <code>items</code> and <code>enum</code>. Other schema keywords are ignored. Nothing leaves your browser.</p>
    <label for="template">Template</label>
    <select id="template"></select>
    <div class="panes">
      <label>Schema <textarea id="schema" rows="16" spellcheck="false"></textarea></label>
      <label>Payload <textarea id="payload" rows="16" spellcheck="false"></textarea></label>
    </div>
    <p id="badge" role="status"></p>
    <ul id="errors"></ul>
  </main>
  <script type="module" src="json-schema-validator.js"></script>
</body>
</html>
