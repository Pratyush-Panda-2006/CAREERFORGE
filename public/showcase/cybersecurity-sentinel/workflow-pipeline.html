<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybersecurity Sentinel - Incident Response Pipeline & Workflow Engine</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
</head>
<body style="background: #020617; min-height: 100vh; padding: 2rem;">
  <main class="cs-pipeline-wrapper">
    <header>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">SOC Incident Response Workflow Pipeline</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Kanban lifecycle coordinator tracking incident triage, malware analysis, active containment, and eradication.</p>
    </header>

    <section class="cs-pipeline-toolbar" aria-label="Pipeline controls">
      <div style="font-size: 0.85rem; color: #94a3b8;">
        Drag incident cards between phases to coordinate SOC response lifecycle.
      </div>
      <div class="cs-board-actions">
        <button id="btn-add-task" class="cs-board-btn">+ New Threat Incident</button>
        <button id="btn-export-json" class="cs-board-btn" style="background: #475569;">Export JSON</button>
      </div>
    </section>

    <section id="pipeline-container" aria-live="polite">
      <!-- Kanban board dynamically mounted here -->
    </section>
  </main>

  <script type="module">
    import { CybersecuritySentinelPipelineEngine } from './workflow-pipeline.js';

    const container = document.getElementById('pipeline-container');
    const engine = new CybersecuritySentinelPipelineEngine();

    function update() {
      engine.render(container, () => {
        // Updated state callback
      });
    }

    document.getElementById('btn-add-task').addEventListener('click', () => {
      const title = prompt('Enter Security Incident Title:', 'Active Directory Kerberos Ticket Anomalies');
      if (title && title.trim()) {
        try {
          engine.addCard('triage', {
            title: title.trim(),
            priority: 'high',
            analyst: 'Incident-Lead',
            cvssScore: 8.2
          });
          update();
        } catch (err) {
          alert(err.message);
        }
      }
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const json = engine.exportPipelineJSON();
      navigator.clipboard.writeText(json);
      alert('Incident pipeline JSON exported to clipboard!');
    });

    update();
  </script>
</body>
</html>
