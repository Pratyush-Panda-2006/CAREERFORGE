<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel Task Board</title>
  <link rel="stylesheet" href="kanban-board.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to Sentinel</a>
    <h1>Incident task board</h1>
    <p>Drag a card to another column, or use its column menu. The board is saved in this browser.</p>
    <button id="open" type="button">New task</button>
    <div id="board"></div>
    <p id="saved" role="status"></p>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <h2 id="dialog-title">New task</h2>
        <label>Title <input id="title" required maxlength="120"></label>
        <label>Priority <select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
        <div><button value="add">Add task</button> <button value="cancel" formnovalidate>Cancel</button></div>
      </form>
    </dialog>
  </main>
  <script type="module" src="kanban-board.js"></script>
</body>
</html>
