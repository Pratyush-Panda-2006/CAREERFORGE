<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybersecurity Sentinel - Metrics Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="sentinel-telemetry-container">
    <header class="telemetry-header">
      <div class="header-titles">
        <span class="telemetry-badge">Real-Time SIEM Ingestion</span>
        <h2 class="telemetry-title">Event Ingestion & Anomaly Curves</h2>
        <p class="telemetry-subtitle">Live SIEM packet throughput, intrusion spike telemetry, and firewall drop rates</p>
      </div>

      <div class="time-window-controls">
        <button type="button" class="time-window-btn" data-window="1H">1H</button>
        <button type="button" class="time-window-btn active" data-window="24H">24H</button>
        <button type="button" class="time-window-btn" data-window="7D">7D</button>
      </div>
    </header>

    <div class="telemetry-stats-bar">
      <div class="stat-item">
        <span class="stat-label">Ingestion Throughput</span>
        <strong id="telemetryMetricVal" class="stat-val highlight">-- eps</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Window Min</span>
        <strong id="telemetryMinVal" class="stat-val">-- eps</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Window Peak</span>
        <strong id="telemetryMaxVal" class="stat-val">-- eps</strong>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="cybersecurity-sentinel-telemetry-canvas"></canvas>
      <div id="telemetryTooltip" class="telemetry-tooltip"></div>
    </div>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
