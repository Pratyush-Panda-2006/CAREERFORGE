<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel — Zero-Trust Cyber Threat Shield</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="badge">🛡️ ZERO-TRUST SIEM PLATFORM</div>
    <h1>Autonomous Threat Prevention &amp; Incident Response</h1>
    <p>AI threat detection engine mitigating 99.98% of zero-day exploits before execution.</p>
    <button className="scan-btn" onclick="runSecurityScan()">Initiate Full Vulnerability Scan ↗</button>
  </header>

  <main className="status-box">
    <div className="status-row"><span className="title">SYSTEM DEFENSE STATUS:</span> <span className="val-secure">ACTIVE & PROTECTED</span></div>
    <div className="status-row"><span className="title">PACKET THREAT RATE:</span> <span className="val-rate">0 THREATS DETECTED</span></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
