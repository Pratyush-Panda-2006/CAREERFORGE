<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Studio - Preset Snippet Library & Tag Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-container">
    <header class="vault-header">
      <div class="vault-title-wrap">
        <span class="vault-badge">Creative Assets</span>
        <h1>🎨 Agency Studio Snippet Vault</h1>
        <p>Curated design tokens, CSS kinetic layout formulas, WebGL shader templates, and pitch schemas</p>
      </div>
    </header>

    <section class="vault-controls">
      <div class="search-box-row">
        <div class="search-input-wrap">
          <input type="text" id="searchQueryInput" class="search-input" placeholder="Search agency presets, CSS grids, tokens, or shaders (e.g. typography, layout, motion)...">
        </div>
      </div>
      <div id="tagFilterBar" class="tag-filter-bar">
        <!-- Rendered by snippet-vault.js -->
      </div>
    </section>

    <main id="snippetsGrid" class="snippets-grid">
      <!-- Rendered by snippet-vault.js -->
    </main>
  </div>

  <div id="copyToast" class="toast">Preset snippet copied to clipboard!</div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
