<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Studio - WCAG Contrast & Keyboard Accessibility Inspector</title>
  <link rel="stylesheet" href="./accessibility-assistant.css">
</head>
<body class="agency-a11y-theme">
  <div class="a11y-assistant-container">
    <header class="a11y-header">
      <div class="branding-group">
        <span class="a11y-orb"></span>
        <h2>Agency Studio WCAG 2.1 Contrast & Accessibility Inspector</h2>
      </div>
      <div class="header-actions">
        <label class="toggle-switch">
          <input type="checkbox" id="toggleHighContrast">
          <span class="slider"></span>
          <span class="toggle-label">High Contrast Mode</span>
        </label>
        <button id="btnInspectA11y" class="inspect-btn">Run Audit</button>
      </div>
    </header>

    <div class="standards-banner">
      <div class="standard-pill">
        <strong>AA Normal:</strong> &ge; 4.5:1
      </div>
      <div class="standard-pill">
        <strong>AA Large:</strong> &ge; 3.0:1
      </div>
      <div class="standard-pill">
        <strong>AAA Normal:</strong> &ge; 7.0:1
      </div>
    </div>

    <div class="results-panel">
      <h3>Active Showcase UI Elements</h3>
      <div id="a11yResultsList" class="results-list"></div>
    </div>
  </div>

  <script type="module" src="./accessibility-assistant.js"></script>
</body>
</html>
