<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Studio - Kanban Workflow Pipeline Engine</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
</head>
<body>
  <div class="pipeline-container">
    <header class="pipeline-header">
      <div class="pipeline-title">
        <span class="pipeline-badge">Agency Operations</span>
        <h1>🎨 Creative Project Workflow Pipeline</h1>
        <p>Interactive Kanban task execution engine with WIP threshold controls & JSON state persistence</p>
      </div>
      <div class="header-actions">
        <button id="openNewTaskModal" class="btn btn-primary">+ New Agency Task</button>
        <button id="exportPipelineBtn" class="btn btn-outline">📥 Export State JSON</button>
      </div>
    </header>

    <main id="kanbanBoard" class="kanban-board">
      <!-- Columns rendered via workflow-pipeline.js -->
    </main>
  </div>

  <!-- New Task Modal -->
  <div id="taskModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Create Creative Agency Deliverable</h3>
        <button id="closeModalBtn" class="btn btn-outline" style="padding: 0.2rem 0.5rem;">✕</button>
      </div>
      <form id="newTaskForm">
        <div class="form-group">
          <label for="taskColSelect">Initial Status Column</label>
          <select id="taskColSelect">
            <option value="backlog">Creative Backlog</option>
            <option value="in_progress">In Design & Concepting</option>
            <option value="review">Client Review & Sign-Off</option>
            <option value="completed">Delivered & Live</option>
          </select>
        </div>
        <div class="form-group">
          <label for="taskTitleInput">Deliverable Title</label>
          <input type="text" id="taskTitleInput" required placeholder="e.g. Brand Refresh Typography System">
        </div>
        <div class="form-group">
          <label for="taskDescInput">Scope & Deliverable Specs</label>
          <textarea id="taskDescInput" placeholder="Specify art direction, Figma tokens, layout grids, and client milestone..."></textarea>
        </div>
        <div class="form-group">
          <label for="taskPrioritySelect">Priority Level</label>
          <select id="taskPrioritySelect">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="form-group">
          <label for="taskAssigneeInput">Lead Designer / Copywriter</label>
          <input type="text" id="taskAssigneeInput" placeholder="e.g. Creative Lead / Senior 3D Artist">
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Schedule Task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="workflow-pipeline.js"></script>
</body>
</html>
