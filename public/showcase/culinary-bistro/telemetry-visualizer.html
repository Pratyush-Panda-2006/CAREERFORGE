<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culinary Bistro - Metrics Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="culinary-telemetry-container">
    <header class="culinary-telemetry-header">
      <div class="header-titles">
        <span class="telemetry-badge">Live Performance</span>
        <h2 class="telemetry-title">Kitchen & Dining Room Telemetry</h2>
        <p class="telemetry-subtitle">Real-time table turnover velocity, order throughput & dining room occupancy</p>
      </div>
      <div class="culinary-window-controls">
        <button type="button" class="culinary-time-btn" data-window="1H">1H</button>
        <button type="button" class="culinary-time-btn active" data-window="24H">24H</button>
        <button type="button" class="culinary-time-btn" data-window="7D">7D</button>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="culinary-bistro-telemetry-canvas" width="760" height="260"></canvas>
      <div id="culinaryTelemetryTooltip" class="culinary-telemetry-tooltip"></div>
    </div>

    <footer class="culinary-telemetry-footer">
      <div class="telemetry-stat">
        <span class="stat-label">Average Seating</span>
        <span class="stat-value">78.4%</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Peak Service Velocity</span>
        <span class="stat-value">94.2 orders/hr</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Table Turnover Latency</span>
        <span class="stat-value">42 min</span>
      </div>
    </footer>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
