<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio - Embeddable Badge Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="widget-header">
      <div class="widget-title">💻 Dev Profile Widget</div>
      <div class="status-badge">
        <span class="status-dot"></span> OPEN TO WORK
      </div>
    </div>

    <div class="projects-grid">
      <div class="project-chip" data-project="careerforge">
        <div class="label">Featured Project</div>
        <div class="value">CareerForge</div>
      </div>
      <div class="project-chip" data-project="nsoc26">
        <div class="label">Hackathon Track</div>
        <div class="value">NSoC '26</div>
      </div>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
