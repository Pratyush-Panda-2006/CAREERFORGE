<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio - Notification Queue Showcase</title>
  <link rel="stylesheet" href="notification-hub.css">
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #0d1117;
      font-family: 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .wrapper {
      width: 100%;
      max-width: 720px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="hub-root"></div>
  </div>

  <script type="module">
    import { DeveloperPortfolioNotificationHub } from './notification-hub.js';

    const hub = new DeveloperPortfolioNotificationHub();
    hub.enqueue('GitHub Actions CI/CD pipeline succeeded for commit #96a6e78', 'success', 'deploy');
    hub.enqueue('Production showcase bundle size exceeded 400KB budget threshold', 'warning', 'performance');
    hub.enqueue('CRITICAL: SSH Deploy key expired on production edge node', 'critical', 'security');

    const root = document.getElementById('hub-root');
    hub.renderToDOM(root);
  </script>
</body>
</html>
