<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Wave 2026 — Electronic Cyber Festival</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="overlay"></div>
    <div className="hero-content">
      <div className="event-date">OCTOBER 24-26 • TOKYO CYBER DOME</div>
      <h1 className="glitch-title">PULSE WAVE 2026</h1>
      <p className="subtitle">The premier 3-day immersive audio-visual synthesizer festival.</p>

      <div className="countdown" id="timer">
        <div className="time-unit"><span id="days">42</span><label>DAYS</label></div>
        <div className="time-unit"><span id="hours">18</span><label>HOURS</label></div>
        <div className="time-unit"><span id="mins">35</span><label>MINS</label></div>
      </div>
    </div>
  </header>

  <main className="lineup-container">
    <h2>FEATURED HEADLINERS</h2>
    <div className="lineup-grid">
      <div className="artist-card">
        <div className="artist-img">🎛️</div>
        <h3>NEON APEX</h3>
        <p>Main Stage • Oct 24</p>
      </div>
      <div className="artist-card">
        <div className="artist-img">⚡</div>
        <h3>CYBERNETIX</h3>
        <p>Vortex Dome • Oct 25</p>
      </div>
      <div className="artist-card">
        <div className="artist-img">🌌</div>
        <h3>KINETIC VOID</h3>
        <p>Main Stage • Oct 26</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
