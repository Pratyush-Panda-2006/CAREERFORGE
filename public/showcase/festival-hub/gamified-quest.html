<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festival Passport · Pulse Wave</title>
  <link rel="stylesheet" href="./gamified-quest.css">
  <script type="module" src="./gamified-quest.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="./index.html">Pulse Wave 2026</a>
      <h1>Festival Passport</h1>
      <p>Work through a sample festival plan and collect badges as you go. Progress is saved in this browser.</p>
    </header>
    <section class="summary" aria-labelledby="progress-title">
      <div><h2 id="progress-title">Passport progress</h2><p id="xp-summary">Level 1 · 0 XP</p></div>
      <div>
        <label for="xp-meter">XP to the next level</label>
        <progress id="xp-meter" value="0" max="40">0 / 40</progress>
        <p id="next-level">40 XP to Level 2</p>
      </div>
    </section>
    <section aria-labelledby="quest-title">
      <h2 id="quest-title">Quest objectives</h2>
      <div id="quests" class="quests"></div>
    </section>
    <section aria-labelledby="badge-title">
      <h2 id="badge-title">Milestone badges</h2>
      <ul id="badges" class="badges"></ul>
    </section>
    <p id="status" class="status" role="status" aria-atomic="true"></p>
    <noscript><p>Enable JavaScript to save quest progress.</p></noscript>
  </main>

  <dialog id="celebration" aria-labelledby="award-title" aria-describedby="award-description">
    <h2 id="award-title">New badge unlocked</h2>
    <p id="award-description"></p>
    <form method="dialog"><button type="submit" autofocus>Continue</button></form>
  </dialog>
</body>
</html>
