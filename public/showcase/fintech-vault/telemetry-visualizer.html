<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech Vault - Treasury Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="fintech-telemetry-container">
    <header class="fintech-telemetry-header">
      <div class="header-titles">
        <span class="telemetry-badge">On-Chain Stream</span>
        <h2 class="telemetry-title">Institutional Liquidity Telemetry</h2>
        <p class="telemetry-subtitle">Real-time treasury yield velocity, staking throughput & cryptographic settlement efficiency</p>
      </div>
      <div class="fintech-window-controls">
        <button type="button" class="fintech-time-btn" data-window="1H">1H</button>
        <button type="button" class="fintech-time-btn active" data-window="24H">24H</button>
        <button type="button" class="fintech-time-btn" data-window="7D">7D</button>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="fintech-vault-telemetry-canvas" width="760" height="260"></canvas>
      <div id="fintechTelemetryTooltip" class="fintech-telemetry-tooltip"></div>
    </div>

    <footer class="fintech-telemetry-footer">
      <div class="telemetry-stat">
        <span class="stat-label">Treasury Efficiency</span>
        <span class="stat-value">91.4%</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Weighted Yield APY</span>
        <span class="stat-value">6.82%</span>
      </div>
      <div class="telemetry-stat">
        <span class="stat-label">Settlement Latency</span>
        <span class="stat-value">1.4 sec</span>
      </div>
    </footer>
  </div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
