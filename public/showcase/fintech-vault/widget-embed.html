<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech Vault - Embeddable Asset Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="widget-header">
      <div class="widget-title">🔒 Fintech Vault Widget</div>
      <div class="vault-badge">
        <span class="vault-dot"></span> ENCRYPTED
      </div>
    </div>

    <div class="assets-grid">
      <div class="asset-card" data-symbol="USDC">
        <div class="label">USD Coin</div>
        <div class="value">$254,820</div>
      </div>
      <div class="asset-card" data-symbol="ETH">
        <div class="label">Ethereum</div>
        <div class="value">42.5 ETH</div>
      </div>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
