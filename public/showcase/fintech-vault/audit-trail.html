<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fintech Vault - Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <header class="audit-header">
      <div>
        <h1>🛡️ Fintech Vault Cryptographic Audit Trail</h1>
        <p>Tamper-evident financial transaction ledgers secured via chained cryptographic SHA-256 hashes.</p>
      </div>
      <div id="integrity-badge" class="integrity-badge valid">Checking Integrity...</div>
    </header>

    <div class="controls-row">
      <input type="text" id="event-action" value="CROSS_BORDER_WIRE_CLEARED" placeholder="Enter transaction action type...">
      <button id="record-event-btn" class="btn-primary">Record Verified Block</button>
    </div>

    <div class="timeline-section">
      <h3>Financial Transaction Timeline</h3>
      <div id="audit-feed" class="timeline-feed"></div>
    </div>
  </div>

  <script type="module" src="audit-trail.js"></script>
</body>
</html>
