<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexVault — Decentralized Wealth & Banking</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header className="navbar">
    <div className="brand">💎 APEXVAULT</div>
    <div className="nav-actions">
      <span className="balance-badge">Portfolio: $128,450.00</span>
      <button className="btn-primary" onclick="triggerDeposit()">Deposit Funds</button>
    </div>
  </header>

  <main className="hero">
    <div className="tag">// NEXT-GEN FINTECH INFRASTRUCTURE</div>
    <h1>Institutional-Grade Yield &amp; Asset Protection</h1>
    <p>Automated multi-chain liquidity vaults with zero-knowledge cryptographic security.</p>
    
    <div className="stats-grid">
      <div className="stat-card">
        <span className="label">TOTAL VALUE LOCKED</span>
        <span className="value">$4.2B+</span>
      </div>
      <div className="stat-card">
        <span className="label">ANNUAL YIELD (APY)</span>
        <span className="value text-emerald">8.45%</span>
      </div>
      <div className="stat-card">
        <span className="label">ACTIVE VAULTS</span>
        <span className="value">142</span>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
