<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aerospace Orbiter — Embeddable Telemetry Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body class="aerospace-widget-body">
  <div class="widget-container">
    <div class="widget-header">
      <div class="badge">ORBITER TELEMETRY</div>
      <div class="signal-indicator"><span class="pulse"></span> LIVE LINK</div>
    </div>

    <div class="telemetry-readout">
      <div class="metric-row">
        <span class="label">Orbital Velocity</span>
        <span class="val">7.66 km/s</span>
      </div>
      <div class="metric-row">
        <span class="label">Perigee Altitude</span>
        <span class="val">418.2 km</span>
      </div>
      <div class="metric-row">
        <span class="label">Inclination</span>
        <span class="val">51.64°</span>
      </div>
    </div>

    <div class="widget-actions">
      <button type="button" class="btn-action">Ping Mission Control</button>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
