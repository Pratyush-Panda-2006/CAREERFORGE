<div class="aero-telemetry-container" id="aero-telemetry-card">
  <div class="aero-telemetry-header">
    <div class="aero-telemetry-title-block">
      <div class="aero-telemetry-badge">
        <span class="aero-pulse-cyan"></span>
        <span>AVIONICS DOWNLINK TELEMETRY</span>
      </div>
      <h3 class="aero-telemetry-heading">Orbital Communications & Solar Subsystem Metrics</h3>
    </div>

    <div class="aero-telemetry-controls">
      <div class="aero-time-pills" role="radiogroup" aria-label="Time Window Range">
        <button type="button" class="aero-time-pill" data-window="1H">1H</button>
        <button type="button" class="aero-time-pill is-active" data-window="24H">24H</button>
        <button type="button" class="aero-time-pill" data-window="7D">7D</button>
      </div>
    </div>
  </div>

  <div class="aero-telemetry-kpis">
    <div class="aero-kpi-item">
      <span class="aero-kpi-label">Peak Downlink Rate</span>
      <span class="aero-kpi-value" id="aero-kpi-downlink">492.5 Mbps</span>
      <span class="aero-kpi-trend positive">+12.4%</span>
    </div>
    <div class="aero-kpi-item">
      <span class="aero-kpi-label">Solar Array Generation</span>
      <span class="aero-kpi-value" id="aero-kpi-solar">1,840 W</span>
      <span class="aero-kpi-trend positive">+45 W</span>
    </div>
    <div class="aero-kpi-item">
      <span class="aero-kpi-label">Attitude Pointing Stability</span>
      <span class="aero-kpi-value" id="aero-kpi-attitude">0.042 arcsec</span>
      <span class="aero-kpi-trend neutral">Locked</span>
    </div>
  </div>

  <div class="aero-canvas-wrapper">
    <canvas
      id="aerospace-orbiter-telemetry-canvas"
      width="780"
      height="260"
      aria-label="Interactive orbital telemetry downlink chart"
    ></canvas>

    <div id="aero-telemetry-tooltip" class="aero-tooltip-bubble" style="display:none;">
      <div class="aero-tooltip-time" id="aero-tooltip-time">14:00</div>
      <div class="aero-tooltip-val">
        <span class="aero-cyan-dot"></span>
        <span id="aero-tooltip-metric">Downlink: 420.5 Mbps</span>
      </div>
      <div class="aero-tooltip-sub" id="aero-tooltip-solar">Solar Harvest: 1,760 W</div>
    </div>
  </div>
</div>
