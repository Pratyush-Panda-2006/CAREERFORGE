<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity Microloans — Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <header class="audit-header">
      <div class="title-wrap">
        <h1>🔒 Charity Microloans Cryptographic Financial Audit Trail</h1>
        <p>Isolated immutable financial audit log module recording loan disbursements, borrower repayments, and interest verifications with cryptographic hash chains.</p>
      </div>
      <div id="integrityBadge" class="status-badge status-valid">VERIFYING INTEGRITY...</div>
    </header>

    <div class="controls-bar">
      <select id="filterActionSelect" class="filter-select">
        <option value="ALL">All Recorded Actions</option>
        <option value="GENESIS_INIT">Genesis Init</option>
        <option value="LOAN_DISBURSED">Loan Disbursed</option>
        <option value="REPAYMENT_RECORDED">Repayment Recorded</option>
      </select>
      <button type="button" id="logEvent1Btn" class="btn-audit">+ Loan Disbursed</button>
      <button type="button" id="logEvent2Btn" class="btn-audit">+ Repayment Recorded</button>
      <button type="button" id="verifyChainBtn" class="btn-audit btn-primary">🔍 Re-Verify Chain</button>
      <button type="button" id="clearChainBtn" class="btn-audit">🔄 Reset</button>
    </div>

    <div id="auditTimelineContainer" class="timeline-feed">
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Charity Microloans Dashboard</a>
    </nav>
  </div>

  <script type="module" src="audit-trail.js"></script>
</body>
</html>
