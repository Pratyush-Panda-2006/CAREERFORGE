<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity Microloans - Rural Branch Proximity & Field Radar</title>
  <link rel="stylesheet" href="./geo-tracker.css">
</head>
<body>
  <div id="geo-app-container"></div>

  <script type="module">
    import { CharityMicroloansGeoRadarEngine } from './geo-tracker.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('geo-app-container');
      const engine = new CharityMicroloansGeoRadarEngine();
      engine.renderToDOM(container);
    });
  </script>
</body>
</html>
