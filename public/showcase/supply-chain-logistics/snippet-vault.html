<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Freight & EDI Preset Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body class="supply-vault-body">
  <header class="vault-header">
    <div class="brand">
      <span class="brand-icon">📦</span>
      <h1>Supply Chain EDI &amp; Customs Preset Vault</h1>
    </div>
    <div class="search-box">
      <input type="search" id="searchQueryInput" placeholder="Search EDI 214/304 manifests, Incoterms, HS codes, bill of lading specs..." autocomplete="off">
    </div>
  </header>

  <nav class="filter-bar" id="tagFilterBar"></nav>

  <main class="vault-main">
    <div class="snippets-grid" id="snippetsGrid"></div>
  </main>

  <div class="toast-popup" id="copyToast" role="alert" aria-live="polite"></div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
