<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Hardware & Rendering Telemetry Stress Benchmark Suite</title>
  <link rel="stylesheet" href="./telemetry-stress-tester.css">
</head>
<body class="stress-theme">
  <div class="benchmark-container">
    <header class="benchmark-header">
      <div class="header-brand">
        <span class="status-indicator"></span>
        <h2>Supply Chain Logistics Telemetry Stress Benchmark Suite</h2>
      </div>
      <div id="ratingBadge" class="rating-badge badge-neutral">STANDBY</div>
    </header>

    <div class="controls-card">
      <div class="input-group">
        <label for="iterationsInput">Stress Test Iterations:</label>
        <input type="number" id="iterationsInput" value="1000" min="100" max="10000" step="100">
      </div>
      <button id="startBenchmarkBtn" class="benchmark-btn">Run Benchmark</button>
    </div>

    <div class="progress-bar-container">
      <div id="benchmarkProgress" class="progress-fill"></div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-title">Composite Score</span>
        <span id="compositeScoreVal" class="metric-value">--</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Average FPS</span>
        <span id="avgFpsVal" class="metric-value">--</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Frame Jitter</span>
        <span id="frameJitterVal" class="metric-value">-- ms</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">Memory Allocation</span>
        <span id="memoryAllocVal" class="metric-value">-- MB</span>
      </div>
      <div class="metric-card">
        <span class="metric-title">DOM Node Latency</span>
        <span id="domLatencyVal" class="metric-value">-- ms</span>
      </div>
    </div>

    <div class="log-container">
      <h3>Telemetry Execution Log</h3>
      <div id="stressTestLog" class="terminal-log">
        <div class="log-entry system-msg">[SYSTEM] Supply Chain Logistics Telemetry Stress Suite ready.</div>
      </div>
    </div>
  </div>

  <script type="module" src="./telemetry-stress-tester.js"></script>
</body>
</html>
