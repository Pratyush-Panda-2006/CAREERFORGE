<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - User Preferences</title>
  <link rel="stylesheet" href="preferences.css">
</head>
<body style="background: #020617; color: #f8fafc; padding: 2rem;">
  <button id="open-preferences-btn" class="btn-primary" type="button">Open Logistics Preferences</button>

  <div id="supply-chain-logistics-preferences-modal" class="preferences-modal-overlay" style="display: none;">
    <div class="preferences-modal-card">
      <div class="preferences-header">
        <h3>Logistics Engine Preferences</h3>
        <button id="close-preferences-btn" class="close-btn" type="button" aria-label="Close">&times;</button>
      </div>

      <div class="preferences-body">
        <div class="pref-row">
          <label for="pref-theme">Theme</label>
          <select id="pref-theme" data-pref-key="theme">
            <option value="dark">Dark Modern</option>
            <option value="light">Light Industrial</option>
            <option value="cyber">Cyber Cyan</option>
          </select>
        </div>

        <div class="pref-row">
          <label for="pref-refresh">Telemetry Refresh (sec)</label>
          <input type="number" id="pref-refresh" data-pref-key="telemetryRefreshRate" min="1" max="60" value="5">
        </div>

        <div class="pref-row">
          <label for="pref-compact">Compact Density Mode</label>
          <input type="checkbox" id="pref-compact" data-pref-key="compactMode">
        </div>

        <div class="pref-row">
          <label for="pref-contrast">High Contrast Mode</label>
          <input type="checkbox" id="pref-contrast" data-pref-key="highContrast">
        </div>

        <div class="pref-row">
          <label for="pref-sound">Dispatch Alert Audio</label>
          <input type="checkbox" id="pref-sound" data-pref-key="notificationSound" checked>
        </div>

        <div class="pref-row">
          <label for="pref-timeframe">Default Timespan</label>
          <select id="pref-timeframe" data-pref-key="defaultTimeframe">
            <option value="1H">1 Hour</option>
            <option value="24H">24 Hours</option>
            <option value="7D">7 Days</option>
          </select>
        </div>
      </div>

      <div class="preferences-footer">
        <button id="export-settings-btn" class="btn-secondary" type="button">Export JSON</button>
        <button id="reset-defaults-btn" class="btn-secondary" type="button">Reset Defaults</button>
      </div>
    </div>
  </div>

  <script type="module" src="preferences.js"></script>
</body>
</html>
