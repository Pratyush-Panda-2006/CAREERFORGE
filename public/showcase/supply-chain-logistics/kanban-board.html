<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupplyChainLogistics - Kanban Board</title>
  <link rel="stylesheet" href="./kanban-board.css">
</head>
<body>
  <div class="kanban-container" data-kanban-lab>
    <header class="kanban-header">
      <h2>Workflow Task Kanban Board</h2>
      <p class="subtitle">Drag-and-drop task progression and priority tracking for SupplyChainLogistics.</p>
    </header>

    <div class="task-creator-bar">
      <input type="text" id="new-task-title" placeholder="Enter task title...">
      <select id="new-task-priority">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="critical">Critical</option>
      </select>
      <button id="add-task-btn">Add Task</button>
    </div>

    <div class="kanban-grid">
      <div class="kanban-col">
        <div class="col-header col-backlog">Backlog</div>
        <div class="kanban-column-body" data-col="backlog"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header col-in-progress">In Progress</div>
        <div class="kanban-column-body" data-col="in-progress"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header col-review">Review</div>
        <div class="kanban-column-body" data-col="review"></div>
      </div>
      <div class="kanban-col">
        <div class="col-header col-done">Done</div>
        <div class="kanban-column-body" data-col="done"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./kanban-board.js"></script>
</body>
</html>
