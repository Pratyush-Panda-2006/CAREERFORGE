<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - SVG Radar Chart & Polar Metrics</title>
  <link rel="stylesheet" href="radar-visualizer.css">
</head>
<body>
  <div class="radar-container">
    <header class="radar-header">
      <div class="header-titles">
        <h2>📊 Global Logistics KPI Performance Radar</h2>
        <p>Interactive multi-dimensional SVG polar radar visualizer for operational fleet & delivery benchmarks</p>
      </div>
      <button id="btnRandomizeMetrics" class="btn btn-random">Randomize Telemetry</button>
    </header>

    <div class="radar-content-grid">
      <div class="chart-panel">
        <div id="radarSvgContainer" class="svg-container">
          <!-- SVG radar chart renders here -->
        </div>
      </div>

      <div class="sliders-panel">
        <h3>Adjust Supply Chain Metrics</h3>
        <div id="metricSlidersContainer" class="sliders-container">
          <!-- Dynamic metric sliders render here -->
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="radar-visualizer.js"></script>
</body>
</html>
