<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Bill of Lading & Receipt Exporter</title>
  <link rel="stylesheet" href="export-receipt.css">
</head>
<body>
  <div class="receipt-container">
    <header class="receipt-header">
      <div class="header-titles">
        <h2>📜 Supply Chain Bill of Lading & Graphic Exporter</h2>
        <p>Client-side HTML5 Canvas 2D high-DPI consignment certificate generator with parity barcode</p>
      </div>
      <button id="btnDownloadPng" class="btn btn-download">Download PNG Receipt</button>
    </header>

    <div class="receipt-layout">
      <div class="controls-card">
        <h3>Customise Waybill Parameters</h3>
        <div class="form-group">
          <label for="inputShipment">Consignment Title:</label>
          <input type="text" id="inputShipment" value="Global Freight Consignment #8891-EU" class="form-input">
        </div>
        <div class="form-group">
          <label for="inputCarrier">Carrier / Fleet Name:</label>
          <input type="text" id="inputCarrier" value="Maersk Horizon Fleet // Vessel IMO 98214" class="form-input">
        </div>
      </div>

      <div class="canvas-viewport">
        <canvas id="receiptCanvas" width="600" height="400" class="canvas-render"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="export-receipt.js"></script>
</body>
</html>
