<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Ambient Soundscape Synthesizer</title>
  <link rel="stylesheet" href="./ambient-soundscape.css">
</head>
<body>
  <div id="soundscape-app-container"></div>

  <script type="module">
    import { SupplyChainLogisticsSoundscapeSynth } from './ambient-soundscape.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('soundscape-app-container');
      const synth = new SupplyChainLogisticsSoundscapeSynth();
      synth.renderToDOM(container);
    });
  </script>
</body>
</html>
