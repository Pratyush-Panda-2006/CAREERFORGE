<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Geospatial Freight Radar Locator</title>
  <link rel="stylesheet" href="./geo-tracker.css">
</head>
<body>
  <div id="supply-chain-geo-tracker-container"></div>

  <script type="module">
    import { SupplyChainLogisticsGeoRadarEngine } from './geo-tracker.js';

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('supply-chain-geo-tracker-container');
      const engine = new SupplyChainLogisticsGeoRadarEngine();
      engine.renderToDOM(container);
    });
  </script>
</body>
</html>
