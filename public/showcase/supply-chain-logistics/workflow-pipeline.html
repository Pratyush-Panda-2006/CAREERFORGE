<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Freight Pipeline & Status Workflow Engine</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
</head>
<body>
  <div class="pipeline-wrapper">
    <header class="pipeline-header">
      <div>
        <h1 class="pipeline-title">Freight Pipeline & Status Workflow Engine</h1>
        <p class="pipeline-subtitle">Interactive shipment lifecycle, customs handling stages, and terminal WIP management.</p>
      </div>
      <div class="header-actions">
        <button id="openNewTaskModal" class="btn-primary">+ New Cargo Task</button>
        <button id="exportPipelineBtn" class="btn-secondary">Export JSON</button>
      </div>
    </header>

    <div id="kanbanBoard" class="kanban-grid"></div>
  </div>

  <div id="taskModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create Cargo Workflow Task</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="newTaskForm">
        <div class="form-group">
          <label for="taskTitleInput">Task Summary</label>
          <input type="text" id="taskTitleInput" placeholder="e.g. Dangerous Goods Declarations - Hamburg" required>
        </div>
        <div class="form-group">
          <label for="taskDescInput">Scope & Details</label>
          <textarea id="taskDescInput" rows="3" placeholder="Provide freight shipment context and requirements..."></textarea>
        </div>
        <div class="form-group">
          <label for="taskPrioritySelect">Priority</label>
          <select id="taskPrioritySelect">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="taskColSelect">Initial Column Stage</label>
          <select id="taskColSelect">
            <option value="backlog">Dispatch Order Intake</option>
            <option value="in_progress">Transit & Tracking</option>
            <option value="review">Port Entry & Inspection</option>
            <option value="completed">Fulfilled & Delivered</option>
          </select>
        </div>
        <div class="form-group">
          <label for="taskAssigneeInput">Assignee</label>
          <input type="text" id="taskAssigneeInput" value="Logistics Coordinator">
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="workflow-pipeline.js"></script>
</body>
</html>
