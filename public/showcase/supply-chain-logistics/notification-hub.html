<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supply Chain Logistics - Prioritized Alert & Dispatch Stream</title>
  <link rel="stylesheet" href="notification-hub.css">
</head>
<body class="supply-hub-body">
  <header class="hub-header">
    <div class="hub-title-wrapper">
      <span class="hub-logo-icon">📦</span>
      <h1>Supply Chain Global Dispatch &amp; Telemetry Alert Stream</h1>
    </div>
    <div class="hub-controls">
      <button type="button" id="clearAllBtn" class="btn btn-secondary">Clear Active Stream</button>
    </div>
  </header>

  <main class="hub-main">
    <section class="simulator-panel">
      <h2>Simulate Logistics &amp; Customs Alerts</h2>
      <div class="simulator-buttons">
        <button type="button" id="triggerCriticalBtn" class="btn btn-critical">🚨 Critical: Customs Port Hold</button>
        <button type="button" id="triggerWarningBtn" class="btn btn-warning">⚠️ Warning: Cold Chain Drift (4.8°C)</button>
        <button type="button" id="triggerSuccessBtn" class="btn btn-success">✅ Success: Container Cleared</button>
        <button type="button" id="triggerInfoBtn" class="btn btn-info">ℹ️ Info: GPS Waypoint Reached</button>
      </div>
    </section>

    <section class="log-panel">
      <h2>Actionable Logistics Notification Log</h2>
      <div class="notification-log-list" id="notificationLogList"></div>
    </section>
  </main>

  <!-- Viewport anchor for toasts -->
  <aside class="toast-viewport" id="toastViewport" aria-live="polite" aria-atomic="true"></aside>

  <script type="module" src="notification-hub.js"></script>
</body>
</html>
