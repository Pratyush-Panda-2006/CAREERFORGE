<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biotech Genomics - Preset Snippet Library & Tag Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-container">
    <header class="vault-header">
      <div class="vault-title-wrap">
        <span class="vault-badge">Genomic Library</span>
        <h1>🧬 Biotech Genomic Snippet Vault</h1>
        <p>Validated CRISPR guide RNA templates, PCR primer sets, NGS library prep configurations, and FASTA payloads</p>
      </div>
    </header>

    <section class="vault-controls">
      <div class="search-box-row">
        <div class="search-input-wrap">
          <input type="text" id="searchQueryInput" class="search-input" placeholder="Search genomic presets, gRNA sequences, primers, or assays (e.g. crispr, primer, exome, sanger)...">
        </div>
      </div>
      <div id="tagFilterBar" class="tag-filter-bar">
        <!-- Rendered by snippet-vault.js -->
      </div>
    </section>

    <main id="snippetsGrid" class="snippets-grid">
      <!-- Rendered by snippet-vault.js -->
    </main>
  </div>

  <div id="copyToast" class="toast">Genomic sequence copied to clipboard!</div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
