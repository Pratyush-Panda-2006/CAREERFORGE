<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biotech Genomics - Bio-Bank & Sequencing Center Proximity Radar</title>
  <link rel="stylesheet" href="geo-tracker.css">
</head>
<body>
  <div class="radar-dashboard">
    <header class="radar-header">
      <h1>Biotech Genomics - Bio-Bank Proximity Radar</h1>
      <p>Autonomous geospatial coordinate proximity calculator & international genomic cryo-vault locator</p>
    </header>

    <section class="radar-controls-card">
      <div class="control-group">
        <label for="user-lat">Sequencing Lab Latitude</label>
        <input type="number" id="user-lat" step="0.0001" value="52.0805">
      </div>
      <div class="control-group">
        <label for="user-lon">Sequencing Lab Longitude</label>
        <input type="number" id="user-lon" step="0.0001" value="0.1873">
      </div>
      <button id="scan-radar-btn" class="scan-btn">Scan Bio-Banks & Vaults</button>
      <div id="radar-status" class="radar-status">Ready to scan genomic repositories.</div>
    </section>

    <main class="radar-main-content">
      <div class="radar-display-wrapper">
        <div class="radar-viewport">
          <div class="radar-grid-ring ring-outer"></div>
          <div class="radar-grid-ring ring-mid"></div>
          <div class="radar-grid-ring ring-inner"></div>
          <div class="radar-beam"></div>
          <div id="radar-sweep-canvas"></div>
        </div>
      </div>

      <div class="radar-results-wrapper">
        <h3 class="results-heading">Nearest Genomic Research Centers</h3>
        <div id="nodes-list" class="nodes-list"></div>
      </div>
    </main>
  </div>

  <script type="module" src="geo-tracker.js"></script>
</body>
</html>
