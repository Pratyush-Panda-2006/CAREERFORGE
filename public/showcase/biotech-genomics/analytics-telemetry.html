<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biotech Genomics - Privacy-Preserving Client Analytics</title>
  <link rel="stylesheet" href="analytics-telemetry.css">
</head>
<body>
  <div class="telemetry-container">
    <header class="telemetry-header">
      <h1>🧬 Biotech Genomics Telemetry & Heatmap Engine</h1>
      <p>Privacy-preserving interaction monitoring with automated client-side PII redacting and session metrics.</p>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="label">Session Active Time</div>
        <div id="metric-duration" class="value">0s</div>
      </div>
      <div class="metric-card">
        <div class="label">Max Scroll Depth</div>
        <div id="metric-scroll" class="value">0%</div>
      </div>
      <div class="metric-card">
        <div class="label">Heatmap Click Interactions</div>
        <div id="metric-clicks" class="value">0</div>
      </div>
    </div>

    <div class="event-stream">
      <h3>Live Sanitized Event Stream</h3>
      <ul id="event-log" class="event-list"></ul>
    </div>
  </div>

  <script type="module" src="analytics-telemetry.js"></script>
</body>
</html>
