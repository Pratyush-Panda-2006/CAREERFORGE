<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biotech Genomics - Sequence & Protocol Diff Inspector</title>
  <link rel="stylesheet" href="diff-viewer.css">
</head>
<body>
  <div class="diff-wrapper">
    <header class="diff-header">
      <div>
        <span class="diff-badge">Bioinformatics Audit</span>
        <h1>🧬 Genomic Sequence & Protocol Diff Inspector</h1>
        <p>Line-by-line comparative analysis highlighting genetic mutations, FASTA alterations, and assay amendments</p>
      </div>
      <div>
        <button id="loadSampleDiffBtn" class="btn btn-outline">Load Genomic Sequence Example</button>
      </div>
    </header>

    <section class="metrics-bar">
      <div class="metric-card">
        <span class="metric-label">Added Lines / Insertions</span>
        <span id="statAddedLines" class="metric-value added">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Removed Lines / Deletions</span>
        <span id="statRemovedLines" class="metric-value removed">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Conserved / Unchanged</span>
        <span id="statUnchangedLines" class="metric-value unchanged">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Sequence Divergence %</span>
        <span id="statChangePercent" class="metric-value percent">0%</span>
      </div>
    </section>

    <section class="diff-inputs">
      <div class="input-column">
        <label for="origTextInput">Wild-Type Sequence / Reference Assay (Original)</label>
        <textarea id="origTextInput" placeholder="Paste reference genomic sequence, primer record, or wild-type protocol..."></textarea>
      </div>
      <div class="input-column">
        <label for="modTextInput">Variant Allele / Edited Specimen (Modified)</label>
        <textarea id="modTextInput" placeholder="Paste mutant sequence, revised gRNA design, or edited protocol..."></textarea>
      </div>
    </section>

    <div class="actions-bar">
      <button id="compareDiffBtn" class="btn btn-primary">Run Genomic Diff</button>
    </div>

    <main class="diff-output-panel">
      <div id="diffOutputContainer">
        <!-- Rendered by diff-viewer.js -->
      </div>
    </main>
  </div>

  <script type="module" src="diff-viewer.js"></script>
</body>
</html>
