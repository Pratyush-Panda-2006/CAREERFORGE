<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store - Preset Snippet Library & Tag Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-container">
    <header class="vault-header">
      <div class="vault-title-wrap">
        <span class="vault-badge">E-Commerce Toolkit</span>
        <h1>🛒 Store Preset Snippet Vault</h1>
        <p>Production-ready checkout rules, discount configurations, pricing matrices, and inventory payloads</p>
      </div>
    </header>

    <section class="vault-controls">
      <div class="search-box-row">
        <div class="search-input-wrap">
          <input type="text" id="searchQueryInput" class="search-input" placeholder="Search ecommerce snippets, pricing schemas, or webhook payloads (e.g. discount, shipping, wholesale)...">
        </div>
      </div>
      <div id="tagFilterBar" class="tag-filter-bar">
        <!-- Rendered by snippet-vault.js -->
      </div>
    </section>

    <main id="snippetsGrid" class="snippets-grid">
      <!-- Rendered by snippet-vault.js -->
    </main>
  </div>

  <div id="copyToast" class="toast">Snippet copied to clipboard!</div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
