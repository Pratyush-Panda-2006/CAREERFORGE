<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce Store - Reactive Toast Notification Queue</title>
  <link rel="stylesheet" href="./event-notifier.css">
</head>
<body class="ecommerce-toast-theme">
  <div class="toast-hub-container">
    <header class="toast-header">
      <div class="branding-group">
        <span class="bell-icon">🔔</span>
        <h2>Ecommerce Store Audio & Reactive Notification Hub</h2>
      </div>
      <div class="header-controls">
        <label class="toggle-audio-label">
          <input type="checkbox" id="toggleAudioFeedback" checked>
          <span>Audio Chimes</span>
        </label>
      </div>
    </header>

    <div class="triggers-panel">
      <h3>Dispatch Test Store Alerts</h3>
      <div class="trigger-buttons-row">
        <button class="btn-trigger btn-info" data-toast-type="info" data-toast-title="Item Wishlisted" data-toast-msg="Saved Wireless Headphones to your saved items.">Info Toast</button>
        <button class="btn-trigger btn-success" data-toast-type="success" data-toast-title="Order Confirmed" data-toast-msg="Receipt #98432 sent to your registered email.">Success Toast</button>
        <button class="btn-trigger btn-warning" data-toast-type="warning" data-toast-title="Low Stock Warning" data-toast-msg="Only 2 units remaining in warehouse inventory.">Warning Toast</button>
        <button class="btn-trigger btn-danger" data-toast-type="danger" data-toast-title="Payment Declined" data-toast-msg="Billing gateway rejected the transaction card.">Danger Toast</button>
      </div>
    </div>

    <!-- Active Toast Viewport -->
    <div id="toastNotificationViewport" class="toast-viewport-stack" aria-live="polite">
      <!-- Toasts dynamically appended here -->
    </div>
  </div>

  <script type="module" src="./event-notifier.js"></script>
</body>
</html>
