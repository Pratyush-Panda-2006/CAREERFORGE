<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce Store - Privacy-Preserving Analytics Telemetry</title>
  <link rel="stylesheet" href="analytics-telemetry.css">
</head>
<body>
  <div class="telemetry-container">
    <div class="header-section">
      <div>
        <h1>Ecommerce Store Client Analytics</h1>
        <p>Privacy-Preserving In-Browser Telemetry &amp; Interaction Auditing</p>
      </div>
      <div class="session-info">
        <div class="duration-label">Active Session</div>
        <div class="duration-val" id="sessionDurationVal">00:00</div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="eventNameInput" placeholder="Enter telemetry event name (e.g. checkout_step_complete)" aria-label="Event Name">
      <button class="action-btn" id="triggerEventBtn">Log Interaction</button>
      <button class="action-btn secondary" id="exportAnalyticsBtn">Export JSON</button>
      <button class="action-btn secondary" id="clearAnalyticsBtn">Clear Log</button>
    </div>

    <div class="events-list-container">
      <div style="margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Captured Telemetry Stream (<span id="eventCountBadge">0</span> events)
      </div>
      <div id="eventsList"></div>
    </div>
  </div>

  <script type="module" src="analytics-telemetry.js"></script>
</body>
</html>
