<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Microgrid - Notification Queue & Alert Stream</title>
  <link rel="stylesheet" href="notification-hub.css">
</head>
<body>
  <div class="hub-wrapper">
    <header class="hub-header">
      <h1 class="hub-title">Renewable Microgrid Alert Stream & Dispatch Hub</h1>
      <p class="hub-subtitle">Real-time prioritized grid events, inverter thermal trips, frequency excursions, and telemetry logs.</p>
    </header>

    <div class="controls-card">
      <h3>Simulate Grid Telemetry Events</h3>
      <div class="btn-grid">
        <button id="triggerCriticalBtn" class="hub-btn hub-btn-critical">Trigger Breaker Trip</button>
        <button id="triggerWarningBtn" class="hub-btn hub-btn-warning">Trigger Solar Curtailment</button>
        <button id="triggerSuccessBtn" class="hub-btn hub-btn-success">Trigger Wind Sync</button>
        <button id="triggerInfoBtn" class="hub-btn hub-btn-info">Trigger Battery SoC</button>
        <button id="clearAllBtn" class="hub-btn hub-btn-secondary">Clear Queue</button>
      </div>
    </div>

    <div class="log-card">
      <h3>Grid Dispatch Telemetry Event Log</h3>
      <div id="notificationLogList" class="log-list"></div>
    </div>
  </div>

  <div id="toastViewport" class="toast-viewport"></div>

  <script type="module" src="notification-hub.js"></script>
</body>
</html>
