<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Microgrid - Grid Control Preset Snippet Vault</title>
  <link rel="stylesheet" href="snippet-vault.css">
</head>
<body>
  <div class="vault-wrapper">
    <header class="vault-header">
      <div>
        <h1 class="vault-title">Renewable Microgrid Algorithm Snippet Vault</h1>
        <p class="vault-subtitle">Search and inspect verified solar MPPT trackers, BESS C-rate throttles, wind pitch controllers, and droop regulators.</p>
      </div>
      <button id="openAddModalBtn" class="btn-primary">+ Add Grid Preset</button>
    </header>

    <div class="controls-bar">
      <input type="text" id="searchSnippetInput" class="search-input" placeholder="Search algorithms by keyword, equation parameter, inverter node, or tag...">
      <div id="tagFilterBar" class="tag-bar">
        <button class="filter-pill active" data-tag="all">All Presets</button>
        <button class="filter-pill" data-tag="solar">Solar MPPT</button>
        <button class="filter-pill" data-tag="battery">Battery BESS</button>
        <button class="filter-pill" data-tag="wind">Wind Pitch</button>
        <button class="filter-pill" data-tag="grid">Frequency Droop</button>
      </div>
    </div>

    <div id="snippetList" class="snippets-grid"></div>
  </div>

  <div id="addSnippetModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Save Microgrid Preset Snippet</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="newSnippetForm">
        <div class="form-group">
          <label for="inputSnippetTitle">Preset Title</label>
          <input type="text" id="inputSnippetTitle" placeholder="e.g. Synthetic Inertia Flywheel Injection Curve" required>
        </div>
        <div class="form-group">
          <label for="inputSnippetCategory">Category</label>
          <select id="inputSnippetCategory">
            <option value="solar">Solar MPPT</option>
            <option value="battery">Battery BESS</option>
            <option value="wind">Wind Pitch</option>
            <option value="grid">Frequency Droop</option>
            <option value="general">General</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputSnippetTags">Tags (comma-separated)</label>
          <input type="text" id="inputSnippetTags" placeholder="grid, inertia, frequency">
        </div>
        <div class="form-group">
          <label for="inputSnippetDesc">Description</label>
          <input type="text" id="inputSnippetDesc" placeholder="Brief technical summary...">
        </div>
        <div class="form-group">
          <label for="inputSnippetCode">Algorithm / Control Equation</label>
          <textarea id="inputSnippetCode" rows="6" placeholder="// Enter JavaScript microgrid dispatch function..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Save to Vault</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="snippet-vault.js"></script>
</body>
</html>
