<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Microgrid - Collaborative Freehand Vector Sketchpad & Whiteboard Canvas</title>
  <link rel="stylesheet" href="canvas-whiteboard.css">
</head>
<body>
  <div class="whiteboard-container">
    <header class="whiteboard-header">
      <div class="header-badge">RENEWABLE-MICROGRID WHITEBOARD</div>
      <h1>Renewable Microgrid - Vector Whiteboard Canvas</h1>
      <p>Collaborative freehand vector sketchpad with stroke smoothing, undo/redo history, and SVG vector export</p>
    </header>

    <div class="toolbar-dock">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="pen" title="Freehand Pen">âœ ï¸  Pen</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">âŒ« Eraser</button>
      </div>

      <div class="color-palette">
        <button class="color-chip active" data-color="#10b981" style="background: #10b981;" title="Theme Accent"></button>
        <button class="color-chip" data-color="#38bdf8" style="background: #38bdf8;" title="Cyan"></button>
        <button class="color-chip" data-color="#4ade80" style="background: #4ade80;" title="Green"></button>
        <button class="color-chip" data-color="#f59e0b" style="background: #f59e0b;" title="Amber"></button>
        <button class="color-chip" data-color="#ec4899" style="background: #ec4899;" title="Pink"></button>
        <button class="color-chip" data-color="#ffffff" style="background: #ffffff;" title="White"></button>
      </div>

      <div class="action-group">
        <button id="undoBtn" class="action-btn" title="Undo stroke">â†© Undo</button>
        <button id="redoBtn" class="action-btn" title="Redo stroke">â†ª Redo</button>
        <button id="clearBtn" class="action-btn subtle" title="Clear canvas">âœ– Clear</button>
        <button id="exportSvgBtn" class="action-btn primary" title="Export as SVG">â¤“ Export SVG</button>
      </div>
    </div>

    <main class="canvas-wrapper">
      <canvas id="whiteboardCanvas" width="900" height="520"></canvas>
    </main>

    <footer class="whiteboard-footer">
      <div id="whiteboard-status" class="status-indicator">Ready â€¢ Vector Canvas Initialized</div>
    </footer>
  </div>

  <script type="module" src="canvas-whiteboard.js"></script>
</body>
</html>
