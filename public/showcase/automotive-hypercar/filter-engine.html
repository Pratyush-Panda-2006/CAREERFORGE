<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automotive Hypercar - Dynamic Search & Filter Engine</title>
  <link rel="stylesheet" href="filter-engine.css">
</head>
<body>
  <div class="hypercar-filter-container">
    <header class="filter-header">
      <div class="header-titles">
        <span class="filter-badge">Telemetry & Specs Filter</span>
        <h1 class="filter-title">Hypercar Dynamic Performance Finder</h1>
        <p class="filter-subtitle">In-memory sub-millisecond filtering across aero packages, powertrains, and dyno telemetry.</p>
      </div>
    </header>

    <!-- Controls Bar: Search & Sort -->
    <section class="controls-panel">
      <div class="search-box-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="hypercarSearchInput" class="search-input" placeholder="Search by model, brand, engine (V12, electric, hybrid)..." autocomplete="off">
        <button type="button" id="clearSearchBtn" class="btn-clear" aria-label="Clear search">
          &times;
        </button>
      </div>

      <div class="sort-box-wrapper">
        <label for="sortSelect" class="sort-label">Sort By:</label>
        <select id="sortSelect" class="sort-select">
          <option value="horsepower-desc">Horsepower (Highest First)</option>
          <option value="horsepower-asc">Horsepower (Lowest First)</option>
          <option value="topSpeed-desc">Top Speed (Fastest First)</option>
          <option value="zeroToSixty-asc">0-100 km/h (Quickest First)</option>
          <option value="price-desc">Price (High to Low)</option>
          <option value="price-asc">Price (Low to High)</option>
        </select>
      </div>
    </section>

    <!-- Tag Chips -->
    <section class="tags-panel">
      <span class="tags-label">Attributes:</span>
      <div class="chips-row">
        <button type="button" class="filter-chip" data-tag="v12">V12 Engine</button>
        <button type="button" class="filter-chip" data-tag="v8">V8 Twin-Turbo</button>
        <button type="button" class="filter-chip" data-tag="electric">EV / Quad-Motor</button>
        <button type="button" class="filter-chip" data-tag="hybrid">Hybrid Powertrain</button>
        <button type="button" class="filter-chip" data-tag="twin-turbo">Twin-Turbo</button>
        <button type="button" class="filter-chip" data-tag="track">Track-Focused</button>
        <button type="button" class="filter-chip" data-tag="aero">Active Aero</button>
      </div>
    </section>

    <!-- Summary Bar -->
    <div class="results-bar">
      <span id="resultCount" class="results-count">Loading hypercars...</span>
      <button type="button" id="resetFiltersBtn" class="btn-reset-filters">Reset Filters</button>
    </div>

    <!-- Results Grid -->
    <main id="hypercarResultsGrid" class="hypercar-grid"></main>

    <!-- Empty State Alert -->
    <div id="emptyStateAlert" class="empty-state-alert hidden">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <h3>No Hypercars Found</h3>
      <p>No prototype or production models matched your active filters and search query.</p>
    </div>
  </div>

  <script type="module" src="filter-engine.js"></script>
</body>
</html>
