<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automotive Hypercar - Monte Carlo Simulation Sandbox</title>
  <link rel="stylesheet" href="simulation-sandbox.css">
</head>
<body>
  <div class="sim-container">
    <div class="header-section">
      <h1>Hypercar Lap &amp; Thermal Risk Simulator</h1>
      <p>Monte Carlo Multi-Scenario Track Trial &amp; Risk Variance Forecaster</p>
    </div>

    <div class="params-grid">
      <div class="param-group">
        <label for="trialsInput">Trial Iterations</label>
        <input type="number" id="trialsInput" value="1000" min="100" max="20000" step="100">
      </div>
      <div class="param-group">
        <label for="volatilityInput">Tire Degradation Volatility (σ)</label>
        <input type="number" id="volatilityInput" value="0.08" min="0.01" max="1.0" step="0.01">
      </div>
      <div class="param-group">
        <label for="baseLapInput">Baseline Lap Pace (seconds)</label>
        <input type="number" id="baseLapInput" value="78.5" min="30" max="300" step="0.5">
      </div>
      <button class="run-btn" id="runSimulationBtn">Run Simulation</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Projected Mean Lap Time</div>
        <div class="stat-value" id="statMean">-- s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Standard Deviation (σ)</div>
        <div class="stat-value" id="statStdDev">-- s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Median Lap (p50)</div>
        <div class="stat-value" id="statP50">-- s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">95th Percentile Risk Pace (p95)</div>
        <div class="stat-value" id="statP95">-- s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">99th Percentile Worst Case (p99)</div>
        <div class="stat-value" id="statP99">-- s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fastest / Slowest Delta</div>
        <div class="stat-value" id="statMinMax">-- s</div>
      </div>
    </div>
  </div>

  <script type="module" src="simulation-sandbox.js"></script>
</body>
</html>
