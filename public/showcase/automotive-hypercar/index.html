<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Dynamics — All-Electric Hypercar Concept</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="badge">1,900 HP • ALL-WHEEL VECTORING</div>
    <h1>APEX ZERO HYPERCAR</h1>
    <p>0 to 60 MPH in 1.74s • Carbon Monocoque Chassis • Solid-State Battery</p>
    <button className="reserve-btn" onclick="reserveHypercar()">Reserve Allocation ↗</button>
  </header>

  <main className="specs-grid">
    <div className="spec-card">
      <span className="val">1.74s</span>
      <span className="lbl">0-60 MPH</span>
    </div>
    <div className="spec-card">
      <span className="val">258 MPH</span>
      <span className="lbl">TOP SPEED</span>
    </div>
    <div className="spec-card">
      <span className="val">520 MI</span>
      <span className="lbl">EV RANGE</span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
