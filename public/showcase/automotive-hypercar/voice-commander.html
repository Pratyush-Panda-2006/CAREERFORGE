<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Zero - Voice Commander & Speech Dispatcher</title>
  <link rel="stylesheet" href="voice-commander.css">
</head>
<body class="hypercar-voice-theme">
  <div class="voice-commander-container">
    <header class="commander-header">
      <div class="brand-group">
        <span class="pulse-mic-icon">🎙️</span>
        <h2>Apex Zero Voice Commander</h2>
      </div>
      <div id="voiceStatusBadge" class="status-badge ready">READY</div>
    </header>

    <div class="mic-control-card">
      <button id="micToggleBtn" class="mic-action-btn">
        <span class="mic-inner-icon">🎤</span>
        <span class="mic-btn-label">Activate Microphone</span>
      </button>
      <div class="audio-wave-visualizer" id="audioWaveVisualizer" aria-hidden="true">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="simulated-commands-bar">
        <span class="sim-label">Simulate Quick Voice Inputs:</span>
        <button class="voice-chip" data-voice-command="start engine">"Start Engine"</button>
        <button class="voice-chip" data-voice-command="launch control">"Launch Control"</button>
        <button class="voice-chip" data-voice-command="telemetry status">"Telemetry Status"</button>
        <button class="voice-chip" data-voice-command="torque vectoring">"Torque Vectoring"</button>
        <button class="voice-chip" data-voice-command="unknown maneuver test">"Unknown Maneuver"</button>
      </div>
    </div>

    <section class="command-history-panel">
      <div class="panel-header">
        <h3>Recognized Command History</h3>
      </div>
      <div id="commandHistoryLog" class="history-stream-log">
        <!-- Log entries -->
      </div>
    </section>
  </div>

  <div id="speechToast" class="speech-toast" role="status" aria-live="polite"></div>

  <script type="module" src="voice-commander.js"></script>
</body>
</html>
