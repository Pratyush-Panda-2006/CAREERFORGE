<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Museum 3D - Finite State Machine Visualizer</title>
  <link rel="stylesheet" href="state-diagram.css">
</head>
<body>
  <div class="fsm-container">
    <header class="fsm-header">
      <h1>Virtual Museum 3D - Gallery FSM Visualizer</h1>
      <p>Finite state machine modeling 3D museum exploration, artifact inspection, and VR immersion</p>
    </header>

    <div class="current-state-panel">
      <div>
        <span style="color: var(--museum-dim); font-size: 0.9rem; text-transform: uppercase;">Visitor State: </span>
        <span id="current-state-badge" class="state-badge">MUSEUM_LOBBY</span>
      </div>
      <button id="reset-fsm-btn" class="reset-btn">Reset FSM</button>
    </div>

    <div class="fsm-grid">
      <div class="fsm-card">
        <h3>Museum Gallery States</h3>
        <div id="nodes-container" class="nodes-container"></div>

        <h3>Dispatch Exploration Event</h3>
        <div id="event-triggers" class="event-triggers"></div>
      </div>

      <div class="fsm-card">
        <h3>Mermaid.js State Diagram</h3>
        <div id="mermaid-output" class="mermaid-box"></div>

        <h3>Visitor Event Log</h3>
        <ul id="history-log" class="history-list"></ul>
      </div>
    </div>
  </div>

  <script type="module" src="state-diagram.js"></script>
</body>
</html>
