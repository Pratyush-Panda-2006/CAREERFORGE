<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Museum 3D - Guided Tour Controller</title>
  <link rel="stylesheet" href="./virtual-tour.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #09131d;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #tour-root {
      max-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="tour-root"></div>

  <script type="module">
    import { VirtualMuseum3dTourGuide } from './virtual-tour.js';

    const root = document.getElementById('tour-root');
    const guide = new VirtualMuseum3dTourGuide();
    guide.renderToDOM(root);
  </script>
</body>
</html>
