<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Museum 3D - Branded Graphic Certificate & Receipt</title>
  <link rel="stylesheet" href="export-receipt.css">
</head>
<body>
  <div class="receipt-container">
    <header class="receipt-header">
      <div class="badge-tag">Virtual Museum 3D Certificate Exporter</div>
      <h1>Branded Graphic Certificate & Receipt Exporter</h1>
      <p>HTML5 Canvas 2D vector drawing engine generating high-DPI branded certificates with custom barcode patterns and PNG export.</p>
    </header>

    <div class="receipt-grid">
      <section class="receipt-panel preview-panel">
        <h2>Live Certificate Preview</h2>
        <div class="canvas-frame">
          <canvas id="receiptCanvas" width="560" height="320" class="receipt-canvas"></canvas>
        </div>

        <div class="export-actions">
          <button id="downloadReceiptBtn" class="btn-primary">Download PNG Receipt</button>
        </div>
      </section>

      <section class="receipt-panel custom-panel">
        <h2>Customize Certificate Details</h2>

        <div class="input-group">
          <label for="receiptTitleInput">Document Title</label>
          <input type="text" id="receiptTitleInput" value="VIP Museum Pass & Exhibit Certificate" class="text-input">
        </div>

        <div class="input-group">
          <label for="recipientInput">Recipient / Reference</label>
          <input type="text" id="recipientInput" value="Gallery Patron #4829" class="text-input">
        </div>

        <div class="input-group">
          <label for="refCodeInput">Authentication Code</label>
          <input type="text" id="refCodeInput" value="VM3D-VIP-9941" class="text-input">
        </div>

        <div class="input-group">
          <label for="accentColorPicker">Branded Color Accent</label>
          <input type="color" id="accentColorPicker" value="#38bdf8" class="color-input">
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="export-receipt.js"></script>
</body>
</html>
