<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Museum 3D - Notification Queue & Alert Stream</title>
  <link rel="stylesheet" href="notification-hub.css">
</head>
<body>
  <div class="hub-wrapper">
    <header class="hub-header">
      <h1 class="hub-title">Virtual Museum 3D Curatorial Alert Hub</h1>
      <p class="hub-subtitle">Real-time prioritized 3D exhibit rendering alerts, photogrammetry texture memory warnings, and gallery tour events.</p>
    </header>

    <div class="controls-card">
      <h3>Simulate Gallery & 3D Render Events</h3>
      <div class="btn-grid">
        <button id="triggerCriticalBtn" class="hub-btn hub-btn-critical">Trigger VRAM Overflow</button>
        <button id="triggerWarningBtn" class="hub-btn hub-btn-warning">Trigger Shader Warning</button>
        <button id="triggerSuccessBtn" class="hub-btn hub-btn-success">Trigger 8K Texture</button>
        <button id="triggerInfoBtn" class="hub-btn hub-btn-info">Trigger Audio Tour</button>
        <button id="clearAllBtn" class="hub-btn hub-btn-secondary">Clear Queue</button>
      </div>
    </div>

    <div class="log-card">
      <h3>Gallery Exhibition Telemetry Audit Log</h3>
      <div id="notificationLogList" class="log-list"></div>
    </div>
  </div>

  <div id="toastViewport" class="toast-viewport"></div>

  <script type="module" src="notification-hub.js"></script>
</body>
</html>
