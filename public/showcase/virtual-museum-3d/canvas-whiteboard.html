<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Museum 3D - Collaborative Freehand Vector Whiteboard</title>
  <link rel="stylesheet" href="canvas-whiteboard.css">
</head>
<body>
  <div class="whiteboard-container">
    <div class="header-section">
      <div>
        <h1>Virtual Museum 3D Artifact Sketchpad</h1>
        <p class="subtitle">Exhibit Blueprints, Spatial Curatorial Diagrams & Artifact Annotation Whiteboard</p>
      </div>
      <div>
        <button class="tool-btn" id="exportSvgBtn">Export SVG</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="pen">Pen</button>
        <button class="tool-btn" data-tool="eraser">Eraser</button>
      </div>

      <div class="color-palette">
        <div class="color-chip" style="background: #eab308;" data-color="#eab308" title="Gold (Ancient Gold)"></div>
        <div class="color-chip" style="background: #38bdf8;" data-color="#38bdf8" title="Cyan (Virtual Hologram)"></div>
        <div class="color-chip" style="background: #ef4444;" data-color="#ef4444" title="Crimson (Ruby Relic)"></div>
        <div class="color-chip" style="background: #10b981;" data-color="#10b981" title="Emerald (Jade Artifact)"></div>
        <div class="color-chip" style="background: #ffffff;" data-color="#ffffff" title="White"></div>
      </div>

      <div class="tool-group" style="margin-left: auto;">
        <button class="tool-btn" id="undoBtn">Undo</button>
        <button class="tool-btn" id="redoBtn">Redo</button>
        <button class="tool-btn" id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="canvas-viewport">
      <canvas id="whiteboardCanvas" width="850" height="480"></canvas>
    </div>
  </div>

  <script type="module" src="canvas-whiteboard.js"></script>
</body>
</html>
