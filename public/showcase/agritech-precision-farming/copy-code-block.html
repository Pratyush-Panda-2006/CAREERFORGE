<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agritech Precision Farming - Syntax-Highlighted Code Snippet Box</title>
  <link rel="stylesheet" href="copy-code-block.css">
</head>
<body>
  <div class="code-box-container" data-copy-code-lab>
    <header class="header">
      <h1>MicroPython Irrigation Controller Script</h1>
      <p class="subtitle">Syntax-highlighted code block with line gutters and one-click clipboard copying</p>
    </header>

    <main class="code-card">
      <div class="code-card-header">
        <div class="window-decorations">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <span class="lang-badge">Python / MicroPython</span>
        <div class="copy-wrapper">
          <button id="copy-btn" class="copy-button" aria-label="Copy code to clipboard">
            <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy Snippet</span>
          </button>
          <span id="copy-tooltip" class="copy-tooltip">Copied to clipboard!</span>
        </div>
      </div>

      <div class="code-viewport">
        <div id="line-numbers" class="gutter"></div>
        <pre class="code-content"><code id="code-lines"></code></pre>
      </div>
    </main>
  </div>
  <script type="module" src="copy-code-block.js"></script>
</body>
</html>
