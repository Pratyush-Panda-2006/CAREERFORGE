<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TERRA-AGRI Command Palette</title>
  <link rel="stylesheet" href="command-palette.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to TERRA-AGRI</a>
    <h1>Command palette</h1>
    <p>Jump between farm actions without leaving the keyboard.</p>
    <button type="button" id="open">Search commands <kbd>Ctrl</kbd> / <kbd>Cmd</kbd> + <kbd>K</kbd></button>
    <p id="status" role="status"></p>
  </main>
  <dialog id="palette" aria-label="Command palette">
    <input id="query" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list"
      aria-label="Search commands" placeholder="Type a command" autocomplete="off" spellcheck="false">
    <ul id="results" role="listbox" aria-label="Commands"></ul>
    <footer><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></footer>
  </dialog>
  <script type="module" src="command-palette.js"></script>
</body>
</html>
