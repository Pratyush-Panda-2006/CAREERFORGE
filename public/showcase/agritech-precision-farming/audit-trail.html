<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agritech Precision Farming — Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <header class="audit-header">
      <div class="title-wrap">
        <h1>🔒 Cryptographic Telemetry Audit Trail</h1>
        <p>Tamper-evident SHA-256 blockchain audit logs securing historical soil sensor observations and drone survey dispatches.</p>
      </div>
      <div id="integrityBadge" class="status-badge status-valid">VERIFYING INTEGRITY...</div>
    </header>

    <div class="controls-bar">
      <select id="filterActionSelect" class="filter-select">
        <option value="ALL">All Recorded Actions</option>
        <option value="GENESIS_INIT">Genesis Init</option>
        <option value="SOIL_TELEMETRY">Soil Telemetry</option>
        <option value="DRONE_SURVEY">Drone Survey</option>
        <option value="IRRIGATION_DISPATCH">Irrigation Dispatch</option>
      </select>
      <button type="button" id="logSoilEventBtn" class="btn-audit">+ Soil Log</button>
      <button type="button" id="logDroneEventBtn" class="btn-audit">+ UAV Scan</button>
      <button type="button" id="logIrrigateBtn" class="btn-audit">+ Irrigation</button>
      <button type="button" id="verifyChainBtn" class="btn-audit btn-primary">🔍 Re-Verify Chain</button>
      <button type="button" id="exportChainBtn" class="btn-audit">📥 Export JSON</button>
      <button type="button" id="clearChainBtn" class="btn-audit">🔄 Reset</button>
    </div>

    <!-- Feed Container -->
    <div id="auditTimelineContainer" class="timeline-feed">
      <!-- Rendered dynamically -->
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Agritech Precision Farming Showcase Dashboard</a>
    </nav>
  </div>

  <script type="module" src="audit-trail.js"></script>
</body>
</html>
