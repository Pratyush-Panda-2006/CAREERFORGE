<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Audio Stream — Dynamic Search & Filter Engine</title>
  <link rel="stylesheet" href="filter-engine.css">
</head>
<body>
  <div class="filter-container">
    <header class="filter-header">
      <span class="filter-badge">EPISODE FILTER ENGINE</span>
      <h1>🎙️ Podcast Audio Stream Episode Search & Filter</h1>
      <p>Dynamic in-memory search, tag filtering, and multi-attribute sorting engine for audio streams, guest appearances, and series topics.</p>
    </header>

    <div class="search-bar-row">
      <input type="text" id="keywordInput" class="search-input" placeholder="Search by episode title, guest, or topic keywords...">
      <button type="button" id="clearSearchBtn" class="btn-clear">Clear</button>
    </div>

    <div class="filter-controls-row">
      <div class="tag-chips-wrap" id="tagChipsWrap">
      </div>

      <div class="sort-wrap">
        <label for="sortFieldSelect">Sort By:</label>
        <select id="sortFieldSelect" class="sort-select">
          <option value="name">Title (A-Z)</option>
          <option value="rating">Rating</option>
          <option value="popularity">Total Listens</option>
        </select>
        <button type="button" id="toggleSortDirBtn" class="btn-dir">ASC ↑</button>
      </div>
    </div>

    <div class="results-meta">
      <span>Showing <strong id="resultCount">0</strong> episodes</span>
    </div>

    <div class="results-grid" id="resultsGrid">
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Podcast Audio Stream Showcase</a>
    </nav>
  </div>

  <script type="module" src="filter-engine.js"></script>
</body>
</html>
