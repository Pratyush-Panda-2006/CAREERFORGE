<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Audio Stream - Accessibility Inspector</title>
  <link rel="stylesheet" href="./accessibility-assistant.css">
</head>
<body class="podcast-a11y-theme">
  <div class="a11y-assistant-container">
    <header class="a11y-header">
      <div class="branding-group">
        <span class="a11y-icon">♿</span>
        <h2>Podcast Audio Stream WCAG & Contrast Inspector</h2>
      </div>
      <div class="header-actions">
        <label class="toggle-switch">
          <input type="checkbox" id="toggleHighContrast">
          <span class="slider"></span>
          <span class="toggle-label">High Contrast Mode</span>
        </label>
        <button id="btnInspectA11y" class="action-btn">Re-Inspect UI</button>
      </div>
    </header>

    <div class="wcag-standards-banner">
      <div class="standard-pill pass">WCAG 2.1 AA Normal (4.5:1)</div>
      <div class="standard-pill pass">WCAG 2.1 AA Large (3.0:1)</div>
      <div class="standard-pill premium">WCAG 2.1 AAA Normal (7.0:1)</div>
    </div>

    <section class="results-panel">
      <div class="panel-header">
        <h3>Component Contrast & Keyboard Audit Results</h3>
      </div>
      <div id="a11yResultsList" class="results-list">
        <!-- Injected dynamically -->
      </div>
    </section>
  </div>

  <script type="module" src="./accessibility-assistant.js"></script>
</body>
</html>
