<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Audio Stream — User Settings & Preferences</title>
  <link rel="stylesheet" href="preferences.css">
</head>
<body>
  <div class="preferences-container">
    <header class="pref-header">
      <span class="pref-badge">STATE ENGINE</span>
      <h1>⚙️ Podcast Audio Stream Settings & Preferences</h1>
      <p>Adaptive user settings and preference persistence state engine for audio playback speeds, silence skipping, volume equalization, and UI themes.</p>
    </header>

    <div class="pref-card" id="podcast-audio-stream-preferences-modal">
      <h2>Audio Stream & Interface Preferences</h2>
      
      <div class="pref-group">
        <label for="themeSelect">Color Theme</label>
        <select id="themeSelect" class="pref-select">
          <option value="dark">Dark Obsidian</option>
          <option value="light">Light Minimal</option>
          <option value="system">Follow System</option>
        </select>
      </div>

      <div class="pref-group">
        <label for="layoutSelect">Episode Feed Layout</label>
        <select id="layoutSelect" class="pref-select">
          <option value="grid">Grid Cards</option>
          <option value="list">Compact Tracklist</option>
          <option value="timeline">Chronological Timeline</option>
        </select>
      </div>

      <div class="pref-group">
        <label for="speedSelect">Default Playback Velocity</label>
        <select id="speedSelect" class="pref-select">
          <option value="0.75">0.75x Slow</option>
          <option value="1.0">1.0x Normal</option>
          <option value="1.25">1.25x Swift</option>
          <option value="1.5">1.5x Rapid</option>
          <option value="2.0">2.0x Double Speed</option>
        </select>
      </div>

      <div class="pref-group">
        <label for="volumeSlider">Default Master Volume</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="pref-range">
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="skipSilenceToggle" checked>
          <span>Smart Trim Silence (Compress dead air dynamically)</span>
        </label>
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="autoPlayNextToggle" checked>
          <span>Continuous Autoplay Next Queued Episode</span>
        </label>
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="soundToggle">
          <span>Enable Acoustic Audio Feedback & Cues</span>
        </label>
      </div>

      <div class="pref-group">
        <label class="toggle-wrap">
          <input type="checkbox" id="contrastToggle">
          <span>High Contrast Waveform Visualizer Mode</span>
        </label>
      </div>

      <div class="pref-actions">
        <button type="button" id="savePrefBtn" class="btn btn-primary">Save Changes</button>
        <button type="button" id="resetPrefBtn" class="btn btn-secondary">Reset Defaults</button>
        <button type="button" id="exportPrefBtn" class="btn btn-outline">Export Configuration</button>
      </div>
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Podcast Audio Stream Showcase</a>
    </nav>
  </div>

  <script type="module" src="preferences.js"></script>
</body>
</html>
