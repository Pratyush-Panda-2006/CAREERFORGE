<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Audio Stream - Feature Spotlight Onboarding Tour</title>
  <link rel="stylesheet" href="./virtual-tour.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #tour-root {
      max-width: 850px;
      width: 100%;
    }
    .podcast-audio-stream-mock-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      max-width: 850px;
      width: 100%;
    }
    .mock-card {
      padding: 1.5rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #cbd5e1;
    }
    .mock-card h4 {
      margin: 0 0 0.5rem 0;
      color: #8b5cf6;
      font-size: 1.1rem;
    }
    .mock-card p {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="tour-root"></div>

  <div class="podcast-audio-stream-mock-grid">
    <div id="waveform-card" class="mock-card">
      <h4>Binaural Waveform</h4>
      <p>Live spectrum analyser and LUFS loudness normalizer.</p>
    </div>
    <div id="queue-card" class="mock-card">
      <h4>Audio Queue</h4>
      <p>Gapless playback buffer with seamless crossfade.</p>
    </div>
    <div id="dsp-card" class="mock-card">
      <h4>DSP Equalizer</h4>
      <p>Parametric 10-band acoustic frequency shaper.</p>
    </div>
    <div id="analytics-card" class="mock-card">
      <h4>Audience Telemetry</h4>
      <p>Listener retention graphs and geo-stream metrics.</p>
    </div>
  </div>

  <script type="module">
    import { PodcastAudioStreamTourGuide } from './virtual-tour.js';

    const root = document.getElementById('tour-root');
    const guide = new PodcastAudioStreamTourGuide();
    guide.renderToDOM(root);
  </script>
</body>
</html>
