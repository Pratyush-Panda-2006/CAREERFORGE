<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Audio Stream - Production Pipeline</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
  <style>
    body {
      background: #0d1117;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .pas-pipeline-controls {
      display: flex;
      gap: 12px;
    }
    .pas-btn {
      padding: 8px 16px;
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Podcast Production Pipeline</h1>
  <div class="pas-pipeline-controls">
    <button class="pas-btn" id="btn-add-task">+ Schedule Audio Track</button>
  </div>
  <div id="pipeline-root"></div>

  <script type="module">
    import { PodcastAudioStreamPipelineEngine } from './workflow-pipeline.js';

    const engine = new PodcastAudioStreamPipelineEngine();
    const root = document.getElementById('pipeline-root');

    document.getElementById('btn-add-task').addEventListener('click', () => {
      engine.addTask({
        title: `Episode Track Mixdown #${Math.floor(Math.random() * 1000)}`,
        description: 'Auto-scheduled production task.',
        columnId: 'recording-prep',
        priority: 'high',
        assignee: 'Audio Engineer',
        durationEst: '1.5h'
      });
      engine.render(root);
    });

    engine.render(root);
  </script>
</body>
</html>
