<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Audio Stream - Notification Hub</title>
  <link rel="stylesheet" href="notification-hub.css">
  <style>
    body {
      background: #0d1117;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .pas-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pas-btn {
      padding: 8px 16px;
      border: 1px solid rgba(249, 115, 22, 0.4);
      background: rgba(30, 41, 59, 0.8);
      color: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .pas-btn:hover {
      background: rgba(249, 115, 22, 0.25);
      border-color: #f97316;
    }
  </style>
</head>
<body>
  <h1>Podcast Audio Stream Notification Queue</h1>
  <div class="pas-controls">
    <button class="pas-btn" id="btn-critical">HLS Decode Error (Critical)</button>
    <button class="pas-btn" id="btn-warning">Buffer Underrun (Warning)</button>
    <button class="pas-btn" id="btn-success">Episode Downloaded (Success)</button>
    <button class="pas-btn" id="btn-info">Chapter Synced (Info)</button>
    <button class="pas-btn" id="btn-clear">Clear All</button>
  </div>

  <div id="hub-root" class="pas-notification-hub-container"></div>

  <script type="module">
    import { PodcastAudioStreamNotificationHub } from './notification-hub.js';

    const hub = new PodcastAudioStreamNotificationHub();
    const container = document.getElementById('hub-root');

    hub.subscribe(() => {
      hub.render(container);
    });

    document.getElementById('btn-critical').addEventListener('click', () => {
      hub.enqueue('AAC stream segment decode failure at timestamp 00:42:15. Reconnecting...', 'critical', 'critical');
    });

    document.getElementById('btn-warning').addEventListener('click', () => {
      hub.enqueue('Network bandwidth dropped below 192kbps. Adaptive bitrate switching to 96kbps.', 'warning', 'warning');
    });

    document.getElementById('btn-success').addEventListener('click', () => {
      hub.enqueue('Episode 142 "The Quantum Frontier" cached for offline listening.', 'success', 'success');
    });

    document.getElementById('btn-info').addEventListener('click', () => {
      hub.enqueue('Synchronized ID3 chapter: "3. Neural Synthesis Architecture" at 18:20.', 'info', 'info');
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      hub.clearQueue();
    });

    hub.render(container);
  </script>
</body>
</html>
