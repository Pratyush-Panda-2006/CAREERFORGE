<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Smart Contracts — Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <header class="audit-header">
      <div class="title-wrap">
        <h1>🔒 Cryptographic Smart Contract Audit Trail</h1>
        <p>Tamper-evident SHA-256 blockchain audit logs securing legal covenant approvals and multi-sig arbitration rulings.</p>
      </div>
      <div id="integrityBadge" class="status-badge status-valid">VERIFYING INTEGRITY...</div>
    </header>

    <div class="controls-bar">
      <select id="filterActionSelect" class="filter-select">
        <option value="ALL">All Recorded Actions</option>
        <option value="GENESIS_CONTRACT_ROOT">Genesis Root</option>
        <option value="MULTI_SIG_EXEC">Multi-Sig Exec</option>
        <option value="ARBITRATION_PETITION">Arbitration</option>
        <option value="ESCROW_RELEASE">Escrow Release</option>
      </select>
      <button type="button" id="logSignEventBtn" class="btn-audit">+ Multi-Sig</button>
      <button type="button" id="logDisputeEventBtn" class="btn-audit">+ Dispute</button>
      <button type="button" id="logEscrowBtn" class="btn-audit">+ Escrow</button>
      <button type="button" id="verifyChainBtn" class="btn-audit btn-primary">🔍 Re-Verify Chain</button>
      <button type="button" id="exportChainBtn" class="btn-audit">📥 Export JSON</button>
      <button type="button" id="clearChainBtn" class="btn-audit">🔄 Reset</button>
    </div>

    <!-- Feed Container -->
    <div id="auditTimelineContainer" class="timeline-feed">
      <!-- Rendered dynamically -->
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Legal Smart Contracts Showcase Dashboard</a>
    </nav>
  </div>

  <script type="module" src="audit-trail.js"></script>
</body>
</html>
