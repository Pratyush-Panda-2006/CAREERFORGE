<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEX-ESCROW Feedback</title>
  <link rel="stylesheet" href="feedback-collector.css">
</head>
<body>
  <main>
    <a href="index.html">&larr; Back to LEX-ESCROW</a>
    <form class="card">
      <h1>How was your experience?</h1>
      <p>Your answer is saved in this browser only.</p>
      <fieldset>
        <legend>Rating</legend>
        <label><input type="radio" name="score" value="1" required><span aria-hidden="true">&#128542;</span>Awful</label>
        <label><input type="radio" name="score" value="2"><span aria-hidden="true">&#128533;</span>Poor</label>
        <label><input type="radio" name="score" value="3"><span aria-hidden="true">&#128528;</span>Okay</label>
        <label><input type="radio" name="score" value="4"><span aria-hidden="true">&#128578;</span>Good</label>
        <label><input type="radio" name="score" value="5"><span aria-hidden="true">&#128525;</span>Great</label>
      </fieldset>
      <label for="comment">Anything to add? (optional)</label>
      <textarea id="comment" name="comment" rows="3" maxlength="500"></textarea>
      <button type="submit">Send feedback</button>
    </form>
    <section class="card" id="thanks" hidden>
      <h2>Thanks for the feedback</h2>
      <p id="summary" role="status"></p>
      <button type="button" id="again">Rate again</button>
    </section>
  </main>
  <script type="module" src="feedback-collector.js"></script>
</body>
</html>
