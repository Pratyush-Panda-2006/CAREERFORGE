<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Smart Contracts - Voice Commander & Speech Dispatcher</title>
  <link rel="stylesheet" href="./voice-commander.css">
</head>
<body class="legal-voice-theme">
  <div class="voice-commander-container">
    <header class="commander-header">
      <div class="brand-group">
        <span class="pulse-mic-icon">🎙️</span>
        <h2>Legal Smart Contracts Voice Commander</h2>
      </div>
      <div id="voiceStatusBadge" class="status-badge ready">READY</div>
    </header>

    <div class="mic-control-card">
      <button id="micToggleBtn" class="mic-action-btn">
        <span class="mic-inner-icon">🎤</span>
        <span class="mic-btn-label">Activate Microphone</span>
      </button>
      <div class="simulated-commands-bar">
        <span>Simulate Quick Voice Inputs:</span>
        <button class="voice-chip" data-voice-command="sign contract">"Sign Contract"</button>
        <button class="voice-chip" data-voice-command="audit clauses">"Audit Clauses"</button>
        <button class="voice-chip" data-voice-command="check escrow">"Check Escrow"</button>
        <button class="voice-chip" data-voice-command="unknown action test">"Unknown Action"</button>
      </div>
    </div>

    <section class="command-history-panel">
      <div class="panel-header">
        <h3>Recognized Command History</h3>
      </div>
      <div id="commandHistoryLog" class="history-stream-log">
        <!-- Log entries -->
      </div>
    </section>
  </div>

  <script type="module" src="./voice-commander.js"></script>
</body>
</html>
