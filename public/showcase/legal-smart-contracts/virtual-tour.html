<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Smart Contracts - Protocol Guided Tour</title>
  <link rel="stylesheet" href="virtual-tour.css">
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #090a0f;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .wrapper {
      width: 100%;
      max-width: 800px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="tour-root"></div>
  </div>

  <script type="module">
    import { LegalSmartContractsTourGuide } from './virtual-tour.js';

    const tour = new LegalSmartContractsTourGuide();
    const root = document.getElementById('tour-root');
    tour.renderToDOM(root);
  </script>

</html>
