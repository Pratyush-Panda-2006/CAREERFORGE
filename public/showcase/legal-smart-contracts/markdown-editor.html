<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Smart Contracts - Markdown Clause Sandbox</title>
  <link rel="stylesheet" href="markdown-editor.css">
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #090a0f;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="editor-root"></div>
  </div>

  <script type="module">
    import { LegalSmartContractsMarkdownParser } from './markdown-editor.js';

    const parser = new LegalSmartContractsMarkdownParser();
    const root = document.getElementById('editor-root');
    parser.renderToDOM(root);
  </script>
</body>
</html>
