<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legal Smart Contracts - State Debugger</title>
  <link rel="stylesheet" href="state-debugger.css">
</head>
<body class="debugger-body">
  <div class="debugger-container">
    <h2>Legal Smart Contracts State Time-Machine</h2>
    <div id="diffViewer"></div>
    <pre id="stateViewer"></pre>
  </div>
  <script type="module">
    import { LegalSmartContractsStateDebugger } from './state-debugger.js';
    const dbg = new LegalSmartContractsStateDebugger({ active: true, count: 1 });
    document.getElementById('stateViewer').textContent = JSON.stringify(dbg.getCurrentState(), null, 2);
  </script>
</body>
</html>
