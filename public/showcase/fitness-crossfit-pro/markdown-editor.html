<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrossFit Pro - Markdown Documentation Sandbox</title>
  <link rel="stylesheet" href="./markdown-editor.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    #editor-root {
      max-width: 1000px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="editor-root"></div>

  <script type="module">
    import { FitnessCrossfitProMarkdownParser } from './markdown-editor.js';

    const root = document.getElementById('editor-root');
    const parser = new FitnessCrossfitProMarkdownParser();
    parser.renderToDOM(root);
  </script>
</body>
</html>
