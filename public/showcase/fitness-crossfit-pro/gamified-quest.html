<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrossFit Pro - Milestones & Badges</title>
  <link rel="stylesheet" href="./gamified-quest.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    #quest-root {
      max-width: 900px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="quest-root"></div>

  <script type="module">
    import { FitnessCrossfitProQuestEngine } from './gamified-quest.js';

    const root = document.getElementById('quest-root');
    const engine = new FitnessCrossfitProQuestEngine();
    engine.renderToDOM(root);
  </script>
</body>
</html>
