<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraInitia — Global Reforestation & Ocean Climate Alliance</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="pill">🌱 501(c)(3) CLIMATE INITIATIVE</div>
    <h1>Restoring 10 Million Acres of Rainforest by 2030</h1>
    <p>Open-source satellite tracking &amp; verified community reforestation grants.</p>
    <button className="donate-btn" onclick="openDonateModal()">Plant 10 Trees ($15) ↗</button>
  </header>

  <main className="impact">
    <div className="card">
      <h3>14,820,000+</h3>
      <p>Trees Planted Worldwide</p>
    </div>
    <div className="card">
      <h3>42 Countries</h3>
      <p>Local Farming Partners</p>
    </div>
    <div className="card">
      <h3>100% Transparent</h3>
      <p>On-Chain Satellite Verification</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
