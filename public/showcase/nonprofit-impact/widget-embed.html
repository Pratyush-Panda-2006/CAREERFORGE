<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerraInitia — Restoration impact widget</title>
  <link rel="stylesheet" href="widget-embed.css">
  <script type="module" src="widget-embed.js"></script>
</head>
<body>
  <!-- Embed with ?parentOrigin=https%3A%2F%2Fyour-site.example; see the bridge contract in widget-embed.js. -->
  <main class="widget" data-nonprofit-widget aria-labelledby="widget-title">
    <header class="widget-header">
      <span class="wordmark">TerraInitia<span aria-hidden="true"> ↗</span></span>
      <span class="demo">Showcase · sample data</span>
    </header>
    <div class="widget-story">
      <p class="eyebrow">Rooted in restoration</p>
      <h1 id="widget-title">A greener future,<br>one native tree at a time.</h1>
      <p class="intro">Community-led restoration, with a place for everyone.</p>
    </div>
    <section class="impact" aria-label="Sample restoration impact">
      <div class="lead-metric"><strong>1.2M<span aria-hidden="true">+</span></strong><span>native saplings planted</span></div>
      <dl><div><dt>Acres conserved</dt><dd>42,500</dd></div><div><dt>Communities supported</dt><dd>18</dd></div></dl>
    </section>
    <footer>
      <button type="button" data-widget-action disabled>Support restoration <span aria-hidden="true">↗</span></button>
      <a href="index.html" target="_blank" rel="noopener noreferrer">Explore the project</a>
      <p class="status" data-widget-status role="status">Widget preview. Demo only; no payments.</p>
    </footer>
  </main>
</body>
</html>
