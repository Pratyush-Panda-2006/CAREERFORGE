<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonprofit Impact - Reactive Toast Notification Queue</title>
  <link rel="stylesheet" href="./event-notifier.css">
</head>
<body class="nonprofit-toast-theme">
  <div class="toast-hub-container">
    <header class="toast-header">
      <div class="branding-group">
        <span class="bell-icon">🔔</span>
        <h2>Nonprofit Impact Audio & Reactive Notification Hub</h2>
      </div>
      <div class="header-controls">
        <label class="toggle-audio-label">
          <input type="checkbox" id="toggleAudioFeedback" checked>
          <span>Audio Chimes</span>
        </label>
      </div>
    </header>

    <div class="triggers-panel">
      <h3>Dispatch Test Impact Alerts</h3>
      <div class="trigger-buttons-row">
        <button class="btn-trigger btn-info" data-toast-type="info" data-toast-title="Volunteer Signed" data-toast-msg="A new volunteer joined the climate initiative team.">Info Toast</button>
        <button class="btn-trigger btn-success" data-toast-type="success" data-toast-title="Donation Received" data-toast-msg="$250 pledged towards clean water well project.">Success Toast</button>
        <button class="btn-trigger btn-warning" data-toast-type="warning" data-toast-title="Goal Deadline" data-toast-msg="Q4 campaign goal closes in less than 48 hours.">Warning Toast</button>
        <button class="btn-trigger btn-danger" data-toast-type="danger" data-toast-title="Emergency Appeal" data-toast-msg="Urgent relief supplies needed in disaster corridor.">Danger Toast</button>
      </div>
    </div>

    <!-- Active Toast Viewport -->
    <div id="toastNotificationViewport" class="toast-viewport-stack" aria-live="polite">
      <!-- Toasts dynamically appended here -->
    </div>
  </div>

  <script type="module" src="./event-notifier.js"></script>
</body>
</html>
