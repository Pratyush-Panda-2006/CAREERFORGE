<div class="luxury-telemetry-container" id="luxury-telemetry-card">
  <div class="luxury-telemetry-header">
    <div class="luxury-telemetry-title-block">
      <div class="luxury-telemetry-badge">
        <span class="luxury-pulse-gold"></span>
        <span>MARKET TELEMETRY</span>
      </div>
      <h3 class="luxury-telemetry-heading">Portfolio Valuation Index & Investor Velocity</h3>
    </div>

    <div class="luxury-telemetry-controls">
      <div class="luxury-time-pills" role="radiogroup" aria-label="Time Window Range">
        <button type="button" class="luxury-time-pill" data-window="1H">1H</button>
        <button type="button" class="luxury-time-pill is-active" data-window="24H">24H</button>
        <button type="button" class="luxury-time-pill" data-window="7D">7D</button>
      </div>
    </div>
  </div>

  <div class="luxury-telemetry-kpis">
    <div class="luxury-kpi-item">
      <span class="luxury-kpi-label">Market Velocity Index</span>
      <span class="luxury-kpi-value" id="luxury-kpi-velocity">582.4 pts</span>
      <span class="luxury-kpi-trend positive">+14.2%</span>
    </div>
    <div class="luxury-kpi-item">
      <span class="luxury-kpi-label">Active Private Inquiries</span>
      <span class="luxury-kpi-value" id="luxury-kpi-inquiries">18 / hr</span>
      <span class="luxury-kpi-trend positive">+8.5%</span>
    </div>
    <div class="luxury-kpi-item">
      <span class="luxury-kpi-label">VIP Viewing Conversions</span>
      <span class="luxury-kpi-value" id="luxury-kpi-viewings">94.2%</span>
      <span class="luxury-kpi-trend neutral">Stable</span>
    </div>
  </div>

  <div class="luxury-canvas-wrapper">
    <canvas
      id="luxury-realms-telemetry-canvas"
      width="780"
      height="260"
      aria-label="Interactive market telemetry line graph"
    ></canvas>

    <div id="luxury-telemetry-tooltip" class="luxury-tooltip-bubble" style="display:none;">
      <div class="luxury-tooltip-time" id="luxury-tooltip-time">14:00</div>
      <div class="luxury-tooltip-val">
        <span class="luxury-gold-dot"></span>
        <span id="luxury-tooltip-metric">Valuation Index: 520 pts</span>
      </div>
      <div class="luxury-tooltip-sub" id="luxury-tooltip-inq">16 VIP Inquiries</div>
    </div>
  </div>
</div>
