<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Realms - LRU In-Memory Cache & Eviction Visualizer</title>
  <link rel="stylesheet" href="lru-cache.css">
</head>
<body>
  <div class="lru-container" data-lru-cache-lab>
    <header class="header">
      <h1>Luxury Realms Portfolio LRU Cache</h1>
      <p class="subtitle">O(1) Hash-Map and Doubly-Linked-List backed estate cache with visual LRU node eviction tracking</p>
    </header>

    <main class="grid-layout">
      <!-- Occupancy & Capacity Slider -->
      <section class="card capacity-card">
        <h2>Portfolio Cache Capacity & Occupancy</h2>
        <div class="capacity-control">
          <label for="capacity-slider">Max Capacity: <strong id="capacity-val">4</strong> estate listings</label>
          <input type="range" id="capacity-slider" min="2" max="8" value="4">
        </div>
        <div class="progress-bar-bg">
          <div id="occupancy-bar" class="progress-bar-fill" style="width: 75%;"></div>
        </div>
        <div id="occupancy-text" class="occupancy-status">3 / 4 slots used (75%)</div>
      </section>

      <!-- Key-Value Operations -->
      <section class="card operations-card">
        <h2>Estate Cache Operations</h2>
        <div class="form-row">
          <input type="text" id="key-input" placeholder="Estate ID (e.g. villa:monaco-azure)">
          <input type="text" id="val-input" placeholder="Valuation / Details (e.g. Monaco Penthouse €48M)">
        </div>
        <div class="action-buttons">
          <button id="insert-btn" class="btn btn-primary">PUT Estate</button>
          <button id="lookup-btn" class="btn btn-secondary">GET Estate</button>
          <button id="clear-btn" class="btn btn-outline">Purge Cache</button>
        </div>
        <div id="lookup-result" class="lookup-output"></div>
      </section>

      <!-- Ordered Node Chain Diagram -->
      <section class="card chain-card">
        <h2>Ordered Estate Node Chain (MRU ➜ LRU)</h2>
        <div id="node-chain" class="node-chain-container">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Eviction Log -->
      <section class="card eviction-card">
        <h2>Portfolio Eviction Log</h2>
        <div id="eviction-log" class="eviction-log-container">
          <!-- Populated dynamically -->
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="lru-cache.js"></script>
</body>
</html>
