<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Realms - Property Acquisition Pipeline & Workflow Engine</title>
  <link rel="stylesheet" href="workflow-pipeline.css">
</head>
<body style="background: #020617; min-height: 100vh; padding: 2rem;">
  <main class="lr-pipeline-wrapper">
    <header>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Trophy Asset Acquisition Pipeline</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Interactive Kanban pipeline coordinating VIP sourcing, legal due diligence, sovereign escrow, and bespoke concierge handover.</p>
    </header>

    <section class="lr-pipeline-toolbar" aria-label="Pipeline controls">
      <div style="font-size: 0.85rem; color: #94a3b8;">
        Drag acquisition cards between columns to transition escrow milestones.
      </div>
      <div class="lr-board-actions">
        <button id="btn-add-task" class="lr-board-btn">+ New Asset Deal</button>
        <button id="btn-export-json" class="lr-board-btn" style="background: #475569;">Export JSON</button>
      </div>
    </section>

    <section id="pipeline-container" aria-live="polite">
      <!-- Kanban board dynamically mounted here -->
    </section>
  </main>

  <script type="module">
    import { LuxuryRealmsPipelineEngine } from './workflow-pipeline.js';

    const container = document.getElementById('pipeline-container');
    const engine = new LuxuryRealmsPipelineEngine();

    function update() {
      engine.render(container, () => {
        // Updated state callback
      });
    }

    document.getElementById('btn-add-task').addEventListener('click', () => {
      const title = prompt('Enter Acquisition Deal Title:', 'Bel Air Neo-Classical Manor');
      if (title && title.trim()) {
        try {
          engine.addCard('prospecting', {
            title: title.trim(),
            priority: 'high',
            advisor: 'Senior Partner',
            valuationM: 45.0
          });
          update();
        } catch (err) {
          alert(err.message);
        }
      }
    });

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const json = engine.exportPipelineJSON();
      navigator.clipboard.writeText(json);
      alert('Deal pipeline JSON exported to clipboard!');
    });

    update();
  </script>
</body>
</html>
