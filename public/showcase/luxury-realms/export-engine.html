<div class="luxury-export-widget" id="luxury-export-engine-menu">
  <div class="luxury-export-dropdown">
    <button type="button" class="luxury-export-trigger" id="luxury-export-trigger-btn" aria-haspopup="true" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Export Dossier</span>
      <svg class="luxury-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    <div class="luxury-export-popover" id="luxury-export-popover-menu" role="menu">
      <div class="luxury-popover-header">
        <span class="luxury-popover-tag">CONFIDENTIAL EXPORT</span>
        <span class="luxury-popover-desc">Select format for estate report</span>
      </div>

      <div class="luxury-popover-options">
        <button type="button" class="luxury-export-option" id="luxury-export-json" role="menuitem">
          <div class="luxury-option-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </div>
          <div class="luxury-option-text">
            <span class="luxury-option-title">Download JSON Data</span>
            <span class="luxury-option-sub">Structured full portfolio metadata</span>
          </div>
        </button>

        <button type="button" class="luxury-export-option" id="luxury-export-csv" role="menuitem">
          <div class="luxury-option-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
          </div>
          <div class="luxury-option-text">
            <span class="luxury-option-title">Export CSV Table</span>
            <span class="luxury-option-sub">Spreadsheet compatible matrix</span>
          </div>
        </button>

        <button type="button" class="luxury-export-option" id="luxury-export-markdown" role="menuitem">
          <div class="luxury-option-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 7 4 4 20 4 20 7"></polyline>
              <line x1="9" y1="20" x2="15" y2="20"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
            </svg>
          </div>
          <div class="luxury-option-text">
            <span class="luxury-option-title">Copy Markdown Audit</span>
            <span class="luxury-option-sub">Executive briefing formatted summary</span>
          </div>
        </button>
      </div>

      <div class="luxury-popover-footer" id="luxury-export-status" style="display:none;">
        <span class="luxury-status-indicator">✓</span>
        <span class="luxury-status-text">Export created successfully</span>
      </div>
    </div>
  </div>
</div>
