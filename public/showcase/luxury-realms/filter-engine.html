<div class="luxury-filter-container" id="luxury-filter-engine-widget">
  <div class="luxury-filter-toolbar">
    <div class="luxury-search-box">
      <svg class="luxury-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="luxury-search-input"
        class="luxury-search-input"
        placeholder="Search prime estates by name, location, or architectural style..."
        aria-label="Search prime estates"
      >
      <button type="button" id="luxury-search-clear" class="luxury-clear-btn" aria-label="Clear search" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="luxury-sort-box">
      <label for="luxury-sort-select" class="luxury-sort-label">Sort By:</label>
      <select id="luxury-sort-select" class="luxury-sort-select" aria-label="Sort estates">
        <option value="price:desc">Valuation (Highest First)</option>
        <option value="price:asc">Valuation (Lowest First)</option>
        <option value="areaSqft:desc">Interior Area (Largest First)</option>
        <option value="areaSqft:asc">Interior Area (Compact First)</option>
        <option value="rating:desc">Curator Rating (Highest First)</option>
        <option value="name:asc">Estate Title (A-Z)</option>
      </select>
    </div>
  </div>

  <div class="luxury-tag-strip" id="luxury-tag-chips" role="group" aria-label="Filter by luxury amenities">
    <button type="button" class="luxury-tag-chip" data-tag="waterfront">Waterfront</button>
    <button type="button" class="luxury-tag-chip" data-tag="helipad">Helipad</button>
    <button type="button" class="luxury-tag-chip" data-tag="infinity-pool">Infinity Pool</button>
    <button type="button" class="luxury-tag-chip" data-tag="private-dock">Private Dock</button>
    <button type="button" class="luxury-tag-chip" data-tag="historic">Historic</button>
    <button type="button" class="luxury-tag-chip" data-tag="wine-cellar">Wine Cellar</button>
    <button type="button" class="luxury-tag-chip" data-tag="spa">Private Spa</button>
    <button type="button" class="luxury-tag-chip" data-tag="smart-home">Smart Home</button>
  </div>

  <div class="luxury-filter-status">
    <span id="luxury-results-count" class="luxury-count-pill">Showing 8 premier sanctuaries</span>
    <button type="button" id="luxury-reset-filters-btn" class="luxury-reset-link" style="display:none;">Reset all filters</button>
  </div>

  <div id="luxury-empty-state" class="luxury-empty-card" style="display:none;">
    <div class="luxury-empty-icon">✧</div>
    <h4>No Architectural Sanctuaries Found</h4>
    <p>No prime listings currently match your criteria. Try adjusting your tags or search keyword.</p>
  </div>
</div>
