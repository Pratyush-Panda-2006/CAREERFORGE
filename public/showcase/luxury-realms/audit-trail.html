<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luxury Realms - Cryptographic Audit Ledger</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-trail-container">
    <div class="audit-header">
      <h2>Cryptographic Property State Ledger</h2>
      <span id="chainStatusPill" class="status-pill status-pass">VALID</span>
    </div>
    <div class="audit-controls">
      <select id="eventTypeSelect">
        <option value="PROPERTY_LISTED">PROPERTY_LISTED</option>
        <option value="PRICE_REVISED">PRICE_REVISED</option>
        <option value="ESCROW_OPENED">ESCROW_OPENED</option>
        <option value="TITLE_TRANSFERRED">TITLE_TRANSFERRED</option>
      </select>
      <input type="text" id="propertyInput" placeholder="Property identifier...">
      <button id="recordEventBtn" class="btn-primary">Record Event</button>
      <button id="verifyChainBtn" class="btn-secondary">Verify Ledger</button>
    </div>
    <div id="auditChainList" class="chain-feed"></div>
  </div>
  <script type="module" src="audit-trail.js"></script>
</body>
</html>
