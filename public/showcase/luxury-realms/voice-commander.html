<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Realms - Voice Commander</title>
  <link rel="stylesheet" href="voice-commander.css">
</head>
<body>
  <div class="voice-commander">
    <header class="vc-header">
      <div>
        <h1>Voice Commander</h1>
        <p class="vc-subtitle">Web Speech API accessibility &amp; shortcut dispatcher</p>
      </div>
      <div class="vc-status" id="vcStatus">Idle</div>
    </header>

    <div class="vc-toolbar">
      <button class="vc-mic-btn" id="vcMicBtn" aria-label="Start voice listening">
        <span class="vc-mic-icon">&#128266;</span>
        <span class="vc-mic-label">Start Listening</span>
      </button>
      <button class="vc-clear-btn" id="vcClearBtn">Clear History</button>
    </div>

    <div class="vc-wave-container">
      <div class="vc-wave-ring" id="vcWaveRing1"></div>
      <div class="vc-wave-ring" id="vcWaveRing2"></div>
      <div class="vc-wave-ring" id="vcWaveRing3"></div>
      <div class="vc-wave-center" id="vcWaveCenter">&#128266;</div>
    </div>

    <div class="vc-console">
      <div class="vc-console-header">
        <div class="vc-console-title">Recognized Command History</div>
        <div class="vc-count" id="vcCommandCount">0</div>
      </div>
      <div id="vcCommandFeed"></div>
    </div>

    <div class="vc-toast" id="vcToast">Command executed</div>

    <script type="module" src="voice-commander.js"></script>
  </div>
</body>
</html>
