<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Realms - Property Deed & Term Sheet Diff Inspector</title>
  <link rel="stylesheet" href="diff-viewer.css">
</head>
<body style="background: #020617; min-height: 100vh; padding: 2rem;">
  <main class="lr-diff-container">
    <header>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Deed & Escrow Term Sheet Diff Inspector</h1>
      <p style="color: #94a3b8; font-size: 0.9rem;">Inspect visual line changes between original purchase contracts, title deed addendums, and concierge agreements.</p>
    </header>

    <section class="lr-diff-inputs" aria-label="Input comparison text">
      <div class="lr-diff-textarea-group">
        <label for="orig-code">Original Escrow Agreement Terms</label>
        <textarea id="orig-code" class="lr-diff-textarea">ESTATE: Villa Sole di Capri
OFFER_PRICE: €28,500,000
EARNEST_DEPOSIT: 10%
INSPECTION_PERIOD_DAYS: 30
FURNITURE_INCLUDED: false
PRIVATE_MOORING_PERMIT: true</textarea>
      </div>

      <div class="lr-diff-textarea-group">
        <label for="mod-code">Counter-Offer Addendum</label>
        <textarea id="mod-code" class="lr-diff-textarea">ESTATE: Villa Sole di Capri
OFFER_PRICE: €29,200,000
EARNEST_DEPOSIT: 15%
INSPECTION_PERIOD_DAYS: 14
FURNITURE_INCLUDED: true (Artisanal Custom)
PRIVATE_MOORING_PERMIT: true
HELIPAD_AVIGATION_EASEMENT: granted</textarea>
      </div>
    </section>

    <section class="lr-diff-toolbar" aria-label="Diff viewer actions">
      <span style="font-size: 0.85rem; color: #94a3b8;">Unified Diff Telemetry</span>
      <button id="btn-recompute" style="padding: 0.4rem 0.85rem; background: #b45309; border: none; border-radius: 5px; color: #fff; cursor: pointer; font-weight: 600;">Recompute Diff</button>
    </section>

    <section id="diff-output" aria-live="polite">
      <!-- Diff lines dynamically rendered -->
    </section>
  </main>

  <script type="module">
    import { LuxuryRealmsDiffInspector } from './diff-viewer.js';

    const origInput = document.getElementById('orig-code');
    const modInput = document.getElementById('mod-code');
    const outputContainer = document.getElementById('diff-output');
    const recomputeBtn = document.getElementById('btn-recompute');

    const inspector = new LuxuryRealmsDiffInspector();

    function update() {
      inspector.computeDiff(origInput.value, modInput.value);
      inspector.render(outputContainer);
    }

    origInput.addEventListener('input', update);
    modInput.addEventListener('input', update);
    recomputeBtn.addEventListener('click', update);

    update();
  </script>
</body>
</html>
