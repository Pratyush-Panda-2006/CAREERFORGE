<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luxury Realms - Telemetry Benchmark</title>
  <link rel="stylesheet" href="benchmark-suite.css">
</head>
<body>
  <div class="benchmark-container">
    <div class="benchmark-header">
      <h2>Architectural Raycast & Valuation Benchmark</h2>
    </div>
    <div class="benchmark-controls">
      <input type="number" id="benchmarkIterations" value="1000" min="100" max="100000" step="100">
      <button id="runBenchmarkBtn" class="btn-benchmark">Run Benchmark</button>
    </div>
    <div class="benchmark-metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Throughput (Ops/sec)</div>
        <div id="opsPerSecVal" class="metric-value">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Avg Latency</div>
        <div id="avgLatencyVal" class="metric-value">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">p95 Latency</div>
        <div id="p95Val" class="metric-value">--</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">p99 Latency</div>
        <div id="p99Val" class="metric-value">--</div>
      </div>
    </div>
  </div>
  <script type="module" src="benchmark-suite.js"></script>
</body>
</html>
