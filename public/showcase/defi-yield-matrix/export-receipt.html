<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeFi Yield Matrix - Certificate & PNG Receipt Exporter</title>
  <link rel="stylesheet" href="export-receipt.css">
</head>
<body>
  <div class="receipt-container">
    <header class="receipt-header">
      <div class="badge-tag">Cryptographic Proof Exporter</div>
      <h1>Stake Certificate & PNG Receipt Generator</h1>
      <p>High-DPI 2D Canvas vector rendering engine generating branded deposit certificates with algorithmic barcode encoding and instant PNG export.</p>
    </header>

    <div class="receipt-grid">
      <section class="receipt-card controls-card">
        <h2>Certificate Parameters</h2>
        <div class="form-group">
          <label for="poolInput">Vault / Pool Name</label>
          <input type="text" id="poolInput" value="USDC-ETH High Yield Vault">
        </div>
        <div class="form-group">
          <label for="amountInput">Staked Principal Amount</label>
          <input type="text" id="amountInput" value="25,000.00 USDC">
        </div>
        <div class="form-group">
          <label for="apyInput">Projected APY</label>
          <input type="text" id="apyInput" value="18.45% APY">
        </div>
        <button id="downloadReceiptBtn" class="btn-primary">Download PNG Receipt</button>
      </section>

      <section class="receipt-card preview-card">
        <h2>Live Vector Certificate Preview</h2>
        <div class="canvas-viewport">
          <canvas id="receiptCanvas" width="600" height="400"></canvas>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="export-receipt.js"></script>
</body>
</html>
