<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeFi Yield Matrix - Ambient Soundscape Synthesizer</title>
  <link rel="stylesheet" href="ambient-soundscape.css">
</head>
<body>
  <div class="soundscape-container">
    <header class="soundscape-header">
      <h1>DeFi Yield Matrix - Ambient Acoustic Synthesizer</h1>
      <p>Procedural Web Audio API soundscape synthesizer & multi-channel acoustic mixer for liquidity farming</p>
    </header>

    <section class="visualizer-card">
      <div class="eq-meter">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
      <button id="toggle-play-btn" class="sound-btn">Start Soundscape</button>
    </section>

    <main class="mixer-grid">
      <div class="control-panel">
        <h3>Trading Presets & Master</h3>
        <label for="preset-selector" style="font-size: 0.85rem; color: var(--defi-dim);">Select Focus Ambience:</label>
        <select id="preset-selector" class="preset-dropdown">
          <option value="Liquidity Pool Depth">Liquidity Pool Depth</option>
          <option value="High-Yield Arbitrage Focus">High-Yield Arbitrage Focus</option>
          <option value="Staking Sanctuary Zen">Staking Sanctuary Zen</option>
        </select>

        <div class="channel-row" style="margin-top: 10px;">
          <div class="channel-info">
            <span class="channel-name">Master Volume</span>
            <span id="master-gain-val" class="channel-val">70%</span>
          </div>
          <input type="range" id="master-gain-slider" min="0" max="1" step="0.01" value="0.7" class="channel-slider">
        </div>
      </div>

      <div class="control-panel">
        <h3>Multi-Channel Acoustic Mixer</h3>
        <div id="channels-container"></div>
      </div>
    </main>
  </div>

  <script type="module" src="ambient-soundscape.js"></script>
</body>
</html>
