<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeFi Yield Matrix - Notification Queue & Alert Stream</title>
  <link rel="stylesheet" href="notification-hub.css">
</head>
<body>
  <div class="hub-wrapper">
    <header class="hub-header">
      <h1 class="hub-title">DeFi Yield Matrix Alert Stream & Event Hub</h1>
      <p class="hub-subtitle">Real-time prioritized vault liquidation alerts, impermanent loss warnings, yield harvests, and oracle heartbeats.</p>
    </header>

    <div class="controls-card">
      <h3>Simulate DeFi Protocol Events</h3>
      <div class="btn-grid">
        <button id="triggerCriticalBtn" class="hub-btn hub-btn-critical">Trigger Liquidation Risk</button>
        <button id="triggerWarningBtn" class="hub-btn hub-btn-warning">Trigger Impermanent Loss</button>
        <button id="triggerSuccessBtn" class="hub-btn hub-btn-success">Trigger Harvest Yield</button>
        <button id="triggerInfoBtn" class="hub-btn hub-btn-info">Trigger Oracle Sync</button>
        <button id="clearAllBtn" class="hub-btn hub-btn-secondary">Clear Queue</button>
      </div>
    </div>

    <div class="log-card">
      <h3>Protocol Telemetry Event Audit Log</h3>
      <div id="notificationLogList" class="log-list"></div>
    </div>
  </div>

  <div id="toastViewport" class="toast-viewport"></div>

  <script type="module" src="notification-hub.js"></script>
</body>
</html>
