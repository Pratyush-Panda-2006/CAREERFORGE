<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey — Curated Expedition Travel</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header className="hero">
    <div className="brand">ODYSSEY EXPEDITIONS</div>
    <h1>Uncharted Journeys to the Outer Edges of Earth</h1>
    <p>Hand-crafted luxury eco-tours in Iceland, Patagonia, and Kyoto.</p>
    
    <div className="search-bar">
      <input type="text" placeholder="Where do you want to explore?" />
      <button className="search-btn">Explore Voyages ↗</button>
    </div>
  </header>

  <main className="destinations">
    <h2>FEATURED VOYAGES</h2>
    <div className="grid">
      <div className="card">
        <div className="card-img">🏔️</div>
        <h3>Reykjavik Aurora Glaciers</h3>
        <p>7 Days • Iceland Heli-Hiking</p>
      </div>
      <div className="card">
        <div className="card-img">🏯</div>
        <h3>Kyoto Bamboo Sanctuary</h3>
        <p>10 Days • Private Tea Masters</p>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
