<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Delivery Skyway — Cryptographic Audit Trail</title>
  <link rel="stylesheet" href="audit-trail.css">
</head>
<body>
  <div class="audit-container">
    <header class="audit-header">
      <div class="title-wrap">
        <h1>🔒 Drone Delivery Skyway Cryptographic Flight Audit Trail</h1>
        <p>Isolated immutable audit log module recording flight corridor reservations, telemetry checkpoints, and drone status changes with cryptographic hash chains.</p>
      </div>
      <div id="integrityBadge" class="status-badge status-valid">VERIFYING INTEGRITY...</div>
    </header>

    <div class="controls-bar">
      <select id="filterActionSelect" class="filter-select">
        <option value="ALL">All Recorded Actions</option>
        <option value="GENESIS_INIT">Genesis Init</option>
        <option value="FLIGHT_CORRIDOR_RESERVED">Flight Corridor Reserved</option>
        <option value="WAYPOINT_REACHED">Waypoint Reached</option>
      </select>
      <button type="button" id="logEvent1Btn" class="btn-audit">+ Reserve Corridor</button>
      <button type="button" id="logEvent2Btn" class="btn-audit">+ Waypoint Reached</button>
      <button type="button" id="verifyChainBtn" class="btn-audit btn-primary">🔍 Re-Verify Chain</button>
      <button type="button" id="clearChainBtn" class="btn-audit">🔄 Reset</button>
    </div>

    <div id="auditTimelineContainer" class="timeline-feed">
    </div>

    <nav>
      <a href="index.html" class="back-link">← Return to Drone Delivery Skyway Dashboard</a>
    </nav>
  </div>

  <script type="module" src="audit-trail.js"></script>
</body>
</html>
