<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Delivery Skyway - Telemetry & Sparkline Visualizer</title>
  <link rel="stylesheet" href="telemetry-visualizer.css">
</head>
<body>
  <div class="telemetry-container">
    <div class="telemetry-header">
      <h1>
        Drone Delivery Skyway Telemetry
        <span class="telemetry-badge">Issue #708</span>
      </h1>
      <p>Dynamic altitude trajectories, wind resistance profiles, and interactive waypoint coordinate inspection.</p>
    </div>

    <div class="telemetry-card">
      <div class="toolbar-row">
        <h3 class="telemetry-subtitle">Fleet Altitude Telemetry (Feet AGL)</h3>
        <div class="button-group">
          <button class="time-window-btn" data-window="1H">1H</button>
          <button class="time-window-btn active" data-window="24H">24H</button>
          <button class="time-window-btn" data-window="7D">7D</button>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="drone-delivery-skyway-telemetry-canvas" width="820" height="340"></canvas>
      </div>
    </div>
  </div>

  <div id="telemetry-tooltip" class="telemetry-tooltip"></div>

  <script type="module" src="telemetry-visualizer.js"></script>
</body>
</html>
