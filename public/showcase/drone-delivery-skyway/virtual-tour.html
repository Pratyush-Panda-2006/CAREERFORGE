<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Delivery Skyway - Feature Spotlight Tour</title>
  <link rel="stylesheet" href="./virtual-tour.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #0b1120;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #tour-root {
      max-width: 800px;
      width: 100%;
    }
    .mock-fleet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      max-width: 800px;
      width: 100%;
    }
    .mock-card {
      padding: 1.5rem;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      color: #cbd5e1;
    }
    .mock-card h4 {
      margin: 0 0 0.5rem 0;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="tour-root"></div>

  <div class="mock-fleet-grid">
    <div id="flight-radar-card" class="mock-card">
      <h4>Radar & UTM</h4>
      <p>Low-altitude airspace tracking for delivery quadcopters.</p>
    </div>
    <div id="battery-hub-card" class="mock-card">
      <h4>Battery Swapping Port</h4>
      <p>Automated drone landing dock with thermal cooling.</p>
    </div>
    <div id="payload-bay-card" class="mock-card">
      <h4>Cargo Winch</h4>
      <p>Tether drop-zone lowering and mechanical release lock.</p>
    </div>
    <div id="telemetry-card" class="mock-card">
      <h4>5G Skyway Telemetry</h4>
      <p>Encrypted GCS telemetry and micro-meteorological radar.</p>
    </div>
  </div>

  <script type="module">
    import { DroneDeliverySkywayTourGuide } from './virtual-tour.js';

    const root = document.getElementById('tour-root');
    const guide = new DroneDeliverySkywayTourGuide();
    guide.renderToDOM(root);
  </script>
</body>
</html>
