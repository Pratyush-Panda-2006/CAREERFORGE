<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Launchpad - Offline Queue & Resilient Persistence</title>
  <link rel="stylesheet" href="offline-sync.css">
</head>
<body>
  <div class="offline-container">
    <div class="offline-header">
      <h1 class="offline-title">
        SaaS Offline Configuration Mutation Queue
        <span class="offline-badge">Issue #735</span>
      </h1>
      <p class="offline-description">
        Local-first state engine buffering administrative actions, license seat reallocations, and tier policies with automated replay and conflict resolution.
      </p>
    </div>

    <div class="network-bar">
      <div class="network-toggle-wrapper">
        <span>Network Status:</span>
        <label>
          <input type="checkbox" id="network-status-toggle" checked>
          <span>Online Mode</span>
        </label>
      </div>
      <button id="sync-now-btn" class="btn-primary">Trigger Sync</button>
    </div>

    <div class="action-row">
      <select id="action-select" class="select-input">
        <option value="UPDATE_SEAT_QUOTA">UPDATE_SEAT_QUOTA</option>
        <option value="TOGGLE_FEATURE_FLAG">TOGGLE_FEATURE_FLAG</option>
        <option value="UPDATE_SSO_SAML_SETTINGS">UPDATE_SSO_SAML_SETTINGS</option>
      </select>
      <button id="enqueue-item-btn" class="btn-secondary">Enqueue Administrative Mutation</button>
    </div>

    <div class="queue-section">
      <h3>
        Pending Mutation Queue
        <span id="pending-count-badge" class="badge-pending">0 pending</span>
      </h3>
      <ul id="queue-items-list" class="queue-list"></ul>
    </div>

    <div class="queue-section">
      <h3>Recent Sync History</h3>
      <ul id="history-items-list" class="queue-list"></ul>
    </div>
  </div>

  <script type="module" src="offline-sync.js"></script>
</body>
</html>
