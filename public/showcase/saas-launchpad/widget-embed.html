<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Launchpad - Embeddable Pricing Widget</title>
  <link rel="stylesheet" href="widget-embed.css">
</head>
<body>
  <div class="embed-container">
    <div class="widget-header">
      <div class="widget-title">🚀 Launchpad Pricing</div>
      <div class="tier-badge">
        <span class="tier-dot"></span> ACTIVE TIERS
      </div>
    </div>

    <div class="tiers-grid">
      <div class="tier-card" data-plan="starter">
        <div class="label">Starter</div>
        <div class="value">$19 <span class="unit">/mo</span></div>
      </div>
      <div class="tier-card" data-plan="pro">
        <div class="label">Pro</div>
        <div class="value">$49 <span class="unit">/mo</span></div>
      </div>
    </div>
  </div>

  <script type="module" src="widget-embed.js"></script>
</body>
</html>
