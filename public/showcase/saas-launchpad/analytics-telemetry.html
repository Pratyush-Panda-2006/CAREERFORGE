<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Launchpad - Client Analytics & Telemetry</title>
  <link rel="stylesheet" href="analytics-telemetry.css">
</head>
<body>
  <div class="analytics-layout">
    <header class="analytics-header">
      <div class="header-titles">
        <h2>🚀 SaaS Launchpad Client Analytics Engine</h2>
        <p>Zero-third-party tracking, automatic PII sanitization & scroll interaction telemetry</p>
      </div>
      <button id="exportTelemetryBtn" class="btn btn-export">Export Telemetry JSON</button>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-label">Session Duration</span>
        <span id="sessionDurationVal" class="metric-value">00:00</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Scroll Depth</span>
        <span id="scrollDepthVal" class="metric-value">0%</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Events Logged</span>
        <span id="eventCountVal" class="metric-value">0</span>
      </div>
    </div>

    <div class="controls-panel">
      <h3>Simulate User Interactions</h3>
      <div class="btn-group">
        <button id="trackSignupClickBtn" class="btn btn-primary">Simulate Signup CTA</button>
        <button id="trackPricingViewBtn" class="btn btn-secondary">Simulate Pricing Toggle</button>
        <button id="clearLogBtn" class="btn btn-danger">Clear Telemetry Stream</button>
      </div>
    </div>

    <div class="stream-panel">
      <div class="stream-header">
        <h3>Real-Time Event Stream</h3>
        <span class="stream-status">Live In-Memory Buffer</span>
      </div>
      <div id="eventStreamContainer" class="event-stream-container">
        <!-- Event stream items populate here -->
      </div>
    </div>
  </div>

  <script type="module" src="analytics-telemetry.js"></script>
</body>
</html>
