name: Publish Batch 9 Issues

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of issues to publish (1 to 150, or "all")'
        required: false
        default: 'all'

permissions:
  issues: write
  contents: read

jobs:
  publish-issues:
    name: Publish 150 Level 3 Issues to GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Publish Batch 9 Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/create-batch9-issues.mjs
