name: 24h Claim Expiration Checker

on:
  schedule:
    - cron: '0 * * * *' # Checks every hour
  workflow_dispatch:      # Allows manual trigger

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  check-expired-claims:
    name: Check 24h Claim Deadlines
    runs-on: ubuntu-latest
    steps:
      - name: Scan and Unassign Stale Claims
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

            // Fetch open issues that have assignees
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            for (const issue of issues.data) {
              // Skip issues with no assignees or PRs (issues API also returns PRs)
              if (!issue.assignees || issue.assignees.length === 0 || issue.pull_request) {
                continue;
              }

              // Fetch comments on this issue to find when /claim was issued
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 50
              });

              // Find the latest /claim comment
              const claimComments = comments.data
                .filter(c => c.body.includes('/claim'))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (claimComments.length === 0) continue;

              const latestClaim = claimComments[0];
              const claimTime = new Date(latestClaim.created_at);
              const timeElapsed = now - claimTime;

              if (timeElapsed > TWENTY_FOUR_HOURS_MS) {
                const expiredUsers = issue.assignees.map(a => a.login);

                // Unassign users
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: expiredUsers
                });

                // Remove claimed label if present
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'claimed'
                  });
                } catch (e) {}

                // Post expiration notice
                const expiredMessage = `### ⏰ 24-Hour Claim Expired\n\n` +
                  `@${expiredUsers.join(', @')}, the 24-hour claim window for this issue has expired with no linked Pull Request submitted.\n\n` +
                  `🔓 This issue is now **unassigned and open** for any contributor to claim by replying with **\`/claim\`**.`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: expiredMessage
                });

                console.log(`Unassigned ${expiredUsers.join(', ')} from issue #${issue.number} due to 24h deadline.`);
              }
            }
