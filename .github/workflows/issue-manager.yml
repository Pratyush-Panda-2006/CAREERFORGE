name: Issue Welcome and Claim Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  handle-first-issue:
    name: Tag & Welcome New Issue Creator
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Tag with nsoc26 and Greet First-Time Issue Creator
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.issue.user.login;
            const issueNumber = context.payload.issue.number;

            // Automatically apply 'nsoc26' label to every newly opened issue
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['nsoc26']
              });
              console.log(`Tagged issue #${issueNumber} with 'nsoc26'`);
            } catch (err) {
              console.error(`Error tagging issue #${issueNumber} with 'nsoc26':`, err.message);
            }
            
            // Check previous issues created by this user in this repo
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: 'all'
            });

            // If this is their first issue
            if (issues.data.length <= 1) {
              const welcomeMessage = `### 🎉 Welcome to CAREERFORGE, @${author}!\n\n` +
                `Thank you for creating your very first issue in our repository. We are excited to have you contribute to our open-source showcase!\n\n` +
                `---\n` +
                `### 🚀 How to Claim & Work on this Issue:\n` +
                `- Reply with **\`/claim\`** in the comments below to assign yourself.\n` +
                `- Once assigned, you will have **3 days (72 hours)** to open a linked Pull Request.\n` +
                `- **Remember:** All code submissions must reside strictly within \`public/showcase/\`.\n\n` +
                `Happy coding! 🛠️`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: welcomeMessage
              });
            }

  handle-issue-claim:
    name: Handle /claim Command
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/claim')
    runs-on: ubuntu-latest
    steps:
      - name: Assign User and Set 3-Day Deadline
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;
            const currentAssignees = context.payload.issue.assignees.map(a => a.login);

            // If commenter is already assigned to this issue
            if (currentAssignees.includes(commenter)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `ℹ️ @${commenter}, you are already assigned to this issue! Keep up the great work.`
              });
              return;
            }

            // If already assigned to someone else
            if (currentAssignees.length > 0 && !currentAssignees.includes(commenter)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠️ @${commenter}, this issue is already assigned to @${currentAssignees.join(', @')}. Please choose an unassigned issue.`
              });
              return;
            }

            // Check if current issue is a Level 3 issue
            const issueLabels = (context.payload.issue.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
            const isLevel3 = issueLabels.includes('level3') || issueLabels.includes('level 3');

            // Enforce maximum 4 concurrent Level 3 claims per user
            if (isLevel3) {
              const assignedIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                assignee: commenter,
                state: 'open',
                per_page: 100
              });

              const activeLevel3Issues = assignedIssues.data.filter(item => {
                if (item.pull_request) return false;
                if (item.number === issueNumber) return false;
                const labels = (item.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
                return labels.includes('level3') || labels.includes('level 3');
              });

              if (activeLevel3Issues.length >= 4) {
                const issueListStr = activeLevel3Issues.map(i => `#${i.number}`).join(', ');
                const limitMessage = `### ⚠️ Level 3 Claim Limit Reached (Max 4 Active Claims)\n\n` +
                  `Hello @${commenter},\n\n` +
                  `You have already claimed **${activeLevel3Issues.length} active Level 3 issues** (${issueListStr}).\n\n` +
                  `To ensure fair access to high-value (10-point) tasks across the community, contributors are permitted a maximum of **4 concurrent Level 3 claims**.\n\n` +
                  `👉 **Next Steps:**\n` +
                  `- Please resolve, submit Pull Requests for, and complete your 4 existing Level 3 issues first.\n` +
                  `- Once any of your active Level 3 issues is resolved and closed, you will immediately become eligible to claim another Level 3 issue.\n\n` +
                  `*(Note: This limit applies strictly to Level 3 issues. You are still welcome to claim and contribute to Level 1 and Level 2 issues in the meantime!)*`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: limitMessage
                });
                return;
              }
            }

            // Assign the user
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [commenter]
            });

            // Add assigned label and ensure nsoc26 is present
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['claimed', 'in-progress', 'nsoc26']
              });
            } catch (err) {
              console.log('Label add skipped/optional:', err.message);
            }

            const confirmMessage = `### 🎯 Issue Assigned!\n\n` +
              `@${commenter} has claimed this issue!\n\n` +
              `⏳ **3-Day Timer Started:** Please open a draft or ready Pull Request referencing this issue within **3 days (72 hours)**.\n` +
              `If no PR is submitted within 3 days, the issue will be automatically unassigned for other contributors.\n\n` +
              `Good luck! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: confirmMessage
            });
