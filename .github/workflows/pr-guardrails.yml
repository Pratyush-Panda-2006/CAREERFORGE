name: PR Scope & Safety Guardrails

on:
  pull_request:
    branches:
      - main

jobs:
  pr-guardrails:
    name: Enforce File Scope & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. Scope Check (Restricted to public/showcase/)
        run: |
          echo "Checking modified files in Pull Request..."
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Modified files:"
          echo "$CHANGED_FILES"
          
          INVALID_FILES=""
          for FILE in $CHANGED_FILES; do
            if [[ ! "$FILE" =~ ^public/showcase/ ]]; then
              INVALID_FILES="$INVALID_FILES\n- $FILE"
            fi
          done
          
          if [ -n "$INVALID_FILES" ]; then
            echo -e "❌ PR Scope Guardrail Violation!\nContributors are strictly prohibited from modifying files outside of 'public/showcase/'.\nThe following restricted files were modified:$INVALID_FILES"
            exit 1
          fi
          echo "✅ Scope Check Passed: All modified files are strictly within public/showcase/"

      - name: 2. Verify Linked Issue in PR Description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const issueRegex = /(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#\d+/i;
            if (!issueRegex.test(body)) {
              core.setFailed("PR must reference a valid issue in the description (e.g., 'Closes #12', 'Fixes #101', 'Resolves #5').");
            }

      - name: 3. Verify Showcase Folder Isolation (One Project Per PR)
        run: |
          echo "Checking showcase folder isolation..."
          SHOWCASE_FOLDERS=$(git diff --name-only origin/main...HEAD | grep "^public/showcase/" | cut -d'/' -f3 | sort -u)
          FOLDER_COUNT=$(echo "$SHOWCASE_FOLDERS" | grep -v "^$" | wc -l)

          if [ "$FOLDER_COUNT" -gt 1 ]; then
            echo "::error::Folder Isolation Violation: PR modifies files across multiple showcase projects:"
            echo "$SHOWCASE_FOLDERS"
            echo "Contributors must modify exactly one showcase project directory per PR."
            exit 1
          fi

          echo "✅ Showcase Folder Isolation Passed: PR affects exactly one showcase project directory."

      - name: 4. Asset & Bundle Size Guard (Max 5MB per file, 15MB total)
        run: |
          echo "Checking modified asset file sizes..."
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          OVERSIZED=""
          TOTAL_SIZE_KB=0

          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              SIZE_BYTES=$(wc -c < "$FILE" | tr -d ' ')
              
              if [ $SIZE_BYTES -gt 5242880 ]; then
                SIZE_MB=$((SIZE_BYTES / 1048576))
                OVERSIZED="$OVERSIZED\n- $FILE (${SIZE_MB}MB)"
              fi
              
              SIZE_KB=$((SIZE_BYTES / 1024))
              TOTAL_SIZE_KB=$((TOTAL_SIZE_KB + SIZE_KB))
            fi
          done

          if [ -n "$OVERSIZED" ]; then
            echo "::error::Files larger than 5MB detected. Please compress your assets before submitting:$OVERSIZED"
            exit 1
          fi

          if [ $TOTAL_SIZE_KB -gt 15360 ]; then
            TOTAL_MB=$((TOTAL_SIZE_KB / 1024))
            echo "::error::Total PR asset changes (${TOTAL_MB}MB) exceed the 15MB aggregate size limit."
            exit 1
          fi

          echo "✅ Asset Size Check Passed: All files under 5MB, total changes under 15MB."

      - name: 5. Security Syntax Scan
        run: |
          echo "Scanning modified files for unsafe syntax..."
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          
          VIOLATIONS=0
          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              if grep -n -E "eval\(|document\.cookie|src=['\"]http://" "$FILE"; then
                echo "❌ Unsafe syntax detected in $FILE"
                VIOLATIONS=$((VIOLATIONS+1))
              fi
            fi
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "❌ Security Guardrail Failed: Found $VIOLATIONS unsafe syntax pattern(s) (eval(), document.cookie, or unencrypted HTTP script tags)."
            exit 1
          fi
          echo "✅ Security Check Passed: No unsafe syntax detected."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 6. Integrity Check (Build Verification)
        run: |
          npm ci || npm install
          npm run build
          echo "✅ Integrity Check Passed: Project built successfully."
