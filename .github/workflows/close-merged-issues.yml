name: Close Merged Issues

on:
  schedule:
    # Run every 15 minutes to guarantee all merged PR issues are promptly closed
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  close-issues:
    name: Identify & Close All Merged Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Close All Merged Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/close-merged-issues.mjs
