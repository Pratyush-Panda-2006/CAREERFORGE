name: "OSV-Scanner"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1' # Runs weekly on Monday at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger anytime

permissions:
  contents: read
  security-events: write  # Required to publish findings to GitHub Security tab

jobs:
  osv-scan:
    name: Google OSV Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --format=sarif
            --output=osv-results.sarif
            ./

      - name: Upload Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: osv-results.sarif
