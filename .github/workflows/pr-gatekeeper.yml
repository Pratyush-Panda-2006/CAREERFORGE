name: Contributor PR Gatekeeper

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  validate-and-enforce:
    name: Showcase Scope & Security Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Fetch PR Changed Files & Enforce Showcase Scope
        id: pr-files
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch all modified files in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const filenames = files.map(f => f.filename);
            console.log("Modified files:", filenames);

            // Check for unauthorized files outside public/showcase/
            const unauthorizedFiles = filenames.filter(f => !f.startsWith('public/showcase/'));

            if (unauthorizedFiles.length > 0) {
              const commentBody = `### ⛔ Pull Request Automatically Closed\n\n` +
                `Hello @${context.payload.pull_request.user.login},\n\n` +
                `Thank you for your contribution, but our automated security bot has detected that this PR modifies files **outside** the designated showcase directory (\`public/showcase/\`).\n\n` +
                `#### ❌ Unauthorized Files Detected:\n` +
                unauthorizedFiles.map(f => `- \`${f}\``).join('\n') +
                `\n\n---\n` +
                `### 🛡️ Contribution Scope Policy:\n` +
                `- To maintain repository stability, contributors are **only permitted** to add or modify files inside \`public/showcase/<your-template-name>/\`.\n` +
                `- Core files such as \`src/\`, \`package.json\`, \`.github/\`, or configuration files cannot be modified directly.\n\n` +
                `Please update your branch to only include changes within \`public/showcase/\` and feel free to open a new PR!`;

              // 1. Post detailed explanation comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody
              });

              // 2. Automatically close the PR
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: 'closed'
              });

              core.setFailed(`PR closed automatically: ${unauthorizedFiles.length} unauthorized file(s) modified.`);
            } else {
              console.log("✅ All modified files are safely isolated within public/showcase/");
            }
