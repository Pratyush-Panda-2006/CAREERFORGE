name: Contributor PR Gatekeeper

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  validate-and-enforce:
    name: Showcase Scope & Security Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Description & Showcase Scope
        id: gatekeeper
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prBody = pr.body || '';

            // Check if PR author is a designated collaborator (exempt from showcase-only restriction and issue-linking)
            const isCollaborator = ['harshbok69-bit', 'Pratyush-Panda-2006', 'Pratyush-Panda'].includes(pr.user?.login);
            if (isCollaborator) {
              console.log(`✅ Collaborator PR #${prNumber} by @${pr.user.login}: Exempt from showcase scope and issue linking requirements. Allowed to contribute outside or inside public/showcase/.`);
              return;
            }

            // 0. Automatically tag PR with 'nsoc26'
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['nsoc26']
              });
              console.log(`Tagged PR #${prNumber} with 'nsoc26'`);
            } catch (err) {
              console.error(`Error adding nsoc26 label to PR #${prNumber}:`, err.message);
            }

            // 1. Verify Issue Linking Keyword in PR Description
            // Matches: closes #12, fixes #12, resolve #12, closed #12, etc. (case-insensitive)
            const issueLinkRegex = /\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)\b/i;
            const match = prBody.match(issueLinkRegex);
            const hasLinkedIssue = !!match;

            if (match && match[2]) {
              const linkedIssueNumber = parseInt(match[2], 10);

              // 1a. Ensure linked issue is tagged with 'nsoc26'
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: linkedIssueNumber,
                  labels: ['nsoc26']
                });
                console.log(`Ensured linked issue #${linkedIssueNumber} is tagged with 'nsoc26'`);
              } catch (err) {
                console.error(`Error tagging linked issue #${linkedIssueNumber} with 'nsoc26':`, err.message);
              }

              // 1b. Fetch all labels from the linked issue and mirror them onto this PR
              try {
                const linkedIssue = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: linkedIssueNumber
                });

                if (linkedIssue.data && Array.isArray(linkedIssue.data.labels) && linkedIssue.data.labels.length > 0) {
                  const issueLabels = linkedIssue.data.labels
                    .map(l => (typeof l === 'string' ? l : l.name))
                    .filter(Boolean);

                  if (issueLabels.length > 0) {
                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: prNumber,
                      labels: issueLabels
                    });
                    console.log(`Successfully synced labels [${issueLabels.join(', ')}] from issue #${linkedIssueNumber} to PR #${prNumber}`);
                  }
                }
              } catch (err) {
                console.error(`Error copying labels from issue #${linkedIssueNumber} to PR #${prNumber}:`, err.message);
              }
            }

            if (!hasLinkedIssue) {
              const issueMissingComment = `### ⚠️ Missing Linked Issue Keyword\n\n` +
                `Hello @${pr.user.login},\n\n` +
                `Your Pull Request description does not contain an issue-closing keyword.\n\n` +
                `Please **edit your PR description** to link your claimed issue using one of the following formats:\n` +
                `- \`Closes #<issue-number>\`\n` +
                `- \`Fixes #<issue-number>\`\n` +
                `- \`Resolves #<issue-number>\`\n\n` +
                `*This ensures the corresponding issue is automatically closed when your PR is merged.*`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: issueMissingComment
              });

              core.setFailed("PR validation failed: No valid issue linking keyword found in PR description (e.g., 'Closes #123').");
              return;
            }

            // 2. Fetch and Verify Modified Files
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100
            });

            const filenames = files.map(f => f.filename);
            console.log("Modified files:", filenames);

            const unauthorizedFiles = filenames.filter(f => !f.startsWith('public/showcase/'));

            if (unauthorizedFiles.length > 0) {
              const unauthorizedComment = `### ⛔ Pull Request Automatically Closed\n\n` +
                `Hello @${pr.user.login},\n\n` +
                `Our security bot detected changes **outside** the designated showcase directory (\`public/showcase/\`).\n\n` +
                `#### ❌ Unauthorized Files:\n` +
                unauthorizedFiles.map(f => `- \`${f}\``).join('\n') +
                `\n\n---\n` +
                `### 🛡️ Contribution Scope Policy:\n` +
                `- Contributions must be isolated inside \`public/showcase/<your-template-name>/\`.\n` +
                `- Contributors are welcome to add one or more HTML, CSS, JavaScript, test, or asset files inside their showcase directory.\n` +
                `- Modifications to core files (\`src/\`, \`package.json\`, \`.github/\`, configs) are prohibited.\n\n` +
                `Please update your branch to only modify files in \`public/showcase/\` and submit a new PR.`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: unauthorizedComment
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: 'closed'
              });

              core.setFailed(`PR closed: ${unauthorizedFiles.length} unauthorized file(s) modified.`);
            } else {
              console.log("✅ All checks passed: valid issue link found and files isolated within public/showcase/");
            }
