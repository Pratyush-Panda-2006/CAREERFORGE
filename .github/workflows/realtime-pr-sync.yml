name: PR Merge Issue Closer

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  close-linked-issue:
    name: Close Linked Issue on PR Merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close Linked Issue(s)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const author = pr.user ? pr.user.login : 'contributor';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const textToScan = [
              pr.body || '',
              pr.title || '',
              pr.head?.ref || ''
            ].join('\n');

            const issueNumbers = new Set();

            // 1. Closing keywords
            const kwRegex = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved|issue|task)\b\s*:?\s*#?(\d+)/gi;
            for (const match of textToScan.matchAll(kwRegex)) {
              const num = parseInt(match[1], 10);
              if (num !== prNumber) issueNumbers.add(num);
            }

            // 2. Issue URLs
            const urlRegex = /https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/gi;
            for (const match of textToScan.matchAll(urlRegex)) {
              const num = parseInt(match[1], 10);
              if (num !== prNumber) issueNumbers.add(num);
            }

            // 3. Branch name numbers
            const branchMatch = (pr.head?.ref || '').match(/(\d+)$/);
            if (branchMatch) {
              const num = parseInt(branchMatch[1], 10);
              if (num !== prNumber) issueNumbers.add(num);
            }

            // 4. PR title #number
            for (const match of (pr.title || '').matchAll(/#(\d+)/g)) {
              const num = parseInt(match[1], 10);
              if (num !== prNumber) issueNumbers.add(num);
            }

            console.log(`Identified ${issueNumbers.size} potential linked issues for merged PR #${prNumber}:`, Array.from(issueNumbers));

            for (const issueNum of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNum
                });

                if (issue && !issue.pull_request && issue.state === 'open') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNum,
                    body: `### 🎉 Issue Resolved & Closed\n\nThis issue has been completed and merged via Pull Request #${prNumber}.\n\nThank you @${author} for your contribution to **CAREERFORGE**! 🚀`
                  });

                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issueNum,
                    state: 'closed',
                    state_reason: 'completed'
                  });

                  console.log(`✅ Successfully closed issue #${issueNum} via merged PR #${prNumber}`);
                } else if (issue && issue.pull_request) {
                  console.log(`#${issueNum} is a Pull Request, skipping.`);
                } else {
                  console.log(`Issue #${issueNum} is already closed or not found.`);
                }
              } catch (err) {
                console.warn(`Could not close issue #${issueNum}: ${err.message}`);
              }
            }
