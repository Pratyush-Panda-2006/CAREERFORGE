name: Real-Time PR Merge Sync & Leaderboard

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  handle-merged-pr:
    name: Close Issue and Sync Leaderboard on Merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Close Linked Issue(s)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prBody = pr.body || '';
            const prTitle = pr.title || '';
            const branchName = pr.head ? pr.head.ref : '';
            const author = pr.user ? pr.user.login : 'contributor';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueNumbers = new Set();

            // Match closing keywords in PR body
            const keywordRegex = /\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)\b/gi;
            for (const match of prBody.matchAll(keywordRegex)) {
              issueNumbers.add(parseInt(match[2], 10));
            }

            // Match #<issueNum> in PR title (excluding the PR number itself)
            for (const match of prTitle.matchAll(/#(\d+)/g)) {
              const num = parseInt(match[1], 10);
              if (num !== prNumber) {
                issueNumbers.add(num);
              }
            }

            // Match branch ending with -<issueNum>
            const branchMatch = branchName.match(/-(\d+)$/);
            if (branchMatch) {
              issueNumbers.add(parseInt(branchMatch[1], 10));
            }

            console.log(`Identified ${issueNumbers.size} potential linked issues for merged PR #${prNumber}:`, Array.from(issueNumbers));

            for (const issueNum of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNum
                });

                if (issue && issue.state === 'open') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNum,
                    body: `### 🎉 Issue Resolved & Closed\n\nThis issue has been completed and merged via Pull Request #${prNumber}.\n\nThank you @${author} for your contribution to **CAREERFORGE**! 🚀`
                  });

                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issueNum,
                    state: 'closed',
                    state_reason: 'completed'
                  });

                  console.log(`✅ Successfully closed issue #${issueNum} via merged PR #${prNumber}`);
                } else {
                  console.log(`Issue #${issueNum} is already closed.`);
                }
              } catch (err) {
                console.warn(`Could not close issue #${issueNum}: ${err.message}`);
              }
            }

      - name: Update Real-Time Leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/generate-leaderboard.mjs

      - name: Commit & Push Updated Leaderboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/leaderboard.json
          if git diff --staged --quiet; then
            echo "Leaderboard already up to date."
          else
            git commit -m "chore(leaderboard): real-time update on PR #${{ github.event.pull_request.number }} merge [skip ci]"
            git push origin main
          fi
