name: Publish Batch 18 Issues

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-batch18-issues.yml'

permissions:
  issues: write
  contents: read

jobs:
  publish-batch18:
    name: Publish 300 Multi-Level Issues (Batch 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish Batch 18 Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/create-batch18-issues.mjs
