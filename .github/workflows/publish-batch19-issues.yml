name: Publish Batch 19 Issues

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-batch19-issues.yml'

permissions:
  issues: write
  contents: read

jobs:
  publish-batch19:
    name: Publish 200 Conflict-Free Issues (100 Level 2, 100 Level 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish Batch 19 Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/create-batch19-issues.mjs
